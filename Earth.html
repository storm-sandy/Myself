<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Fascinating Facts About Planet Earth</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            --border-color: #334155;
            --chip-bg: #334155;
            --chip-active: #38bdf8;
            --chip-active-text: #0f172a;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            --border-color: #e2e8f0;
            --chip-bg: #f1f5f9;
            --chip-active: #0284c7;
            --chip-active-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        #search {
            padding: 0.75rem 1.25rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            width: 100%;
            max-width: 400px;
            outline: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        #search:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .theme-toggle {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.75rem 1.25rem;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .theme-toggle:hover {
            border-color: var(--accent);
        }

        /* Category Filter Chips */
        .category-filters {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .chip {
            background-color: var(--chip-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--text-color);
        }

        .chip.active {
            background-color: var(--chip-active);
            color: var(--chip-active-text);
            border-color: var(--chip-active);
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--accent);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .card-number {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-category-badge {
            font-size: 0.7rem;
            background: var(--chip-bg);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .card-text {
            font-size: 1.05rem;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.2rem;
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header>
            <h1>Planet Earth</h1>
            <p class="subtitle">100 Amazing Facts About Our Home World</p>
            <div class="controls">
                <input type="text" id="search" placeholder="Search facts (e.g., oceans, atmosphere, gravity)...">
                <button class="theme-toggle" id="themeToggle">☀️ Light Mode</button>
            </div>
            
            <!-- Category Filter Buttons -->
            <div class="category-filters" id="categoryFilters">
                <button class="chip active" data-category="All">All Categories</button>
                <button class="chip" data-category="Space & Orbit">Space & Orbit</button>
                <button class="chip" data-category="Geology & Structure">Geology & Structure</button>
                <button class="chip" data-category="Oceans & Water">Oceans & Water</button>
                <button class="chip" data-category="Atmosphere & Weather">Atmosphere & Weather</button>
                <button class="chip" data-category="Life & Ecosystems">Life & Ecosystems</button>
            </div>
        </header>

        <div class="grid" id="factsGrid">
            <div class="no-results" id="noResults">No facts found matching your criteria.</div>
        </div>

        <footer>
            <p>&copy; 2026 Planet Earth Factbook. Designed for curious minds.</p>
        </footer>
    </div>

    <script>
        const facts = [
            { text: "Earth is the only planet in our solar system known not to be named after a Greek or Roman god or goddess.", category: "Space & Orbit" },
            { text: "Water covers approximately 71% of the Earth's surface, with 96.5% of that water contained in the oceans.", category: "Oceans & Water" },
            { text: "Earth's atmosphere is composed of roughly 78% nitrogen, 21% oxygen, and 1% other gases like argon and carbon dioxide.", category: "Atmosphere & Weather" },
            { text: "The Earth's core is as hot as the surface of the Sun, reaching temperatures around 5,400°C (9,800°F).", category: "Geology & Structure" },
            { text: "A year on Earth is not exactly 365 days; it takes approximately 365.256 days to complete one full orbit around the Sun.", category: "Space & Orbit" },
            { text: "Earth is the densest planet in the solar system, largely due to its heavy iron-nickel core.", category: "Geology & Structure" },
            { text: "Due to tidal acceleration by the Moon, Earth's rotation is slowing down by about 17 milliseconds every hundred years.", category: "Space & Orbit" },
            { text: "The highest point on Earth is Mount Everest, standing at 8,848.86 meters (29,031.7 feet) above sea level.", category: "Geology & Structure" },
            { text: "The lowest natural point on Earth's surface is the Mariana Trench, plunging about 10,935 meters (35,876 feet) down.", category: "Oceans & Water" },
            { text: "Earth’s magnetic field is generated by electric currents in the liquid outer core composed of molten iron and nickel.", category: "Geology & Structure" },
            { text: "Antarctica holds about 90% of the Earth's ice and roughly 70% of the world's fresh water supply.", category: "Oceans & Water" },
            { text: "The Sahara Desert is the largest hot desert in the world, but Antarctica is technically the largest cold desert.", category: "Oceans & Water" },
            { text: "Earth is the only planet known to harbor life, with millions of distinct species documented so far.", category: "Life & Ecosystems" },
            { text: "The Amazon Rainforest produces roughly 20% of the world's oxygen and is often called the 'lungs of the planet'.", category: "Life & Ecosystems" },
            { text: "Earth's axis is tilted at an angle of 23.4 degrees, which is what gives us our changing seasons.", category: "Space & Orbit" },
            { text: "Lightning strikes the Earth roughly 100 times every single second, adding up to about 8 million strikes a day.", category: "Atmosphere & Weather" },
            { text: "Earthquakes release massive amounts of energy; the largest recorded was the 1960 Valdivia earthquake in Chile, measuring 9.5.", category: "Geology & Structure" },
            { text: "The planet's name comes from old English and Germanic words ('eor(th)e' and 'erda') meaning ground or soil.", category: "Geology & Structure" },
            { text: "Approximately 70% of the Earth's bird species live in tropical forests.", category: "Life & Ecosystems" },
            { text: "The Great Barrier Reef is the world's largest coral reef system and can even be seen from outer space.", category: "Oceans & Water" },
            { text: "Earth's gravity is not uniform everywhere; it varies slightly depending on the local topography and geology.", category: "Geology & Structure" },
            { text: "The deepest hole ever bored by humans is the Kola Superdeep Borehole in Russia, reaching 12,262 meters (40,230 feet) deep.", category: "Geology & Structure" },
            { text: "If the Earth were compressed to the size of a marble, it would become a black hole with a Schwarzschild radius of about 9 millimeters.", category: "Space & Orbit" },
            { text: "The air at high altitudes contains fewer oxygen molecules, which is why climbers need supplemental oxygen on Everest.", category: "Atmosphere & Weather" },
            { text: "Plate tectonics constantly reshape the Earth's surface, moving continents at a rate of a few centimeters per year—about the speed fingernails grow.", category: "Geology & Structure" },
            { text: "About 97% of Earth's water is saline ocean water, leaving only 3% as fresh water.", category: "Oceans & Water" },
            { text: "Of that 3% fresh water, over 68% is locked away in glaciers and ice caps.", category: "Oceans & Water" },
            { text: "The Atacama Desert in Chile is one of the driest places on Earth, with some weather stations never recording a single drop of rain.", category: "Oceans & Water" },
            { text: "Lake Baikal in Russia is the world's oldest and deepest freshwater lake, holding about 20% of the world's unfrozen surface fresh water.", category: "Oceans & Water" },
            { text: "Earth experiences about 500,000 detectable earthquakes every year, though only about 100 of them cause damage.", category: "Geology & Structure" },
            { text: "The Earth's atmosphere protects life by absorbing ultraviolet solar radiation and warming the surface via the greenhouse effect.", category: "Atmosphere & Weather" },
            { text: "The Moon is slowly drifting away from Earth at a rate of about 3.8 centimeters (1.5 inches) per year.", category: "Space & Orbit" },
            { text: "Earth has one natural satellite—the Moon—making it unique among inner rocky planets (Mercury and Venus have none).", category: "Space & Orbit" },
            { text: "The speed of Earth's rotation at the equator is about 1,670 kilometers per hour (1,037 miles per hour).", category: "Space & Orbit" },
            { text: "Earth travels around the Sun at an average speed of about 107,200 kilometers per hour (67,000 miles per hour).", category: "Space & Orbit" },
            { text: "The oldest known minerals found on Earth are tiny zircon crystals from Western Australia, dated to about 4.4 billion years ago.", category: "Geology & Structure" },
            { text: "Earth formed approximately 4.54 billion years ago through accretion from the solar nebula.", category: "Space & Orbit" },
            { text: "The supercontinent Pangaea began breaking apart about 175 million years ago to form the continents we know today.", category: "Geology & Structure" },
            { text: "Approximately 1.5 million species have been named by science, but scientists estimate millions more remain undiscovered.", category: "Life & Ecosystems" },
            { text: "The highest temperature ever recorded on Earth was 56.7°C (134.1°F) in Death Valley, California, in 1913.", category: "Atmosphere & Weather" },
            { text: "The lowest natural temperature ever recorded on Earth was -89.2°C (-128.6°F) at the Soviet Vostok Station in Antarctica in 1983.", category: "Atmosphere & Weather" },
            { text: "About 70% of the Earth's surface is covered by oceans, but we have explored less than 5% of the deep sea.", category: "Oceans & Water" },
            { text: "The Earth's crust is fractured into massive slabs called tectonic plates that float on the semi-fluid mantle.", category: "Geology & Structure" },
            { text: "Tsunamis are usually caused by underwater earthquakes, landslides, or volcanic eruptions, and can travel at speeds of jetliners.", category: "Oceans & Water" },
            { text: "The Earth's magnetic poles are constantly moving; the magnetic North Pole has been drifting northward at an accelerating pace.", category: "Geology & Structure" },
            { text: "Ocean currents, like the Gulf Stream, act like a global conveyor belt regulating climate and weather patterns.", category: "Oceans & Water" },
            { text: "The total mass of all living things on Earth (biomass) is estimated to be around 550 gigatons of carbon.", category: "Life & Ecosystems" },
            { text: "The atmosphere extends up to about 10,000 kilometers (6,200 miles) into space, though 99% of its mass is within 32 km of the surface.", category: "Atmosphere & Weather" },
            { text: "The Earth's biosphere extends from the deepest ocean vents to the lower stratosphere.", category: "Life & Ecosystems" },
            { text: "Volcanoes have played a major role in creating Earth's atmosphere and oceans through the outgassing of water vapor and other gases.", category: "Geology & Structure" },
            { text: "There are around 1,500 potentially active volcanoes worldwide today, not counting the continuous submarine volcanism.", category: "Geology & Structure" },
            { text: "The Mariana Trench is so deep that if Mount Everest were placed at the bottom, its peak would still be covered by over 2 kilometers of water.", category: "Oceans & Water" },
            { text: "Earth is the fifth-largest planet in the solar system in terms of size and mass.", category: "Space & Orbit" },
            { text: "The circumference of the Earth at the equator is roughly 40,075 kilometers (24,901 miles).", category: "Space & Orbit" },
            { text: "The Earth's polar circumference is slightly smaller, measuring about 40,008 kilometers due to flattening at the poles.", category: "Space & Orbit" },
            { text: "Earth's day was only about 6 hours long shortly after its formation billions of years ago.", category: "Space & Orbit" },
            { text: "The Great Green Wall is an African initiative to combat desertification by planting an 8,000-kilometer belt of trees across the continent.", category: "Life & Ecosystems" },
            { text: "The world's largest living structure is the Great Barrier Reef, which can be seen without magnification from orbit.", category: "Oceans & Water" },
            { text: "Approximately 75% of all animal and plant species on Earth went extinct during the Cretaceous-Paleogene extinction event 66 million years ago.", category: "Life & Ecosystems" },
            { text: "The Earth's oceans contain nearly 20 million tons of dissolved gold, mostly diluted throughout vast volumes of seawater.", category: "Oceans & Water" },
            { text: "Raindrops are not shaped like teardrops; smaller ones are spherical, while larger ones flatten at the bottom like hamburger buns due to air resistance.", category: "Atmosphere & Weather" },
            { text: "Earth's sky is blue because of Rayleigh scattering: molecules in the air scatter short-wavelength blue light from the Sun more than other colors.", category: "Atmosphere & Weather" },
            { text: "Sunsets and sunrises appear red and orange because sunlight passes through a thicker layer of atmosphere, scattering away blue and green light.", category: "Atmosphere & Weather" },
            { text: "The Earth's rotation creates the Coriolis effect, which deflects winds and ocean currents to the right in the Northern Hemisphere and left in the Southern.", category: "Atmosphere & Weather" },
            { text: "The oldest known tree on Earth is a bristlecone pine in California named Methuselah, estimated to be over 4,800 years old.", category: "Life & Ecosystems" },
            { text: "Pando, a clonal colony of quaking aspen trees in Utah, shares a single massive underground root system and weighs over 6,000 tons.", category: "Life & Ecosystems" },
            { text: "Earth's interior is divided into layers: the crust, the mantle, the outer core, and the inner core.", category: "Geology & Structure" },
            { text: "The inner core is a solid ball composed primarily of iron and nickel, kept solid despite extreme heat due to immense gravitational pressure.", category: "Geology & Structure" },
            { text: "The outer core is liquid and flows around the inner core, creating the dynamo effect that drives Earth's magnetic field.", category: "Geology & Structure" },
            { text: "Every day, tons of cosmic dust and small meteorites enter Earth's atmosphere, mostly burning up before reaching the ground.", category: "Space & Orbit" },
            { text: "The Tunguska event in 1908 was a massive explosion caused by the airburst of a stony meteoroid over Siberia, flattening 80 million trees.", category: "Atmosphere & Weather" },
            { text: "Earth's oceans absorb more than 90% of the excess heat generated by human-induced global warming.", category: "Oceans & Water" },
            { text: "The highest waterfall in the world is Angel Falls in Venezuela, dropping a continuous 979 meters (3,212 feet).", category: "Oceans & Water" },
            { text: "The Nile is traditionally considered the longest river in the world, stretching approximately 6,650 kilometers (4,132 miles).", category: "Oceans & Water" },
            { text: "The Amazon River discharges more water than the next seven largest independent rivers combined.", category: "Oceans & Water" },
            { text: "Approximately 10% of the Earth's land area is permanently covered by glaciers or ice sheets.", category: "Oceans & Water" },
            { text: "Soil is a living ecosystem; a single teaspoon of healthy garden soil contains billions of microorganisms.", category: "Life & Ecosystems" },
            { text: "Earth experiences two solstices and two equinoxes every single year.", category: "Space & Orbit" },
            { text: "The term 'Blue Planet' was popularized because of how Earth looks from space due to its vast oceans and atmospheric scattering.", category: "Space & Orbit" },
            { text: "Earth is positioned within the Sun's 'Goldilocks zone'—not too hot and not too cold—allowing liquid water to exist stably.", category: "Space & Orbit" },
            { text: "The amount of water on Earth is constant; the water cycle continuously recycles the same water that has been here for billions of years.", category: "Oceans & Water" },
            { text: "The Earth's magnetic poles periodically flip, a process called geomagnetic reversal, occurring irregularly over hundreds of thousands of years.", category: "Geology & Structure" },
            { text: "Coral reefs support about 25% of all marine life despite covering less than 0.1% of the ocean floor.", category: "Oceans & Water" },
            { text: "Bioluminescence—the production of light by living organisms—is extremely common in the deep ocean, where over 75% of deep-sea animals produce light.", category: "Life & Ecosystems" },
            { text: "The fossil record shows that complex multicellular life forms began to flourish rapidly during the Cambrian explosion about 541 million years ago.", category: "Life & Ecosystems" },
            { text: "Wind energy on Earth is caused by uneven heating of the planet's surface by the Sun.", category: "Atmosphere & Weather" },
            { text: "The jet streams are fast-flowing, narrow air currents found in the upper levels of Earth's atmosphere.", category: "Atmosphere & Weather" },
            { text: "Permafrost—ground that remains frozen for two or more consecutive years—covers about a quarter of the Northern Hemisphere's land area.", category: "Geology & Structure" },
            { text: "The world's largest desert outside of the polar regions is the Sahara, spanning roughly 9.2 million square kilometers.", category: "Oceans & Water" },
            { text: "Earth's rotation axis wobbles slightly over a 26,000-year cycle known as axial precession.", category: "Space & Orbit" },
            { text: "The total surface area of the Earth is approximately 510 million square kilometers (197 million square miles).", category: "Space & Orbit" },
            { text: "The land surface area is about 148.9 million square kilometers, making up roughly 29.2% of the total area.", category: "Geology & Structure" },
            { text: "Sound travels about 4.3 times faster in water than it does in air, making the underwater world extremely acoustic.", category: "Oceans & Water" },
            { text: "The deepest living fish ever discovered is the Mariana snailfish, found living at depths of over 8,000 meters.", category: "Oceans & Water" },
            { text: "Tectonic plate activity creates deep ocean trenches, towering mountain ranges, and dynamic rift valleys.", category: "Geology & Structure" },
            { text: "The Earth's atmosphere transitions smoothly into outer space with no sharp boundary, though the Kármán line at 100 km is the recognized convention.", category: "Atmosphere & Weather" },
            { text: "Mass extinctions on Earth have wiped out vast percentages of species, paving the way for new evolutionary lineages to emerge.", category: "Life & Ecosystems" },
            { text: "The Great Salt Lake in Utah is the largest saltwater lake in the Western Hemisphere and a remnant of the prehistoric Lake Bonneville.", category: "Oceans & Water" },
            { text: "Earth's magnetic shield (magnetosphere) deflects harmful solar wind particles, preventing them from stripping away our atmosphere.", category: "Space & Orbit" },
            { text: "Despite its constant motion through space, humanity and all life on Earth call this unique blue marble home, safely journeying around the Sun.", category: "Space & Orbit" }
        ];

        const factsGrid = document.getElementById('factsGrid');
        const searchInput = document.getElementById('search');
        const noResults = document.getElementById('noResults');
        const themeToggle = document.getElementById('themeToggle');
        const categoryFilters = document.getElementById('categoryFilters');
        const body = document.body;

        let currentCategory = 'All';
        let currentSearchQuery = '';

        function renderFacts() {
            factsGrid.innerHTML = '';
            let matchCount = 0;

            facts.forEach((item, index) => {
                const factNum = index + 1;
                const matchesCategory = currentCategory === 'All' || item.category === currentCategory;
                const matchesSearch = item.text.toLowerCase().includes(currentSearchQuery.toLowerCase()) || factNum.toString().includes(currentSearchQuery);

                if (matchesCategory && matchesSearch) {
                    matchCount++;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <div class="card-header-row">
                                <span class="card-number">Fact #${factNum}</span>
                                <span class="card-category-badge">${item.category}</span>
                            </div>
                            <div class="card-text">${highlightMatch(item.text, currentSearchQuery)}</div>
                        </div>
                    `;
                    factsGrid.appendChild(card);
                }
            });

            if (matchCount === 0) {
                noResults.style.display = 'block';
                factsGrid.appendChild(noResults);
            } else {
                noResults.style.display = 'none';
            }
        }

        function highlightMatch(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<mark style="background-color: var(--accent); color: var(--bg-color); padding: 0.1rem 0.2rem; border-radius: 4px;">$1</mark>');
        }

        // Search event listener
        searchInput.addEventListener('input', (e) => {
            currentSearchQuery = e.target.value.trim();
            renderFacts();
        });

        // Category filter click handler
        categoryFilters.addEventListener('click', (e) => {
            if (e.target.classList.contains('chip')) {
                // Update active state on buttons
                document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
                e.target.classList.add('active');

                currentCategory = e.target.getAttribute('data-category');
                renderFacts();
            }
        });

        // Theme toggle logic
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeToggle.textContent = '🌙 Dark Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️ Light Mode';
            }
        });

        // Initial load
        renderFacts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <div class="hidden md:flex md:flex-shrink-0">
            <div class="flex flex-col w-64 bg-indigo-900 text-white">
                <div class="flex items-center justify-center h-16 bg-indigo-950 px-4">
                    <span class="text-xl font-bold tracking-wider"><i class="fa-solid fa-boxes-stacked mr-2"></i> VendorMS</span>
                </div>
                <div class="flex flex-col flex-grow px-4 py-6">
                    <a href="#" class="flex items-center px-4 py-2 mt-2 text-white bg-indigo-800 rounded-lg"><i class="fa-solid fa-house mr-3"></i> Dashboard</a>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex flex-col flex-1 h-full overflow-hidden">
            
            <!-- Top Navbar -->
            <header class="flex items-center justify-between h-16 px-6 bg-white border-b border-gray-200">
                <div class="flex items-center">
                    <h1 class="text-xl font-semibold text-gray-800">Vendor Dashboard</h1>
                </div>
                <div>
                    <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition">
                        <i class="fa-solid fa-plus mr-1"></i> Add New Vendor
                    </button>
                </div>
            </header>

            <!-- Main Viewport -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
                
                <!-- Stat Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex items-center">
                        <div class="p-3 rounded-full bg-indigo-100 text-indigo-600 mr-4"><i class="fa-solid fa-users text-xl"></i></div>
                        <div>
                            <p class="text-sm text-gray-500 font-medium">Total Vendors</p>
                            <h3 id="statTotal" class="text-2xl font-bold text-gray-800">0</h3>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex items-center">
                        <div class="p-3 rounded-full bg-green-100 text-green-600 mr-4"><i class="fa-solid fa-circle-check text-xl"></i></div>
                        <div>
                            <p class="text-sm text-gray-500 font-medium">Active Vendors</p>
                            <h3 id="statActive" class="text-2xl font-bold text-gray-800">0</h3>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex items-center">
                        <div class="p-3 rounded-full bg-red-100 text-red-600 mr-4"><i class="fa-solid fa-circle-xmark text-xl"></i></div>
                        <div>
                            <p class="text-sm text-gray-500 font-medium">Inactive Vendors</p>
                            <h3 id="statInactive" class="text-2xl font-bold text-gray-800">0</h3>
                        </div>
                    </div>
                </div>

                <!-- Table Section -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-4 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <h3 class="text-lg font-medium text-gray-800">Vendor Directory</h3>
                        <div class="w-full sm:w-72">
                            <input type="text" id="searchInput" onkeyup="filterVendors()" placeholder="Search vendors..." class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-200">
                                    <th class="py-3 px-6">Vendor Name</th>
                                    <th class="py-3 px-6">Category / Service</th>
                                    <th class="py-3 px-6">Contact Person</th>
                                    <th class="py-3 px-6">Email / Phone</th>
                                    <th class="py-3 px-6">Status</th>
                                    <th class="py-3 px-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="vendorTableBody" class="divide-y divide-gray-200 text-sm text-gray-700">
                                <!-- Dynamic rows go here -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Add/Edit Vendor Modal -->
    <div id="vendorModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden">
            <div class="flex justify-between items-center bg-gray-50 px-6 py-4 border-b border-gray-200">
                <h3 id="modalTitle" class="text-lg font-semibold text-gray-800">Add New Vendor</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="vendorForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="vendorId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Company / Vendor Name</label>
                    <input type="text" id="name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Category / Service</label>
                        <input type="text" id="category" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contact Person</label>
                        <input type="text" id="contactPerson" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" id="email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                        <input type="text" id="phone" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select id="status" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition">Save Vendor</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Initial Mock Data if LocalStorage is empty
        let vendors = JSON.parse(localStorage.getItem('vendors')) || [
            { id: '1', name: 'Acme Supplies', category: 'Office Stationary', contactPerson: 'John Doe', email: 'john@acme.com', phone: '555-0192', status: 'Active' },
            { id: '2', name: 'TechPro Solutions', category: 'IT & Hardware', contactPerson: 'Jane Smith', email: 'jane@techpro.com', phone: '555-8392', status: 'Active' },
            { id: '3', name: 'Global Logistics Co.', category: 'Shipping', contactPerson: 'Bob Builder', email: 'bob@global.com', phone: '555-4421', status: 'Inactive' }
        ];

        // Render system on load
        document.addEventListener('DOMContentLoaded', () => {
            renderTable();
        });

        function saveToLocalStorage() {
            localStorage.setItem('vendors', JSON.stringify(vendors));
        }

        // Render Table and Update Stats
        function renderTable(dataToRender = vendors) {
            const tableBody = document.getElementById('vendorTableBody');
            tableBody.innerHTML = '';

            if (dataToRender.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-400">No vendors found.</td></tr>`;
                updateStats();
                return;
            }

            dataToRender.forEach(vendor => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition';
                row.innerHTML = `
                    <td class="py-3 px-6 font-medium text-gray-900">${vendor.name}</td>
                    <td class="py-3 px-6"><span class="bg-gray-100 text-gray-800 text-xs px-2.5 py-1 rounded-full">${vendor.category}</span></td>
                    <td class="py-3 px-6">${vendor.contactPerson}</td>
                    <td class="py-3 px-6">
                        <div class="text-xs text-gray-900">${vendor.email}</div>
                        <div class="text-xs text-gray-500">${vendor.phone}</div>
                    </td>
                    <td class="py-3 px-6">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${vendor.status === 'Active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${vendor.status}
                        </span>
                    </td>
                    <td class="py-3 px-6 text-right space-x-2">
                        <button onclick="editVendor('${vendor.id}')" class="text-indigo-600 hover:text-indigo-900"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteVendor('${vendor.id}')" class="text-red-600 hover:text-red-900"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            updateStats();
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = vendors.length;
            document.getElementById('statActive').innerText = vendors.filter(v => v.status === 'Active').length;
            document.getElementById('statInactive').innerText = vendors.filter(v => v.status === 'Inactive').length;
        }

        // Modal Controls
        function openModal() {
            document.getElementById('modalTitle').innerText = 'Add New Vendor';
            document.getElementById('vendorForm').reset();
            document.getElementById('vendorId').value = '';
            document.getElementById('vendorModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('vendorModal').classList.add('hidden');
        }

        // Handle Add / Edit Form Submission
        function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('vendorId').value;
            const name = document.getElementById('name').value;
            const category = document.getElementById('category').value;
            const contactPerson = document.getElementById('contactPerson').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const status = document.getElementById('status').value;

            if (id) {
                // Edit mode
                vendors = vendors.map(v => v.id === id ? { id, name, category, contactPerson, email, phone, status } : v);
            } else {
                // Create mode
                const newVendor = {
                    id: Date.now().toString(),
                    name, category, contactPerson, email, phone, status
                };
                vendors.push(newVendor);
            }

            saveToLocalStorage();
            renderTable();
            closeModal();
        }

        // Edit Vendor Setup
        function editVendor(id) {
            const vendor = vendors.find(v => v.id === id);
            if (!vendor) return;

            document.getElementById('modalTitle').innerText = 'Edit Vendor Details';
            document.getElementById('vendorId').value = vendor.id;
            document.getElementById('name').value = vendor.name;
            document.getElementById('category').value = vendor.category;
            document.getElementById('contactPerson').value = vendor.contactPerson;
            document.getElementById('email').value = vendor.email;
            document.getElementById('phone').value = vendor.phone;
            document.getElementById('status').value = vendor.status;

            document.getElementById('vendorModal').classList.remove('hidden');
        }

        // Delete Vendor
        function deleteVendor(id) {
            if (confirm('Are you sure you want to delete this vendor?')) {
                vendors = vendors.filter(v => v.id !== id);
                saveToLocalStorage();
                renderTable();
            }
        }

        // Search Filter
        function filterVendors() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = vendors.filter(v => 
                v.name.toLowerCase().includes(query) || 
                v.category.toLowerCase().includes(query) || 
                v.contactPerson.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }
    </script>
</body>
</html>

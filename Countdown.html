<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Glassmorphism Countdown</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow-x: hidden;
            padding: 16px;
        }

        /* Ambient glowing background spheres */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.25);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
            top: 10%;
            left: 10%;
            animation: float 8s ease-in-out infinite alternate;
        }

        .ambient-glow.two {
            background: rgba(236, 72, 153, 0.2);
            bottom: 10%;
            right: 10%;
            animation: float 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Main Glass Container */
        .countdown-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 1px rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            text-align: center;
        }

        /* Preset Chips */
        .presets {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .preset-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.9);
        }

        .preset-chip:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Time Setup Inputs View */
        .time-inputs {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .time-input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-input-group input {
            width: 75px;
            height: 70px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: white;
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.2rem;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .time-input-group input:focus {
            border-color: #10b981;
            background: rgba(255, 255, 255, 0.12);
        }

        .time-input-group label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
            text-transform: uppercase;
        }

        .separator {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.2rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
        }

        /* Active Big Countdown Display (Hidden by default until started) */
        .time-display {
            font-family: 'Share Tech Mono', monospace;
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            display: none;
        }

        /* Pulse warning effect when time is low */
        .time-display.warning {
            color: #f87171;
            text-shadow: 0 0 25px rgba(248, 113, 113, 0.5);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.03); opacity: 0.85; }
        }

        /* Controls / Buttons layout */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 16px;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-start.running {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }

        .btn-extra {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: none; /* shown only when running */
        }

        .btn-extra:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.3);
            color: white;
        }

        /* Desktop Media Queries */
        @media (min-width: 768px) {
            .countdown-card {
                padding: 40px;
                max-width: 520px;
            }
            .time-display {
                font-size: 4.8rem;
            }
            .time-input-group input {
                width: 85px;
                height: 80px;
                font-size: 2.6rem;
            }
            h1 {
                font-size: 1.3rem;
            }
            .btn {
                padding: 16px 0;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow two"></div>

    <div class="countdown-card">
        <h1>Glass Countdown</h1>
        
        <!-- Quick Preset Chips -->
        <div class="presets" id="presetsContainer">
            <div class="preset-chip" onclick="setPreset(1)">1m</div>
            <div class="preset-chip" onclick="setPreset(5)">5m</div>
            <div class="preset-chip" onclick="setPreset(15)">15m</div>
            <div class="preset-chip" onclick="setPreset(30)">30m</div>
            <div class="preset-chip" onclick="setPreset(60)">1h</div>
        </div>

        <!-- Setup Input View -->
        <div class="time-inputs" id="inputView">
            <div class="time-input-group">
                <input type="number" id="hoursInput" min="0" max="99" value="00" onfocus="this.select()">
                <label>Hours</label>
            </div>
            <span class="separator">:</span>
            <div class="time-input-group">
                <input type="number" id="minutesInput" min="0" max="59" value="05" onfocus="this.select()">
                <label>Minutes</label>
            </div>
            <span class="separator">:</span>
            <div class="time-input-group">
                <input type="number" id="secondsInput" min="0" max="59" value="00" onfocus="this.select()">
                <label>Seconds</label>
            </div>
        </div>

        <!-- Active Countdown Display View -->
        <div class="time-display" id="displayView">00:05:00</div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-reset" id="resetBtn">Reset</button>
            <button class="btn btn-extra" id="addMinBtn">+1 Min</button>
            <button class="btn btn-start" id="startBtn">Start</button>
        </div>
    </div>

    <script>
        let countdownInterval = null;
        let totalSecondsRemaining = 0;
        let isRunning = false;

        const hoursInput = document.getElementById('hoursInput');
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        
        const inputView = document.getElementById('inputView');
        const displayView = document.getElementById('displayView');
        const presetsContainer = document.getElementById('presetsContainer');
        
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const addMinBtn = document.getElementById('addMinBtn');

        // Quick Preset handler
        function setPreset(minutes) {
            if (isRunning) return;
            hoursInput.value = '00';
            minutesInput.value = String(minutes).padStart(2, '0');
            secondsInput.value = '00';
        }

        // Format input values as user types / leaves inputs
        [hoursInput, minutesInput, secondsInput].forEach(input => {
            input.addEventListener('change', () => {
                let val = parseInt(input.value) || 0;
                if (input !== hoursInput && val > 59) val = 59;
                if (val < 0) val = 0;
                input.value = String(val).padStart(2, '0');
            });
        });

        function formatTimeDisplay(totalSecs) {
            let h = Math.floor(totalSecs / 3600);
            let m = Math.floor((totalSecs % 3600) / 60);
            let s = totalSecs % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // Web Audio API beep sound generator when timer completes
        function playAlarmSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 note
                
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch (e) {
                console.log('Audio Context blocked or not supported');
            }
        }

        function startCountdown() {
            if (!isRunning) {
                // If starting fresh from inputs
                if (totalSecondsRemaining <= 0) {
                    let h = parseInt(hoursInput.value) || 0;
                    let m = parseInt(minutesInput.value) || 0;
                    let s = parseInt(secondsInput.value) || 0;
                    totalSecondsRemaining = (h * 3600) + (m * 60) + s;

                    if (totalSecondsRemaining <= 0) {
                        alert('Please set a valid countdown time!');
                        return;
                    }
                }

                // Switch UI from inputs to active display
                inputView.style.display = 'none';
                presetsContainer.style.display = 'none';
                displayView.style.display = 'block';
                addMinBtn.style.display = 'block';

                displayView.textContent = formatTimeDisplay(totalSecondsRemaining);

                countdownInterval = setInterval(() => {
                    if (totalSecondsRemaining > 0) {
                        totalSecondsRemaining--;
                        displayView.textContent = formatTimeDisplay(totalSecondsRemaining);

                        // Warning pulse when 10 seconds or less remain
                        if (totalSecondsRemaining <= 10 && totalSecondsRemaining > 0) {
                            displayView.classList.add('warning');
                        }
                    }

                    if (totalSecondsRemaining <= 0) {
                        clearInterval(countdownInterval);
                        isRunning = false;
                        startBtn.textContent = 'Start';
                        startBtn.classList.remove('running');
                        displayView.classList.remove('warning');
                        playAlarmSound();
                        alert('Countdown Complete!');
                        resetTimer();
                    }
                }, 1000);

                isRunning = true;
                startBtn.textContent = 'Pause';
                startBtn.classList.add('running');
            } else {
                // Pause countdown
                clearInterval(countdownInterval);
                isRunning = false;
                startBtn.textContent = 'Resume';
                startBtn.classList.remove('running');
            }
        }

        function resetTimer() {
            clearInterval(countdownInterval);
            isRunning = false;
            totalSecondsRemaining = 0;
            
            displayView.style.display = 'none';
            inputView.style.display = 'flex';
            presetsContainer.style.display = 'flex';
            addMinBtn.style.display = 'none';
            displayView.classList.remove('warning');

            startBtn.textContent = 'Start';
            startBtn.classList.remove('running');
        }

        // Add 1 minute on the fly
        addMinBtn.addEventListener('click', () => {
            if (isRunning || totalSecondsRemaining > 0) {
                totalSecondsRemaining += 60;
                displayView.textContent = formatTimeDisplay(totalSecondsRemaining);
                if (totalSecondsRemaining > 10) {
                    displayView.classList.remove('warning');
                }
            }
        });

        startBtn.addEventListener('click', startCountdown);
        resetBtn.addEventListener('click', resetTimer);
    </script>
</body>
</html>

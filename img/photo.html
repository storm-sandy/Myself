
<!DOCTYPE html>
<html lang="en" data-theme="forest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b45">
<title>PhotoNest Pro — Local Photo Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--primary:#176b45;--deep:#104b32;--bg:#f0f6ef;--panel:#fff;--text:#203328;--muted:#718075;--line:#dce8dd;--danger:#c0392b;--shadow:0 4px 18px #173c2110}
[data-theme="dark"]{--primary:#36a875;--deep:#176b45;--bg:#101713;--panel:#1b251e;--text:#e8f4e9;--muted:#a4b5a7;--line:#344438;--shadow:0 4px 18px #0004}
[data-theme="ocean"]{--primary:#087eaa;--deep:#075579;--bg:#edf7fb;--panel:#fff;--text:#193541;--muted:#687f89;--line:#d6e8ee}
[data-theme="sunset"]{--primary:#b95730;--deep:#83371e;--bg:#fff4eb;--panel:#fff;--text:#422d26;--muted:#92796e;--line:#f0ddd1}
[data-theme="lavender"]{--primary:#7454a6;--deep:#503775;--bg:#f5f0fc;--panel:#fff;--text:#322944;--muted:#81758e;--line:#e5dcef}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:800;color:var(--primary)}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--panel);color:var(--text)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:white}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 8px;font-size:12px}
input,select,textarea{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--text)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100dvh - 66px)}
.sidebar{padding:15px;border-right:1px solid var(--line);background:var(--panel)}
.navbtn{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:11px;border:0;background:transparent;color:var(--text);border-radius:9px;margin-bottom:4px}
.navbtn.active,.navbtn:hover{background:color-mix(in srgb,var(--primary) 13%,var(--panel));color:var(--primary)}
.sideheading{margin:18px 4px 8px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.sidealbums{display:grid;gap:4px}
.sidealbum{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;min-width:0;cursor:pointer}
.sidealbum:hover{background:var(--bg)}
.sidealbum span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sidealbum .count{font-size:11px;color:var(--muted)}
.main{padding:20px;min-width:0}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{margin:0;font-size:24px}
.subtle{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:var(--shadow)}
.stat .value{font-size:25px;font-weight:800;margin:4px 0;color:var(--primary)}
.stat .label{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.toolbar .search{flex:1;min-width:130px}
.toolbar select{width:auto;max-width:180px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.photo-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;min-width:0}
.photo-card .thumb{width:100%;height:145px;display:block;object-fit:cover;background:var(--bg);cursor:pointer}
.photo-card .photo-info{padding:9px}
.photo-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;font-size:12px}
.photo-meta{font-size:11px;color:var(--muted);margin-top:4px}
.photo-check{position:absolute;top:7px;left:7px;width:20px;height:20px;accent-color:var(--primary);z-index:2}
.card-menu{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.card-menu button{font-size:11px;padding:5px 7px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;text-align:center;padding:45px 16px;color:var(--muted)}
.empty h2{color:var(--text);margin:8px 0}
.section{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:15px}
.section h2{font-size:16px;margin:0 0 12px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field.full{grid-column:1/-1}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.album-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.album-cover{height:125px;background:var(--bg);display:grid;place-items:center;font-size:40px;overflow:hidden}
.album-cover img{width:100%;height:100%;object-fit:cover}
.album-body{padding:12px}
.album-body h3{margin:0 0 5px;overflow-wrap:anywhere}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;font-size:12px}
th{color:var(--muted)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1000;background:#18281d;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:90%;display:none}
#progressBar{height:5px;background:var(--line);overflow:hidden}
#progressFill{height:100%;width:0;background:var(--primary);transition:width .15s}
#status{font-size:11px;color:var(--muted);padding:7px 13px;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;z-index:100;background:#0009;display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}
.dialog{width:min(560px,100%);max-height:90dvh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:15px;padding:18px}
.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.dialoghead h2{margin:0;font-size:19px}
.viewer{position:fixed;inset:0;background:#050706f5;z-index:200;display:none;color:white;flex-direction:column}
.viewer.open{display:flex}
.viewerbar{display:flex;gap:8px;align-items:center;padding:10px;flex-wrap:wrap;background:#101712;flex-shrink:0}
.viewerbar .filename{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewerstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;position:relative}
.viewerstage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none}
.viewerbar button{background:#26332a;color:#fff;border:1px solid #465448;border-radius:8px;padding:8px 10px}
.viewerbar select{width:auto;background:#26332a;color:#fff;border-color:#465448}
.viewerinfo{font-size:11px;color:#bdc9be;padding:6px 12px;background:#101712}
.hidden{display:none!important}
#fileInput,#folderInput,#zipInput{display:none}
.footerhint{margin-top:16px;font-size:11px;color:var(--muted)}
@media(max-width:760px){
 .layout{grid-template-columns:1fr}
 .sidebar{border-right:0;border-bottom:1px solid var(--line);padding:9px;display:flex;gap:4px;overflow-x:auto;align-items:center}
 .sidebar .sideheading,.sidebar .sidealbums,.sidebar .sideextra{display:none}
 .navbtn{width:auto;white-space:nowrap;margin:0;padding:9px}
 .main{padding:13px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .stat{padding:11px}
 .stat .value{font-size:22px}
 .photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .photo-card .thumb{height:135px}
 .pagehead h1{font-size:21px}
 .formgrid{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .topbar{padding:10px}
}
@media(min-width:761px) and (max-width:1050px){.photo-grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}}


.viewerstage {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  touch-action: none;
  background: #050706;
}

#viewerImg {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  transform-origin: center center;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  will-change: transform;
  touch-action: none;
}

.viewerbar {
  flex-shrink: 0;
}

.viewerbar button {
  min-width: 38px;
  min-height: 38px;
}



</style>
</head>
<body>
<header class="topbar">
 <div class="brand">🌿 PhotoNest Pro <small>Local Photo Manager</small></div>
 <div class="actions">
  <button class="btn primary" id="browseBtn">📂 Browse Photos</button>
  <button class="btn" id="uploadBtn">＋ Upload</button>
  <button class="btn" id="newAlbumBtn">＋ Album</button>
  <button class="btn" id="backupBtn">⬇ Backup</button>
 </div>
</header>
<div id="progressBar"><div id="progressFill"></div></div>
<div id="status">Starting PhotoNest…</div>

<div class="layout">
 <aside class="sidebar" id="sidebar">
  <button class="navbtn active" data-page="photos">🖼️ All Photos</button>
  <button class="navbtn" data-page="albums">📚 Albums</button>
  <button class="navbtn" data-page="analytics">📊 Analytics</button>
  <button class="navbtn" data-page="settings">⚙️ Settings</button>
  <div class="sideheading">YOUR ALBUMS</div>
  <div class="sidealbums" id="sideAlbums"></div>
  <div class="sideextra subtle">Your photos stay in this browser unless exported.</div>
 </aside>
 <main class="main" id="page">
  <div class="empty"><h2>Loading PhotoNest…</h2><p>Please wait.</p></div>
 </main>
</div>

<input id="fileInput" type="file" accept="image/*" multiple>
<input id="folderInput" type="file" accept="image/*" multiple webkitdirectory directory>
<input id="zipInput" type="file" accept=".zip,application/zip">

<div class="modal" id="modal">
 <div class="dialog">
  <div class="dialoghead"><h2 id="modalTitle">PhotoNest</h2><button class="btn" id="modalClose">✕</button></div>
  <div id="modalBody"></div>
 </div>
</div>

<div class="viewer" id="viewer">
 <div class="viewerbar">
  <button id="prevPhoto" title="Previous">◀</button>
  <button id="nextPhoto" title="Next">▶</button>
  <span class="filename" id="viewerName">Photo</span>
  <button id="zoomOut">−</button><button id="zoomIn">＋</button>
  <button id="fitBtn">Fit</button><button id="actualBtn">1:1</button>
  <button id="rotateBtn">↻</button><button id="slideBtn">▶ Slideshow</button>
  <button id="editBtn">✎ Edit</button><button id="closeViewer">✕</button>
 </div>
 <div class="viewerstage" id="viewerStage"><img id="viewerImg" alt="Selected photo"></div>
 <div class="viewerinfo" id="viewerInfo">Loading photo…</div>
</div>
<div id="toast"></div>

<script>
'use strict';
const DB_NAME='PhotoNestStableDB';
const DB_VERSION=1;
const STORE_PHOTOS='photos',STORE_ALBUMS='albums',STORE_SETTINGS='settings';
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
let db=null,photos=[],albums=[],settings={
 mode:'full',theme:'forest',folders:[],autoRescan:false,minutes:5
};
let currentPage='photos',currentAlbumId=null,viewerPhotoId=null,viewerURL=null;
let viewerList=[],viewerIndex=0,zoom=1,rotation=0,slideTimer=null;
let importBusy=false,selectedPhotos=new Set(),objectURLs=new Map(),toastTimer=null;
const themes=['forest','dark','ocean','sunset','lavender'];

function uid(){return crypto.randomUUID?crypto.randomUUID():'p'+Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bytes(n){if(!Number.isFinite(n)||n<=0)return '0 B';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
function dateText(d){try{return new Date(d).toLocaleDateString()}catch{return '—'}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',3000)}
function status(msg){$('#status').textContent=msg}
function progress(n){$('#progressFill').style.width=Math.max(0,Math.min(100,n))+'%'}
function saveError(e){console.error(e);toast(e?.message||'An operation failed.')}
function requestPromise(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('IndexedDB request failed'))})}
function transactionDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Database transaction failed'));tx.onabort=()=>reject(tx.error||new Error('Database transaction aborted'))})}

function openDB(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(new Error('IndexedDB is not supported in this browser. Try Chrome or another modern browser.'));return}
  let req;
  try{req=indexedDB.open(DB_NAME,DB_VERSION)}catch(e){reject(e);return}
  req.onupgradeneeded=()=>{
   const d=req.result;
   if(!d.objectStoreNames.contains(STORE_PHOTOS)){
    const s=d.createObjectStore(STORE_PHOTOS,{keyPath:'id'});
    s.createIndex('albumId','albumId',{unique:false});
    s.createIndex('name','name',{unique:false});
   }
   if(!d.objectStoreNames.contains(STORE_ALBUMS))d.createObjectStore(STORE_ALBUMS,{keyPath:'id'});
   if(!d.objectStoreNames.contains(STORE_SETTINGS))d.createObjectStore(STORE_SETTINGS,{keyPath:'key'});
  };
  req.onsuccess=()=>{db=req.result;db.onversionchange=()=>{db.close();toast('Database updated. Reload PhotoNest.');};resolve(db)};
  req.onerror=()=>reject(req.error||new Error('Could not open IndexedDB'));
  req.onblocked=()=>status('Waiting for another PhotoNest tab to close…');
 });
}
async function allRecords(store){
 const tx=db.transaction(store,'readonly');
 return requestPromise(tx.objectStore(store).getAll());
}
async function putRecord(store,value){
 const tx=db.transaction(store,'readwrite');
 tx.objectStore(store).put(value);
 return transactionDone(tx);
}
async function deleteRecord(store,id){
 const tx=db.transaction(store,'readwrite');
 tx.objectStore(store).delete(id);
 return transactionDone(tx);
}
async function saveSettings(){
 await putRecord(STORE_SETTINGS,{key:'main',value:settings});
}
async function loadData(){
 const [p,a,s]=await Promise.all([allRecords(STORE_PHOTOS),allRecords(STORE_ALBUMS),allRecords(STORE_SETTINGS)]);
 photos=p||[];albums=a||[];
 const stored=s.find(x=>x.key==='main');
 if(stored?.value)settings={...settings,...stored.value};
 if(!Array.isArray(settings.folders))settings.folders=[];
 if(!themes.includes(settings.theme))settings.theme='forest';
 document.documentElement.dataset.theme=settings.theme;
}
async function refreshData(){
 const [p,a]=await Promise.all([allRecords(STORE_PHOTOS),allRecords(STORE_ALBUMS)]);
 photos=p||[];albums=a||[];
 renderSideAlbums();renderPage();
}
function revokeURL(id){const u=objectURLs.get(id);if(u){URL.revokeObjectURL(u);objectURLs.delete(id)}}
function photoBlob(p){return p?.original||p?.thumb||null}
function getURL(p){
 if(!p)return '';
 if(objectURLs.has(p.id))return objectURLs.get(p.id);
 const b=photoBlob(p);if(!b)return '';
 const u=URL.createObjectURL(b);objectURLs.set(p.id,u);return u;
}
function albumPhotos(id){return photos.filter(p=>p.albumId===id)}
function totalSize(){return photos.reduce((n,p)=>n+(p.size||0),0)}
function albumName(id){return albums.find(a=>a.id===id)?.name||'Unsorted'}
function fileExt(name){return (name.split('.').pop()||'').toLowerCase()}
function isImage(f){return f&&((f.type||'').startsWith('image/')||/\.(jpe?g|png|gif|webp|bmp|avif|heic|heif|tiff?)$/i.test(f.name||''))}
function makeThumb(file,max=420){
 return new Promise(resolve=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
   try{
    const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
    canvas.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
    const ctx=canvas.getContext('2d',{alpha:false});
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    canvas.toBlob(b=>{URL.revokeObjectURL(url);resolve(b||file)},'image/jpeg',.82);
   }catch(e){URL.revokeObjectURL(url);resolve(file)}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);resolve(file)};
  img.src=url;
 });
}
async function ensureAlbum(name){
 const clean=(name||'Unsorted').trim()||'Unsorted';
 let a=albums.find(x=>x.name.toLowerCase()===clean.toLowerCase());
 if(a)return a;
 a={id:uid(),name:clean,created:Date.now(),description:''};
 await putRecord(STORE_ALBUMS,a);albums.push(a);return a;
}
async function importFiles(fileList,albumOverride=null){
 if(importBusy){toast('An import is already running.');return}
 const files=Array.from(fileList||[]).filter(isImage);
 if(!files.length){toast('No supported image files selected.');return}
 importBusy=true;let done=0,failed=0,added=0;
 const total=files.length;
 status(`Preparing ${total} photos…`);progress(0);
 try{
  for(let i=0;i<files.length;i++){
   const f=files[i];
   try{
    let album;
    if(albumOverride)album=albums.find(a=>a.id===albumOverride)||await ensureAlbum('Unsorted');
    else{
     const path=f.webkitRelativePath||'';
     const folder=path.includes('/')?path.split('/')[0]:'Imported';
     album=await ensureAlbum(folder);
    }
    const thumb=await makeThumb(f);
    const record={
     id:uid(),name:f.name||('photo-'+Date.now()+'.jpg'),
     type:f.type||'image/jpeg',size:f.size||0,
     lastModified:f.lastModified||Date.now(),
     addedAt:Date.now(),albumId:album.id,
     thumb,original:settings.mode==='full'?f:null,
     relativePath:f.webkitRelativePath||f.name||'',
     width:0,height:0
    };
    await putRecord(STORE_PHOTOS,record);
    photos.push(record);added++;
   }catch(e){console.error('Import failed:',f?.name,e);failed++}
   done++;
   progress(done/total*100);
   status(`Importing ${done}/${total}: ${f.name}${failed?' · failed '+failed:''}`);
   // Yield to keep mobile browsers responsive.
   if(done%3===0)await new Promise(r=>setTimeout(r,0));
  }
 }finally{
  importBusy=false;
  progress(100);
  await refreshData();
  status(`Ready · ${photos.length} photos · ${bytes(totalSize())}`);
  toast(`Imported ${added} photo(s)${failed?`; ${failed} failed`:''}.`);
  setTimeout(()=>progress(0),900);
 }
}
function setPage(page,albumId=null){
 currentPage=page;currentAlbumId=albumId;
 $$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 renderPage();
}
function renderSideAlbums(){
 const box=$('#sideAlbums');
 box.innerHTML=albums.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(a=>
 `<div class="sidealbum" data-nav-album="${esc(a.id)}"><span>📁</span><span>${esc(a.name)}</span><span class="count">${albumPhotos(a.id).length}</span></div>`
 ).join('')||'<div class="subtle">No albums yet</div>';
}
function statsHTML(){
 return `<div class="stats">
 <div class="stat"><div class="label">Total Photos</div><div class="value">${photos.length}</div><div class="subtle">Stored in this browser</div></div>
 <div class="stat"><div class="label">Albums</div><div class="value">${albums.length}</div><div class="subtle">Custom collections</div></div>
 <div class="stat"><div class="label">Original Storage</div><div class="value">${bytes(totalSize())}</div><div class="subtle">Approximate source size</div></div>
 <div class="stat"><div class="label">Storage Mode</div><div class="value" style="font-size:18px">${settings.mode==='full'?'Originals':'Thumbnails'}</div><div class="subtle">${settings.mode==='full'?'Original images saved':'Smaller previews saved'}</div></div>
 </div>`;
}
function photoGridHTML(list){
 if(!list.length)return `<div class="empty"><div style="font-size:38px">🖼️</div><h2>No photos here yet</h2><p>Upload images or browse a folder to get started.</p><button class="btn primary" onclick="$('#fileInput').click()">＋ Upload Photos</button></div>`;
 return `<div class="photo-grid">${list.map(p=>`
 <article class="photo-card">
 <input class="photo-check" type="checkbox" aria-label="Select photo" data-select="${esc(p.id)}" ${selectedPhotos.has(p.id)?'checked':''}>
 <img class="thumb" data-view="${esc(p.id)}" src="${esc(getURL(p))}" loading="lazy" alt="${esc(p.name)}">
 <div class="photo-info"><div class="photo-name" title="${esc(p.name)}">${esc(p.name)}</div>
 <div class="photo-meta">${bytes(p.size)} · ${esc(albumName(p.albumId))}</div>
 <div class="card-menu"><button class="btn small" data-view="${esc(p.id)}">View</button><button class="btn small" data-move="${esc(p.id)}">Move</button><button class="btn small danger" data-delete-photo="${esc(p.id)}">Delete</button></div>

async function exportAlbum(id){

function safeFilename(s){return String(s||'file').replace(/[\\/:*?"<>|]/g,'_').slice(0,180)}

 const u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),3000);
}
async function backupZIP(){

 if(!window.JSZip){toast('ZIP library unavailable. Connect to the internet and retry.');return}
 try{
  const zip=new JSZip();
  zip.file('PhotoNest-metadata.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),settings,albums,photos:photos.map(p=>({id:p.id,name:p.name,type:p.type,size:p.size,albumId:p.albumId,addedAt:p.addedAt,lastModified:p.lastModified,relativePath:p.relativePath}))},null,2));
  for(let i=0;i<photos.length;i++){
   const p=photos[i],b=photoBlob(p);
   if(b)zip.file('Photos/'+safeFilename(p.name),b);
   status(`Preparing backup ${i+1}/${photos.length}: ${p.name}`);
   progress((i+1)/photos.length*70);
   if(i%4===0)await new Promise(r=>setTimeout(r,0));
  }
  const blob=await zip.generateAsync({type:'blob'},m=>progress(70+m.percent*.3));
  downloadBlob(blob,'PhotoNest-Backup-'+new Date().toISOString().slice(0,10)+'.zip');
  settings.lastBackup=Date.now();await saveSettings();
  status('Backup ready');toast('ZIP backup created.');
 }catch(e){saveError(e)}finally{progress(0)}
}

function importJSONPrompt(){

 input.onchange=async()=>{
  const f=input.files?.[0];if(!f)return;
  try{
   const data=JSON.parse(await f.text());
   if(!Array.isArray(data.albums)||!Array.isArray(data.photos))throw new Error('This is not a valid PhotoNest metadata backup.');
   if(!confirm(`Import metadata for ${data.albums.length} album(s) and ${data.photos.length} photo record(s)? Existing records with the same IDs will be replaced. Images are not included in a metadata-only backup.`))return;
   for(const a of data.albums)if(a.id&&a.name)await putRecord(STORE_ALBUMS,a);
   for(const p of data.photos)if(p.id&&p.name)await putRecord(STORE_PHOTOS,{...p,original:null,thumb:null});
   await loadData();await refreshData();toast('Metadata imported. Photos without stored blobs need to be re-imported.');
  }catch(e){saveError(e)}
 };

async function importZIP(file){
 if(!window.JSZip){toast('ZIP library unavailable. Connect to the internet and retry.');return}
 try{
  status('Reading ZIP backup…');const zip=await JSZip.loadAsync(file);
  const metadataFile=zip.file('PhotoNest-metadata.json')||zip.file('metadata.json');
  let meta=null;
  if(metadataFile){try{meta=JSON.parse(await metadataFile.async('text'))}catch(e){console.warn('Could not read metadata',e)}}
  if(meta?.albums){
   for(const a of meta.albums)if(a.id&&a.name){await putRecord(STORE_ALBUMS,a);if(!albums.some(x=>x.id===a.id))albums.push(a)}
  }
  const entries=Object.values(zip.files).filter(f=>!f.dir&&/\.(jpe?g|png|gif|webp|bmp|avif|tiff?)$/i.test(f.name)&&!f.name.toLowerCase().includes('thumbnail'));
  if(!entries.length){toast('No image files found in ZIP.');return}
  let done=0;
  for(const entry of entries){
   try{
    const blob=await entry.async('blob');
    const name=entry.name.split('/').pop()||'photo.jpg';
    const fileObj=new File([blob],name,{type:blob.type||'image/jpeg',lastModified:Date.now()});
    let albumNameFromPath=entry.name.split('/').length>2?entry.name.split('/')[1]:'Imported ZIP';
    const a=await ensureAlbum(albumNameFromPath);
    const thumb=await makeThumb(fileObj);
    const existing=photos.some(p=>p.name===name&&p.size===blob.size);
    if(!existing){
     const p={id:uid(),name,type:fileObj.type,size:fileObj.size,albumId:a.id,addedAt:Date.now(),lastModified:fileObj.lastModified,relativePath:entry.name,thumb,original:settings.mode==='full'?blob:null};
     await putRecord(STORE_PHOTOS,p);photos.push(p);
    }
   }catch(e){console.warn('ZIP image skipped',entry.name,e)}
   done++;progress(done/entries.length*100);status(`Restoring ZIP ${done}/${entries.length}`);
   if(done%3===0)await new Promise(r=>setTimeout(r,0));
  }
  await refreshData();toast(`ZIP restore finished: ${done} image file(s) processed.`);
 }catch(e){saveError(e)}finally{progress(0);status('Ready')}
}

  }
  photos=[];albums=[];settings={mode:'full',theme:'forest',folders:[],autoRescan:false,minutes:5};
  selectedPhotos.clear();document.documentElement.dataset.theme='forest';

}

function setZoom(v) {

  img.style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom}) rotate(${rotation}deg)`;
}

 // Basic pinch zoom and swipe navigation on touch screens.
 
 
 // Touch controls: pinch zoom, drag, and swipe navigation.
 const stage = $('#viewerStage');
 const image = $('#viewerImg');

 let pointers = new Map();
 let gestureMode = '';
 let startX = 0, startY = 0;
 let lastX = 0, lastY = 0;
 let startDistance = 0;
 let startZoom = 1;
 let panX = 0, panY = 0;
 let startPanX = 0, startPanY = 0;
 let moved = false;

 function clampPan() {
   const rect = image.getBoundingClientRect();
   const stageRect = stage.getBoundingClientRect();

   const maxX = Math.max(0, (rect.width - stageRect.width) / 2);
   const maxY = Math.max(0, (rect.height - stageRect.height) / 2);

   panX = Math.max(-maxX, Math.min(maxX, panX));
   panY = Math.max(-maxY, Math.min(maxY, panY));
 }

 function applyTouchTransform() {
   image.style.transform =
     `translate(${panX}px, ${panY}px) scale(${zoom}) rotate(${rotation}deg)`;
 }

 function touchDistance(a, b) {
   return Math.hypot(b.x - a.x, b.y - a.y);
 }

 function touchCenter(a, b) {
   return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
 }

 stage.addEventListener('pointerdown', e => {
   if (!$('#viewer').classList.contains('open')) return;

   e.preventDefault();
   stage.setPointerCapture(e.pointerId);

   pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
   moved = false;

   if (pointers.size === 1) {
     gestureMode = zoom > 1 ? 'pan' : 'swipe';
     startX = lastX = e.clientX;
     startY = lastY = e.clientY;
     startPanX = panX;
     startPanY = panY;
   } else if (pointers.size === 2) {
     const pts = [...pointers.values()];
     gestureMode = 'pinch';
     startDistance = touchDistance(pts[0], pts[1]);
     startZoom = zoom;
     startPanX = panX;
     startPanY = panY;
   }
 });

 stage.addEventListener('pointermove', e => {
   if (!pointers.has(e.pointerId)) return;

   pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

   if (pointers.size >= 2) {
     const pts = [...pointers.values()].slice(0, 2);
     const dist = touchDistance(pts[0], pts[1]);

     if (startDistance > 0) {
       zoom = Math.max(1, Math.min(6, startZoom * dist / startDistance));
       panX = startPanX;
       panY = startPanY;
       applyTouchTransform();
       moved = true;
     }
     return;
   }

   if (pointers.size === 1) {
     const dx = e.clientX - lastX;
     const dy = e.clientY - lastY;

     if (Math.abs(e.clientX - startX) > 5 ||
         Math.abs(e.clientY - startY) > 5) {
       moved = true;
     }

     if (zoom > 1 || gestureMode === 'pan') {
       gestureMode = 'pan';
       panX += dx;
       panY += dy;
       applyTouchTransform();
     }

     lastX = e.clientX;
     lastY = e.clientY;
   }
 });

 function finishPointer(e) {
   const wasSingle = pointers.size === 1;
   const end = pointers.get(e.pointerId);

   if (wasSingle && end && gestureMode === 'swipe' && zoom <= 1.05) {
     const dx = end.x - startX;
     const dy = end.y - startY;

     if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy)) {
       nextPhoto(dx < 0 ? 1 : -1);
     }
   }

   pointers.delete(e.pointerId);

   if (pointers.size === 0) {
     if (zoom <= 1.02) {
       zoom = 1;
       panX = 0;
       panY = 0;
     } else {
       clampPan();
     }

     applyTouchTransform();
     gestureMode = '';
     startDistance = 0;
   } else if (pointers.size === 1) {
     const remaining = [...pointers.values()][0];
     gestureMode = 'pan';
     lastX = remaining.x;
     lastY = remaining.y;
     startPanX = panX;
     startPanY = panY;
   }
 }

 stage.addEventListener('pointerup', finishPointer);
 stage.addEventListener('pointercancel', finishPointer);
 stage.addEventListener('lostpointercapture', e => {
   pointers.delete(e.pointerId);
   if (!pointers.size) gestureMode = '';
 });

 
/* Double-tap / double-click zoom */
const viewerImage = document.querySelector('#viewerImg');
let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;

function handleDoubleZoom(x, y) {
  if (zoom <= 1.05) {
    zoom = 2.5;
  } else {
    zoom = 1;
    panX = 0;
    panY = 0;
  }

  if (typeof applyViewerTransform === 'function') {
    applyViewerTransform();
  } else {
    viewerImage.style.transform =
      `translate(${panX}px, ${panY}px) scale(${zoom}) rotate(${rotation}deg)`;
  }
}

// Desktop double-click
viewerImage.addEventListener('dblclick', function (e) {
  e.preventDefault();
  handleDoubleZoom(e.clientX, e.clientY);
});

// Mobile double-tap
viewerImage.addEventListener('touchend', function (e) {
  if (e.changedTouches.length !== 1) return;

  const touch = e.changedTouches[0];
  const now = Date.now();
  const dx = Math.abs(touch.clientX - lastTapX);
  const dy = Math.abs(touch.clientY - lastTapY);

  if (now - lastTapTime < 320 && dx < 30 && dy < 30) {
    e.preventDefault();
    handleDoubleZoom(touch.clientX, touch.clientY);
    lastTapTime = 0;
  } else {
    lastTapTime = now;
    lastTapX = touch.clientX;
    lastTapY = touch.clientY;
  }
}, { passive: false });

 
}

  status('Startup failed');
 }
}

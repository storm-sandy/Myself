<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>My Calendar Pro</title>

<style>
/* =========================================================
   CALENDAR PRO - MOBILE FIRST
========================================================= */

:root{
    --primary:#1a73e8;
    --primary-soft:#e8f0fe;
    --accent:#4285f4;
    --danger:#ea4335;
    --success:#34a853;
    --warning:#fbbc04;

    --bg:#f8fafd;
    --card:#ffffff;
    --text:#202124;
    --muted:#70757a;
    --border:#e0e3e7;
    --day:#ffffff;
    --weekend:#fafafa;
    --shadow:0 2px 12px rgba(0,0,0,.10);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    height:56px;
    min-height:56px;

    display:flex;
    align-items:center;

    padding:
        0 8px
        env(safe-area-inset-right)
        0 env(safe-area-inset-left);

    background:var(--card);
    border-bottom:1px solid var(--border);

    position:relative;
    z-index:20;
}

.menu-btn,
.search-btn,
.theme-btn{
    width:40px;
    height:40px;
    min-width:40px;

    border:0;
    border-radius:50%;

    background:transparent;
    color:var(--text);

    font-size:20px;

    display:grid;
    place-items:center;
}

.menu-btn:active,
.search-btn:active,
.theme-btn:active{
    background:var(--primary-soft);
}

.app-title{
    flex:1;
    min-width:0;

    padding-left:8px;

    font-size:18px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
   CONTENT
========================================================= */

.content{
    flex:1;
    min-height:0;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
}

/* =========================================================
   MONTH HEADER
========================================================= */

.month-header{
    background:var(--card);

    padding:12px 12px 8px;

    text-align:center;

    border-bottom:1px solid var(--border);
}

.month-title{
    border:0;
    background:transparent;

    color:var(--text);

    font-size:21px;
    font-weight:600;

    padding:5px 12px;

    border-radius:8px;
}

.month-title:active{
    background:var(--primary-soft);
}

.year-subtitle{
    font-size:11px;
    color:var(--muted);
    margin-top:1px;
}

/* =========================================================
   WEEK DAYS
========================================================= */

.weekdays{
    width:100%;

    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));

    background:var(--card);

    border-bottom:1px solid var(--border);
}

.weekdays div{
    height:32px;

    display:grid;
    place-items:center;

    font-size:10px;
    font-weight:600;

    color:var(--muted);
}

/* =========================================================
   MONTH GRID
========================================================= */

.month-grid{
    width:100%;

    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));

    background:var(--border);

    gap:1px;
}

.day{
    min-width:0;

    background:var(--day);

    height:82px;

    padding:4px 2px;

    position:relative;

    overflow:hidden;
}

.day.weekend{
    background:var(--weekend);
}

.day.other{
    opacity:.42;
}

.day-number{
    width:25px;
    height:25px;

    margin:0 auto 2px;

    display:grid;
    place-items:center;

    border-radius:50%;

    font-size:11px;
    font-weight:500;
}

.day.today .day-number{
    background:var(--primary);
    color:white;
    font-weight:bold;
}

.holiday{
    font-size:7px;
    line-height:11px;

    color:#8e44ad;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.event{
    width:100%;
    height:15px;

    margin-top:2px;

    border-radius:3px;

    padding:0 3px;

    line-height:15px;

    color:white;

    font-size:7px;
    font-weight:500;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.more{
    color:var(--primary);

    font-size:8px;

    padding-left:3px;
    margin-top:2px;
}

/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.bottom-nav{
    position:sticky;
    bottom:0;

    background:var(--card);

    border-top:1px solid var(--border);

    padding:
        7px 5px
        calc(7px + env(safe-area-inset-bottom))
        7px;

    z-index:15;
}

.nav-row{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:5px;
}

.nav-btn{
    height:38px;

    border:1px solid var(--border);

    border-radius:19px;

    background:var(--card);
    color:var(--text);

    padding:0 11px;

    font-size:11px;
    white-space:nowrap;
}

.nav-btn:active{
    background:var(--primary-soft);
}

.nav-btn.primary{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

.nav-arrow{
    width:38px;
    padding:0;

    font-size:21px;
}

.view-select{
    height:38px;

    border:1px solid var(--border);
    border-radius:19px;

    background:var(--card);
    color:var(--text);

    padding:0 8px;

    font-size:10px;
}

/* =========================================================
   PICKER
========================================================= */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.42);

    z-index:100;

    display:none;
}

.overlay.show{
    display:block;
}

.picker{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    max-height:80dvh;

    background:var(--card);

    border-radius:20px 20px 0 0;

    z-index:110;

    padding:16px;

    overflow:auto;

    display:none;
}

.picker.show{
    display:block;
}

.picker-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:12px;
}

.picker-year{
    font-size:20px;
    font-weight:bold;
}

.picker-arrows{
    display:flex;
    gap:5px;
}

.circle-btn{
    width:38px;
    height:38px;

    border:0;
    border-radius:50%;

    background:var(--primary-soft);
    color:var(--primary);

    font-size:20px;
}

.month-options{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:8px;
}

.month-option{
    height:43px;

    border:0;
    border-radius:22px;

    background:var(--bg);
    color:var(--text);

    font-size:12px;
}

.month-option.selected{
    background:var(--primary);
    color:white;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box{
    position:fixed;

    top:56px;
    left:0;
    right:0;

    background:var(--card);

    padding:8px;

    z-index:70;

    display:none;

    box-shadow:var(--shadow);
}

.search-box.show{
    display:flex;
    gap:6px;
}

.search-input{
    flex:1;

    height:42px;

    border:1px solid var(--border);
    border-radius:22px;

    padding:0 15px;

    outline:none;

    background:var(--bg);
    color:var(--text);
}

.search-results{
    position:fixed;

    top:106px;
    left:0;
    right:0;
    bottom:0;

    background:var(--card);

    z-index:65;

    overflow:auto;

    display:none;
}

.search-results.show{
    display:block;
}

.result{
    display:flex;

    gap:10px;

    padding:12px;

    border-bottom:1px solid var(--border);
}

.result-color{
    width:5px;
    min-width:5px;

    border-radius:5px;
}

.result-title{
    font-size:14px;
    font-weight:bold;
}

.result-date{
    color:var(--muted);

    font-size:11px;

    margin-top:5px;
}

.result-location{
    color:var(--muted);

    font-size:10px;

    margin-top:4px;
}

/* =========================================================
   DRAWER
========================================================= */

.drawer{
    position:fixed;

    top:0;
    bottom:0;
    left:0;

    width:285px;
    max-width:85vw;

    background:var(--card);

    z-index:200;

    transform:translateX(-110%);

    transition:.22s;

    padding:18px;

    overflow:auto;

    box-shadow:var(--shadow);
}

.drawer.show{
    transform:translateX(0);
}

.drawer-overlay{
    position:fixed;
    inset:0;

    z-index:190;

    background:rgba(0,0,0,.35);

    display:none;
}

.drawer-overlay.show{
    display:block;
}

.drawer-title{
    font-size:21px;
    font-weight:bold;

    margin-bottom:20px;
}

.drawer-create{
    width:100%;
    height:48px;

    border:0;
    border-radius:25px;

    background:var(--card);

    box-shadow:var(--shadow);

    text-align:left;

    padding:0 17px;

    color:var(--text);
}

.drawer-create span{
    color:var(--primary);
    font-size:25px;
    margin-right:8px;
}

.drawer-section{
    margin-top:25px;
}

.drawer-section-title{
    color:var(--muted);

    font-size:10px;
    font-weight:bold;

    margin-bottom:7px;
}

.drawer-item{
    padding:10px 5px;

    border-radius:7px;

    font-size:13px;
}

.drawer-item:active{
    background:var(--primary-soft);
}

/* =========================================================
   THEME PANEL
========================================================= */

.theme-panel{
    position:fixed;

    right:8px;
    top:55px;

    width:250px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    box-shadow:var(--shadow);

    z-index:150;

    padding:12px;

    display:none;
}

.theme-panel.show{
    display:block;
}

.theme-title{
    font-size:13px;
    font-weight:bold;

    margin-bottom:10px;
}

.themes{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;
}

.theme{
    border:1px solid var(--border);

    background:var(--bg);

    color:var(--text);

    border-radius:7px;

    padding:8px 5px;

    font-size:10px;
}

/* =========================================================
   EVENT MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.45);

    z-index:300;

    display:none;

    align-items:flex-end;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;

    max-height:94dvh;

    overflow:auto;

    background:var(--card);

    border-radius:20px 20px 0 0;
}

.modal-head{
    height:57px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;

    background:var(--card);

    z-index:2;
}

.modal-head h2{
    margin:0;
    font-size:18px;
}

.close{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:transparent;

    font-size:27px;

    color:var(--muted);
}

.form{
    padding:14px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;

    color:var(--muted);

    font-size:9px;
    font-weight:bold;

    margin-bottom:5px;
}

.field input,
.field select,
.field textarea{
    width:100%;

    min-height:42px;

    border:1px solid var(--border);

    border-radius:7px;

    padding:8px 10px;

    background:var(--bg);
    color:var(--text);

    outline:none;
}

.field textarea{
    min-height:75px;
    resize:vertical;
}

.two{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;
}

.checkbox{
    display:flex;
    align-items:center;

    gap:8px;
}

.checkbox input{
    width:18px;
    height:18px;
}

.checkbox label{
    margin:0;
}

.colors{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.color{
    width:29px;
    height:29px;

    border-radius:50%;

    border:3px solid var(--card);

    box-shadow:0 0 0 1px #aaa;
}

.color.active{
    box-shadow:
        0 0 0 2px var(--primary);
}

.modal-actions{
    position:sticky;
    bottom:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        10px 14px
        calc(10px + env(safe-area-inset-bottom));

    border-top:1px solid var(--border);

    background:var(--card);
}

.btn{
    min-height:40px;

    border:0;
    border-radius:7px;

    padding:0 15px;

    background:transparent;
    color:var(--text);
}

.btn.primary{
    background:var(--primary);
    color:white;
}

.btn.danger{
    color:var(--danger);
}

/* =========================================================
   DETAILS
========================================================= */

.details{
    padding:18px;
}

.details-title{
    font-size:21px;
    font-weight:bold;

    margin-bottom:20px;
}

.detail{
    display:flex;

    gap:12px;

    margin:16px 0;

    font-size:13px;
}

.detail-icon{
    width:24px;
}

/* =========================================================
   OTHER VIEWS
========================================================= */

.agenda{
    background:var(--card);
}

.agenda-date{
    padding:12px;

    background:var(--bg);

    color:var(--muted);

    font-size:12px;
    font-weight:bold;

    border-bottom:1px solid var(--border);
}

.agenda-event{
    display:flex;

    gap:10px;

    padding:12px;

    min-height:65px;

    border-bottom:1px solid var(--border);
}

.agenda-color{
    width:5px;

    border-radius:5px;
}

.agenda-info{
    min-width:0;
}

.agenda-title{
    font-size:14px;
    font-weight:bold;
}

.agenda-time,
.agenda-location{
    font-size:10px;

    color:var(--muted);

    margin-top:5px;
}

.time-container{
    min-width:600px;
}

.time-header{
    display:grid;

    grid-template-columns:45px repeat(7,1fr);

    height:45px;

    background:var(--card);

    border-bottom:1px solid var(--border);
}

.time-header div{
    display:grid;
    place-items:center;

    font-size:9px;

    border-right:1px solid var(--border);
}

.time-body{
    display:grid;

    grid-template-columns:45px repeat(7,1fr);
}

.time-label{
    height:60px;

    text-align:right;

    padding:4px;

    font-size:8px;

    color:var(--muted);

    border-bottom:1px solid var(--border);
}

.time-cell{
    height:60px;

    position:relative;

    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
}

.time-event{
    position:absolute;

    left:2px;
    right:2px;
    top:2px;

    min-height:35px;

    padding:3px;

    border-radius:4px;

    color:white;

    font-size:8px;

    overflow:hidden;
}

.year-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    padding:8px;
}

.year-month{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:8px;

    padding:6px;
}

.year-title{
    font-size:12px;
    font-weight:bold;

    margin-bottom:4px;
}

.year-days{
    display:grid;
    grid-template-columns:repeat(7,1fr);

    text-align:center;
}

.year-days div{
    font-size:7px;
    padding:3px 0;
}

.year-event-day{
    background:var(--primary);
    color:white;

    border-radius:50%;
}

/* =========================================================
   EMPTY / TOAST
========================================================= */

.empty{
    text-align:center;

    padding:60px 20px;

    color:var(--muted);
}

.empty-icon{
    font-size:40px;
    margin-bottom:10px;
}

.toast{
    position:fixed;

    left:50%;
    bottom:80px;

    transform:
        translate(-50%,120px);

    background:#323232;
    color:white;

    padding:11px 17px;

    border-radius:6px;

    font-size:12px;

    z-index:500;

    transition:.25s;
}

.toast.show{
    transform:
        translate(-50%,0);
}

/* =========================================================
   THEMES
========================================================= */

/* DARK */

body.theme-dark{
    --bg:#202124;
    --card:#292a2d;
    --day:#292a2d;
    --weekend:#303134;

    --text:#e8eaed;
    --muted:#bdc1c6;
    --border:#3c4043;

    --primary:#8ab4f8;
    --primary-soft:#3c4043;
}

/* AMOLED */

body.theme-amoled{
    --bg:#000000;
    --card:#000000;
    --day:#000000;
    --weekend:#050505;

    --text:#ffffff;
    --muted:#aaaaaa;
    --border:#222222;

    --primary:#00bfff;
    --primary-soft:#082f3d;
}

/* OCEAN */

body.theme-ocean{
    --primary:#0077b6;
    --primary-soft:#d9f1ff;
    --bg:#eefaff;
    --card:#ffffff;
    --day:#ffffff;
}

/* FOREST */

body.theme-forest{
    --primary:#2e7d32;
    --primary-soft:#e4f4e4;
    --bg:#f3faf3;
}

/* SUNSET */

body.theme-sunset{
    --primary:#ef6c00;
    --primary-soft:#fff0df;
    --bg:#fff9f4;
}

/* PURPLE */

body.theme-purple{
    --primary:#7e57c2;
    --primary-soft:#eee7fb;
    --bg:#faf8ff;
}

/* ROSE */

body.theme-rose{
    --primary:#d81b60;
    --primary-soft:#fde5ef;
    --bg:#fff8fb;
}

/* IOS */

body.theme-ios{
    --primary:#007aff;
    --primary-soft:#e3f0ff;
    --bg:#f2f2f7;
    --card:#ffffff;
    --day:#ffffff;
}

/* MINIMAL */

body.theme-minimal{
    --primary:#333333;
    --primary-soft:#eeeeee;
    --bg:#ffffff;
    --card:#ffffff;
    --day:#ffffff;
    --border:#dddddd;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .day{
        height:110px;
    }

    .event{
        height:19px;
        line-height:19px;
        font-size:9px;
    }

    .holiday{
        font-size:9px;
    }

    .month-grid{
        max-width:1200px;
        margin:auto;
    }

    .weekdays{
        max-width:1200px;
        margin:auto;
    }

    .bottom-nav{
        max-width:1200px;
        margin:auto;
    }

    .modal{
        max-width:600px;
        margin:auto;
        border-radius:15px;
    }

    .modal-overlay{
        align-items:center;
    }

    .picker{
        left:50%;
        right:auto;
        width:400px;
        transform:translateX(-50%);
        bottom:20px;
        border-radius:18px;
    }

}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

    <button class="menu-btn"
            onclick="openDrawer()">
        ☰
    </button>

    <div class="app-title">
        My Calendar
    </div>

    <button class="search-btn"
            onclick="openSearch()">
        🔍
    </button>

    <button class="theme-btn"
            onclick="toggleThemePanel()">
        ◐
    </button>

</header>

<!-- =====================================================
     SEARCH
===================================================== -->

<div class="search-box"
     id="searchBox">

    <input
        id="searchInput"
        class="search-input"
        placeholder="Search all events..."
        autocomplete="off">

    <button class="search-btn"
            onclick="closeSearch()">
        ×
    </button>

</div>

<div class="search-results"
     id="searchResults">
</div>

<!-- =====================================================
     THEME PANEL
===================================================== -->

<div class="theme-panel"
     id="themePanel">

    <div class="theme-title">
        Choose Theme
    </div>

    <div class="themes">

        <button class="theme"
                onclick="setTheme('default')">
            Google Blue
        </button>

        <button class="theme"
                onclick="setTheme('theme-ios')">
            iOS

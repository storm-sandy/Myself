<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#111827"><title>Basic Folder Audio Player</title><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111827;
    color:white;
}

.app{
    max-width:700px;
    margin:auto;
    padding:15px;
}

/* HEADER */

header{
    text-align:center;
    padding:10px 0 15px;
}

header h2{
    margin:0;
}

header p{
    color:#9ca3af;
    font-size:13px;
}

/* BUTTON */

button{
    border:0;
    cursor:pointer;
    color:white;
    background:#374151;
    padding:10px 14px;
    border-radius:10px;
    font-size:15px;
}

button:hover{
    background:#4b5563;
}

.primary{
    background:#2563eb;
}

.primary:hover{
    background:#1d4ed8;
}

/* PLAYER */

.player{
    background:#1f2937;
    border-radius:18px;
    padding:18px;
    text-align:center;
    box-shadow:0 10px 30px #0005;
}

.cover{
    width:170px;
    height:170px;
    margin:auto;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );
}

.songTitle{
    margin-top:15px;
    font-size:19px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.songInfo{
    color:#9ca3af;
    font-size:13px;
    margin-top:5px;
}

/* AUDIO */

audio{
    width:100%;
    margin-top:15px;
}

/* CONTROLS */

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:12px;
}

.play{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#2563eb;
    font-size:22px;
}

/* OPTIONS */

.options{
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
    margin-top:12px;
}

/* SEARCH */

.search{
    margin-top:15px;
}

.search input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #374151;
    background:#111827;
    color:white;
    outline:none;
}

/* PLAYLIST */

.playlist{
    margin-top:15px;
    background:#1f2937;
    border-radius:15px;
    overflow:hidden;
}

.playlistHeader{
    padding:12px;
    border-bottom:1px solid #374151;
    display:flex;
    justify-content:space-between;
}

.count{
    color:#9ca3af;
    font-size:12px;
}

.song{
    padding:12px;
    border-bottom:1px solid #374151;
    cursor:pointer;
    display:flex;
    gap:10px;
    align-items:center;
}

.song:hover{
    background:#374151;
}

.song.active{
    background:#1d4ed8;
}

.number{
    width:30px;
    text-align:center;
    color:#9ca3af;
}

.songName{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.empty{
    text-align:center;
    padding:35px 15px;
    color:#9ca3af;
}

/* DROP */

.drop{
    margin-top:12px;
    border:2px dashed #4b5563;
    border-radius:12px;
    padding:15px;
    text-align:center;
    color:#9ca3af;
}

.drop.drag{
    border-color:#2563eb;
    color:white;
    background:#1e3a8a;
}

/* MOBILE */

@media(max-width:500px){

    .app{
        padding:10px;
    }

    .cover{
        width:145px;
        height:145px;
    }

    button{
        font-size:14px;
        padding:9px 11px;
    }

}

</style></head><body><div class="app"><header><h2>🎵 Folder Music Player</h2><p>
Select a music folder and play your songs
</p><button
class="primary"
onclick="selectFolder()">
📁 Select Music Folder
</button>

<button
onclick="selectFiles()">
🎵 Select Files
</button>

</header><!-- PLAYER --><div class="player"><div class="cover">
🎵
</div><div
class="songTitle"
id="songTitle">
No song selected
</div><div
class="songInfo"
id="songInfo">
Select a folder to begin
</div><audio
id="audio"
controls>
</audio>

<div class="controls"><button onclick="previous()">
⏮
</button><button
class="play"
id="playButton"
onclick="playPause()">
▶
</button>

<button onclick="next()">
⏭
</button></div><div class="options"><button
id="shuffleButton"
onclick="toggleShuffle()">
🔀 Shuffle
</button>

<button
id="repeatButton"
onclick="toggleRepeat()">
🔁 Repeat Off
</button>

</div></div><!-- SEARCH --><div class="search"><input
id="search"
type="search"
placeholder="🔎 Search songs..."
oninput="showSongs()">

</div><!-- PLAYLIST --><div class="playlist"><div class="playlistHeader"><strong>
🎧 Playlist
</strong><span
class="count"
id="count">
0 songs
</span>

</div><div
id="playlistItems"><div class="empty">📁 Select a music folder

</div></div></div><!-- DROP --><div
class="drop"
id="drop"
ondragover="dragOver(event)"
ondragleave="dragLeave(event)"
ondrop="dropFiles(event)">📂 Drag & Drop audio files here

</div></div><!-- HIDDEN FILE INPUT --><input
type="file"
id="fileInput"
multiple
accept="audio/*"
hidden>

<script>

/* =========================================================
   BASIC FOLDER AUDIO PLAYER
========================================================= */

const audio =
    document.getElementById("audio");

const playlistItems =
    document.getElementById(
        "playlistItems"
    );

let songs=[];

let current=-1;

let shuffle=false;

let repeat=false;


/* =========================================================
   SUPPORTED AUDIO FORMATS
========================================================= */

function isAudio(file){

    return /\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|webm)$/i
        .test(file.name);

}


/* =========================================================
   SELECT FOLDER
========================================================= */

async function selectFolder(){

    if(!window.showDirectoryPicker){

        alert(
            "Folder selection is not supported by this browser.\n\n"+
            "Please use Chrome or Edge over HTTPS."
        );

        return;
    }

    try{

        const folder =
            await window.showDirectoryPicker();

        songs=[];

        await scanFolder(folder);

        finishLoading();

    }catch(error){

        console.log(error);

    }

}


/* =========================================================
   SCAN FOLDER + SUBFOLDERS
========================================================= */

async function scanFolder(folder){

    for await(
        const entry of folder.values()
    ){

        if(entry.kind==="file"){

            if(
                isAudio(entry)
            ){

                const file =
                    await entry.getFile();

                addSong(file);

            }

        }

        else if(
            entry.kind==="directory"
        ){

            await scanFolder(entry);

        }

    }

}


/* =========================================================
   SELECT INDIVIDUAL FILES
========================================================= */

function selectFiles(){

    document
        .getElementById("fileInput")
        .click();

}

document
.getElementById("fileInput")
.addEventListener(
    "change",
    function(e){

        songs=[];

        [...e.target.files]
            .filter(isAudio)
            .forEach(addSong);

        finishLoading();

    }
);


/* =========================================================
   ADD SONG
========================================================= */

function addSong(file){

    if(!file || !isAudio(file))
        return;

    if(
        songs.some(
            song =>
            song.name===file.name &&
            song.size===file.size
        )
    )
        return;

    songs.push({

        file:file,

        name:file.name,

        size:file.size,

        url:null

    });

}


/* =========================================================
   FINISH
========================================================= */

function finishLoading(){

    songs.sort(
        (a,b)=>
        a.name.localeCompare(
            b.name,
            undefined,
            {numeric:true}
        )
    );

    current=-1;

    audio.pause();

    audio.removeAttribute("src");

    document
        .getElementById("songTitle")
        .textContent=
        "Select a song";

    document
        .getElementById("songInfo")
        .textContent=
        songs.length+
        " audio files loaded";

    showSongs();

    updateCount();

}


/* =========================================================
   PLAY SONG
========================================================= */

function playSong(index){

    if(!songs[index])
        return;

    current=index;

    const song =
        songs[index];

    if(!song.url){

        song.url=
            URL.createObjectURL(
                song.file
            );

    }

    audio.src=song.url;

    audio.play();

    document
        .getElementById("songTitle")
        .textContent=
        removeExtension(
            song.name
        );

    document
        .getElementById("songInfo")
        .textContent=
        formatSize(song.size);

    document
        .getElementById("playButton")
        .textContent="⏸";

    showSongs();

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function playPause(){

    if(current===-1){

        if(songs.length){

            playSong(0);

        }

        return;

    }

    if(audio.paused){

        audio.play();

    }else{

        audio.pause();

    }

}


/* =========================================================
   AUDIO EVENTS
========================================================= */

audio.addEventListener(
    "play",
    function(){

        document
            .getElementById(
                "playButton"
            )
            .textContent="⏸";

    }
);

audio.addEventListener(
    "pause",
    function(){

        document
            .getElementById(
                "playButton"
            )
            .textContent="▶";

    }
);


/* =========================================================
   NEXT
========================================================= */

function next(){

    if(!songs.length)
        return;

    let index;

    if(shuffle){

        if(songs.length===1){

            index=current;

        }else{

            do{

                index=
                    Math.floor(
                        Math.random()*
                        songs.length
                    );

            }while(index===current);

        }

    }else{

        index=current+1;

        if(index>=songs.length){

            if(repeat){

                index=0;

            }else{

                audio.pause();

                return;

            }

        }

    }

    playSong(index);

}


/* =========================================================
   PREVIOUS
========================================================= */

function previous(){

    if(!songs.length)
        return;

    if(
        audio.currentTime>5
    ){

        audio.currentTime=0;

        return;

    }

    let index=current-1;

    if(index<0)
        index=songs.length-1;

    playSong(index);

}


/* =========================================================
   SONG ENDED
========================================================= */

audio.addEventListener(
    "ended",
    function(){

        next();

    }
);


/* =========================================================
   SHUFFLE
========================================================= */

function toggleShuffle(){

    shuffle=!shuffle;

    const button=
        document
        .getElementById(
            "shuffleButton"
        );

    button.textContent=
        shuffle
        ? "🔀 Shuffle On"
        : "🔀 Shuffle";

}


/* =========================================================
   REPEAT
========================================================= */

function toggleRepeat(){

    repeat=!repeat;

    const button=
        document
        .getElementById(
            "repeatButton"
        );

    button.textContent=
        repeat
        ? "🔁 Repeat On"
        : "🔁 Repeat Off";

}


/* =========================================================
   PLAYLIST
========================================================= */

function showSongs(){

    playlistItems.innerHTML="";

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const filtered =
        songs.filter(
            song =>
            song.name
            .toLowerCase()
            .includes(query)
        );


    if(!filtered.length){

        playlistItems.innerHTML=`

        <div class="empty">

        ${
            songs.length
            ? "No matching songs"
            : "📁 Select a music folder"

        }

        </div>`;

        return;

    }


    filtered.forEach(song=>{

        const index=
            songs.indexOf(song);

        const row=
            document.createElement(
                "div"
            );

        row.className=
            "song "+
            (
                index===current
                ? "active"
                : ""
            );

        row.onclick=
            ()=>playSong(index);

        row.innerHTML=`

        <div class="number">
            ${index+1}
        </div>

        <div class="songName">

            ${escapeHTML(
                removeExtension(
                    song.name
                )
            )}

        </div>

        `;

        playlistItems.appendChild(row);

    });

}


/* =========================================================
   COUNT
========================================================= */

function updateCount(){

    document
        .getElementById("count")
        .textContent=
        songs.length+
        " song"+
        (
            songs.length!==1
            ? "s"
            : ""
        );

}


/* =========================================================
   DRAG & DROP
========================================================= */

function dragOver(event){

    event.preventDefault();

    document
        .getElementById("drop")
        .classList.add("drag");

}


function dragLeave(){

    document
        .getElementById("drop")
        .classList.remove("drag");

}


function dropFiles(event){

    event.preventDefault();

    dragLeave();

    songs=[];

    [...event.dataTransfer.files]
        .filter(isAudio)
        .forEach(addSong);

    finishLoading();

}


/* =========================================================
   HELPERS
========================================================= */

function removeExtension(name){

    return name.replace(
        /\.[^/.]+$/,
        ""
    );

}


function formatSize(bytes){

    if(bytes<1024*1024){

        return Math.round(
            bytes/1024
        )+" KB";

    }

    return (
        bytes/
        (1024*1024)
    ).toFixed(1)+" MB";

}


function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.target.tagName==="INPUT"
        )
            return;

        if(e.code==="Space"){

            e.preventDefault();

            playPause();

        }

        if(e.code==="ArrowRight"){

            audio.currentTime=
                Math.min(
                    audio.duration||0,
                    audio.currentTime+10
                );

        }

        if(e.code==="ArrowLeft"){

            audio.currentTime=
                Math.max(
                    0,
                    audio.currentTime-10
                );

        }

    }
);

</script></body>
</html>

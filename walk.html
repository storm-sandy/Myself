<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Walk Tracker with Visible GPS Logs</title>
    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 40vh;
            width: 100%;
        }
        #panel {
            height: 12vh;
            background-color: #f8f9fa;
            padding: 10px 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 2px solid #dee2e6;
            border-bottom: 2px solid #dee2e6;
        }
        /* Live GPS HUD Bar */
        #gps-hud {
            height: 7vh;
            background-color: #212529;
            color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 13px;
            padding: 0 10px;
            border-bottom: 1px solid #444;
        }
        .hud-item span {
            color: #4cd137;
            font-family: monospace;
        }
        #controls-panel {
            height: 7vh;
            background-color: #e9ecef;
            padding: 5px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #dee2e6;
        }
        #data-container {
            height: 34vh;
            display: flex;
            background-color: #ffffff;
            box-sizing: border-box;
        }
        .pane-column {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            border-right: 1px solid #dee2e6;
        }
        .pane-column:last-child {
            border-right: none;
        }
        .stat-box {
            text-align: center;
        }
        .stat-box h3 {
            margin: 0 0 3px 0;
            color: #6c757d;
            font-size: 11px;
        }
        .stat-box p {
            margin: 0;
            font-size: 17px;
            font-weight: bold;
            color: #212529;
        }
        button, label.file-btn {
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            background-color: #28a745;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: inline-block;
            text-align: center;
        }
        button.stop {
            background-color: #dc3545;
        }
        button.secondary {
            background-color: #6c757d;
        }
        label.file-btn {
            background-color: #17a2b8;
            margin-bottom: 0;
        }
        input[type="file"] {
            display: none;
        }
        .history-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
            cursor: pointer;
        }
        .history-item:hover {
            background-color: #f1f3f5;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
            background-color: #f8f9fa;
        }
        h3.section-title {
            margin-top: 0;
            font-size: 13px;
            color: #333;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Live Dashboard Panel -->
    <div id="panel">
        <div class="stat-box">
            <h3>Distance</h3>
            <p id="distance">0.00 km</p>
        </div>
        <div class="stat-box">
            <h3>Duration</h3>
            <p id="timer">00:00:00</p>
        </div>
        <div class="stat-box">
            <h3>Avg Pace</h3>
            <p id="pace">00:00 /km</p>
        </div>
        <div>
            <button id="toggleBtn" onclick="toggleTracking()">Start Walk</button>
        </div>
    </div>

    <!-- Live GPS Screen HUD Bar -->
    <div id="gps-hud">
        <div class="hud-item">Lat: <span id="hud-lat">--</span></div>
        <div class="hud-item">Lng: <span id="hud-lng">--</span></div>
        <div class="hud-item">Accuracy: <span id="hud-acc">--</span></div>
    </div>

    <!-- Backup & Export Controls Bar -->
    <div id="controls-panel">
        <div>
            <button class="secondary" onclick="exportData()">Export JSON</button>
            <label class="file-btn">
                Import JSON <input type="file" id="importFile" accept=".json" onchange="importData(event)">
            </label>
        </div>
        <div>
            <button class="secondary" onclick="clearHistory()" style="background-color: #6c757d; font-size: 11px; padding: 5px 8px;">Clear All Data</button>
        </div>
    </div>

    <!-- History and Daily Summary Columns -->
    <div id="data-container">
        <div class="pane-column">
            <h3 class="section-title">Day-Wise Summary</h3>
            <div id="summaryList"></div>
        </div>
        <div class="pane-column">
            <h3 class="section-title">Saved Walk Sessions (Click to View Route)</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <!-- Leaflet JS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        let map;
        let watchId = null;
        let pathCoordinates = [];
        let polylinePath;
        let liveMarker;
        let historicalLayerGroup;

        let isTracking = false;
        let startTime = null;
        let timerInterval = null;
        let totalDistanceMeters = 0;

        function initMap() {
            map = L.map('map').setView([19.2183, 72.9781], 16);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            historicalLayerGroup = L.layerGroup().addTo(map);
            polylinePath = L.polyline([], { color: '#4285F4', weight: 5 }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const pos = [position.coords.latitude, position.coords.longitude];
                        map.setView(pos, 16);
                        liveMarker = L.marker(pos).addTo(map).bindPopup("Current Location");
                        updateHudDisplay(position.coords.latitude, position.coords.longitude, position.coords.accuracy);
                    },
                    () => { console.log("Geolocation lookup failed or blocked."); }
                );
            }

            renderDashboard();
        }

        function updateHudDisplay(lat, lng, accuracy) {
            document.getElementById("hud-lat").innerText = lat.toFixed(6);
            document.getElementById("hud-lng").innerText = lng.toFixed(6);
            document.getElementById("hud-acc").innerText = Math.round(accuracy) + " m";
        }

        function toggleTracking() {
            const btn = document.getElementById("toggleBtn");

            if (!isTracking) {
                if (!navigator.geolocation) {
                    alert("Geolocation is not supported by your browser");
                    return;
                }

                historicalLayerGroup.clearLayers();

                isTracking = true;
                btn.innerText = "Stop Walk";
                btn.className = "stop";
                
                pathCoordinates = [];
                totalDistanceMeters = 0;
                startTime = Date.now();
                
                polylinePath.setLatLngs(pathCoordinates);
                startTimer();

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const newLat = position.coords.latitude;
                        const newLng = position.coords.longitude;
                        const newAccuracy = position.coords.accuracy;
                        const newLatLng = L.latLng(newLat, newLng);

                        updateHudDisplay(newLat, newLng, newAccuracy);

                        if (pathCoordinates.length > 0) {
                            const lastLatLng = pathCoordinates[pathCoordinates.length - 1];
                            const distanceSegment = lastLatLng.distanceTo(newLatLng);
                            totalDistanceMeters += distanceSegment;
                            
                            const distanceKm = totalDistanceMeters / 1000;
                            document.getElementById("distance").innerText = distanceKm.toFixed(2) + " km";
                            
                            const elapsedTimeSec = (Date.now() - startTime) / 1000;
                            document.getElementById("pace").innerText = calculatePace(elapsedTimeSec, distanceKm);
                        }

                        pathCoordinates.push({
                            lat: newLat,
                            lng: newLng,
                            accuracy: newAccuracy,
                            time: new Date().toLocaleTimeString()
                        });

                        const leafletPoints = pathCoordinates.map(p => [p.lat, p.lng]);
                        polylinePath.setLatLngs(leafletPoints);

                        if (liveMarker) {
                            liveMarker.setLatLng(newLatLng);
                        } else {
                            liveMarker = L.marker(newLatLng).addTo(map);
                        }

                        map.setView(newLatLng);
                    },
                    (error) => { console.error("Error watching position: ", error.message); },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );

            } else {
                isTracking = false;
                btn.innerText = "Start Walk";
                btn.className = "";

                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }

                clearInterval(timerInterval);

                if (pathCoordinates.length > 0) {
                    saveWalkSession();
                }
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsedTimeSec = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById("timer").innerText = formatTime(elapsedTimeSec);
                
                const distanceKm = totalDistanceMeters / 1000;
                if (distanceKm > 0) {
                    document.getElementById("pace").innerText = calculatePace(elapsedTimeSec, distanceKm);
                }
            }, 1000);
        }

        function formatTime(totalSeconds) {
            const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const seconds = String(Math.floor(totalSeconds % 60)).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function calculatePace(totalSeconds, distanceKm) {
            if (!distanceKm || distanceKm <= 0) return "00:00 /km";
            const totalMinutes = totalSeconds / 60;
            const paceMinutesPerKm = totalMinutes / distanceKm;
            
            const mins = Math.floor(paceMinutesPerKm);
            const secs = Math.round((paceMinutesPerKm - mins) * 60);
            
            const formattedMins = String(mins).padStart(2, '0');
            const formattedSecs = String(secs).padStart(2, '0');
            
            return `${formattedMins}:${formattedSecs} /km`;
        }

        function saveWalkSession() {
            const endTime = Date.now();
            const elapsedTimeSec = Math.floor((endTime - startTime) / 1000);
            const distanceKm = parseFloat((totalDistanceMeters / 1000).toFixed(2));
            const avgPaceStr = calculatePace(elapsedTimeSec, distanceKm);
            const now = new Date(startTime);
            
            const dateKey = now.toISOString().split('T')[0]; 
            const formattedDate = now.toLocaleDateString();
            const startTimeStr = now.toLocaleTimeString();
            const endTimeStr = new Date(endTime).toLocaleTimeString();

            const startCoord = pathCoordinates.length > 0 ? pathCoordinates[0] : null;
            const endCoord = pathCoordinates.length > 0 ? pathCoordinates[pathCoordinates.length - 1] : null;

            const sessionData = {
                id: Date.now(),
                dateKey: dateKey,
                dateStr: formattedDate,
                startTime: startTimeStr,
                endTime: endTimeStr,
                duration: formatTime(elapsedTimeSec),
                distanceKm: distanceKm,
                avgPace: avgPaceStr,
                startGps: startCoord ? {
                    lat: startCoord.lat,
                    lng: startCoord.lng,
                    accuracy: startCoord.accuracy,
                    time: startCoord.time
                } : null,
                endGps: endCoord ? {
                    lat: endCoord.lat,
                    lng: endCoord.lng,
                    accuracy: endCoord.accuracy,
                    time: endCoord.time
                } : null,
                path: pathCoordinates 
            };

            let savedSessions = JSON.parse(localStorage.getItem("walk_sessions")) || [];
            savedSessions.unshift(sessionData);
            localStorage.setItem("walk_sessions", JSON.stringify(savedSessions));

            pathCoordinates = [];
            polylinePath.setLatLngs([]);
            document.getElementById("distance").innerText = "0.00 km";
            document.getElementById("timer").innerText = "00:00:00";
            document.getElementById("pace").innerText = "00:00 /km";
            document.getElementById("hud-lat").innerText = "--";
            document.getElementById("hud-lng").innerText = "--";
            document.getElementById("hud-acc").innerText = "--";

            renderDashboard();
        }

        function viewSessionOnMap(sessionId) {
            const savedSessions = JSON.parse(localStorage.getItem("walk_sessions")) || [];
            const session = savedSessions.find(s => s.id === sessionId);

            if (!session || !session.path || session.path.length === 0) return;

            historicalLayerGroup.clearLayers();

            const latLngs = session.path.map(p => [p.lat, p.lng]);
            const startCoord = session.startGps || session.path[0];
            const endCoord = session.endGps || session.path[session.path.length - 1];

            const histPolyline = L.polyline(latLngs, { color: '#6f42c1', weight: 5 });
            historicalLayerGroup.addLayer(histPolyline);

            const startMarker = L.marker([startCoord.lat, startCoord.lng], {
                icon: L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="background-color: #28a745; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white;"></div>'
                })
            }).bindPopup(`<b>Start GPS</b><br>Lat: ${startCoord.lat.toFixed(5)}<br>Lng: ${startCoord.lng.toFixed(5)}<br>Acc: ${Math.round(startCoord.accuracy || 0)}m<br>Time: ${session.startTime}`);
            historicalLayerGroup.addLayer(startMarker);

            const endMarker = L.marker([endCoord.lat, endCoord.lng], {
                icon: L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="background-color: #dc3545; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white;"></div>'
                })
            }).bindPopup(`<b>End GPS</b><br>Lat: ${endCoord.lat.toFixed(5)}<br>Lng: ${endCoord.lng.toFixed(5)}<br>Acc: ${Math.round(endCoord.accuracy || 0)}m<br>Time: ${session.endTime}`);
            historicalLayerGroup.addLayer(endMarker);

            map.fitBounds(histPolyline.getBounds(), { padding: [50, 50] });
        }

        function renderDashboard() {
            const historyListContainer = document.getElementById("historyList");
            const summaryListContainer = document.getElementById("summaryList");
            const savedSessions = JSON.parse(localStorage.getItem("walk_sessions")) || [];

            if (savedSessions.length === 0) {
                historyListContainer.innerHTML = "<p style='color: #888; font-size: 12px;'>No records found.</p>";
                summaryListContainer.innerHTML = "<p style='color: #888; font-size: 12px;'>No summaries available.</p>";
                return;
            }

            let historyHtml = "";
            savedSessions.forEach((session) => {
                const startLat = session.startGps ? session.startGps.lat.toFixed(4) : '--';
                const startLng = session.startGps ? session.startGps.lng.toFixed(4) : '--';
                const endLat = session.endGps ? session.endGps.lat.toFixed(4) : '--';
                const endLng = session.endGps ? session.endGps.lng.toFixed(4) : '--';

                historyHtml += `
                    <div class="history-item" onclick="viewSessionOnMap(${session.id})">
                        <div style="display: flex; justify-content: space-between; width: 100%;">
                            <strong>${session.dateStr} (${session.startTime || 'N/A'})</strong>
                            <span style="color: #28a745; font-weight: bold;">${session.distanceKm} km</span>
                        </div>
                        <div style="color: #555; font-size: 11px;">
                            Dur: ${session.duration} | Pace: ${session.avgPace || '--:--'}
                        </div>
                        <div style="color: #007bff; font-size: 10px; font-family: monospace;">
                            📍 Start: [${startLat}, ${startLng}] &nbsp;|&nbsp; 🏁 End: [${endLat}, ${endLng}]
                        </div>
                    </div>
                `;
            });
            historyListContainer.innerHTML = historyHtml;

            const dailyTotals = {};
            savedSessions.forEach(session => {
                const dk = session.dateKey || "Unknown Date";
                if (!dailyTotals[dk]) {
                    dailyTotals[dk] = { totalKm: 0, count: 0 };
                }
                dailyTotals[dk].totalKm += parseFloat(session.distanceKm);
                dailyTotals[dk].count += 1;
            });

            let summaryHtml = "";
            const sortedDates = Object.keys(dailyTotals).sort().reverse();
            
            sortedDates.forEach(date => {
                const data = dailyTotals[date];
                summaryHtml += `
                    <div class="summary-item">
                        <span>📅 <strong>${date}</strong> (${data.count} walk${data.count > 1 ? 's' : ''})</span>
                        <span style="color: #007bff; font-weight: bold;">${data.totalKm.toFixed(2)} km</span>
                    </div>
                `;
            });
            summaryListContainer.innerHTML = summaryHtml;
        }

        function exportData() {
            const data = localStorage.getItem("walk_sessions") || "[]";
            const blob = new Blob([data], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `walk_tracker_start_end_gps_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedSessions = JSON.parse(e.target.result);
                    if (Array.isArray(importedSessions)) {
                        localStorage.setItem("walk_sessions", JSON.stringify(importedSessions));
                        renderDashboard();
                        alert("Sessions imported successfully!");
                    } else {
                        alert("Invalid JSON format.");
                    }
                } catch (err) {
                    alert("Failed to parse JSON file.");
                }
                event.target.value = "";
            };
            reader.readAsText(file);
        }

        function clearHistory() {
            if (confirm("Are you sure you want to delete all saved walk records?")) {
                localStorage.removeItem("walk_sessions");
                historicalLayerGroup.clearLayers();
                renderDashboard();
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>

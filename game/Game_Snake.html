<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Game Pro</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  text-align: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #121212;
  color: #ffffff;
  touch-action: none; /* Prevents default scroll/zoom behaviors on mobile */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
}

h1 {
  margin: 10px 0;
  font-size: 1.8rem;
  letter-spacing: 1px;
}

.controls-top {
  margin-bottom: 10px;
}

button {
  background: #222;
  color: white;
  border: 2px solid #444;
  margin: 3px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}

button:active, button:hover {
  background: #00ff88;
  color: #121212;
  border-color: #00ff88;
}

.canvas-container {
  width: 100%;
  max-width: 450px; /* Scales nicely on mobile while retaining aspect ratio */
  aspect-ratio: 1 / 1;
  margin: auto;
}

canvas {
  background: #000;
  width: 100%;
  height: 100%;
  display: block;
  border: 3px solid #333;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

/* Virtual D-Pad for Mobile */
.virtual-pad {
  display: grid;
  grid-template-columns: repeat(3, 70px);
  grid-template-rows: repeat(2, 60px);
  gap: 10px;
  margin-top: 15px;
  justify-content: center;
}

.virtual-pad button {
  font-size: 20px;
  background: #1e1e1e;
  border-color: #444;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-up { grid-column: 2; grid-row: 1; }
.btn-left { grid-column: 1; grid-row: 2; }
.btn-down { grid-column: 2; grid-row: 2; }
.btn-right { grid-column: 3; grid-row: 2; }

@media (min-width: 768px) {
  .canvas-container {
    max-width: 500px;
  }
  .virtual-pad {
    display: none; /* Hide on desktop since keyboard is available */
  }
}
</style>
</head>

<body>

<h1>🐍 Snake Game Pro</h1>

<div class="controls-top">
<button onclick="pauseGame()">Pause</button>
<button onclick="speedDown()">Speed -</button>
<button onclick="speedUp()">Speed +</button>
</div>

<div class="canvas-container">
  <canvas id="game" width="900" height="900"></canvas>
</div>

<!-- On-screen controls for mobile users -->
<div class="virtual-pad">
  <button class="btn-up" onclick="changeDirection('UP')">⬆️</button>
  <button class="btn-left" onclick="changeDirection('LEFT')">⬅️</button>
  <button class="btn-down" onclick="changeDirection('DOWN')">⬇️</button>
  <button class="btn-right" onclick="changeDirection('RIGHT')">➡️</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;

let snake = {
  x: 160,
  y: 160,
  dx: grid,
  dy: 0,
  cells: [],
  maxCells: 4
};

let apple = { x: 320, y: 320 };

let score = 0;
let level = 1;
let speed = 120;
let paused = false;

const eatSound = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQgAAAAA"); 

function rand(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

// Direction Handler function to share logic between Keyboard and Buttons
function changeDirection(dir) {
  if (dir === 'LEFT' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
  else if (dir === 'UP' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
  else if (dir === 'RIGHT' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
  else if (dir === 'DOWN' && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
}

// Keyboard Controls (Arrows + WASD)
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") changeDirection('LEFT');
  else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") changeDirection('UP');
  else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") changeDirection('RIGHT');
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") changeDirection('DOWN');
});

// Swipe support for touch screens
let sx, sy;
canvas.addEventListener("touchstart", e => {
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
});

canvas.addEventListener("touchend", e => {
  let ex = e.changedTouches[0].clientX;
  let ey = e.changedTouches[0].clientY;

  let dx = ex - sx;
  let dy = ey - sy;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) changeDirection('RIGHT');
    else changeDirection('LEFT');
  } else {
    if (dy > 0) changeDirection('DOWN');
    else changeDirection('UP');
  }
});

function pauseGame() {
  paused = !paused;
}

function speedUp() {
  speed = Math.max(40, speed - 20);
}

function speedDown() {
  speed += 20;
}

function gameLoop() {
  if (!paused) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    snake.x += snake.dx;
    snake.y += snake.dy;

    if (snake.x < 0) snake.x = canvas.width - grid;
    if (snake.x >= canvas.width) snake.x = 0;

    if (snake.y < 0) snake.y = canvas.height - grid;
    if (snake.y >= canvas.height) snake.y = 0;

    snake.cells.unshift({ x: snake.x, y: snake.y });

    if (snake.cells.length > snake.maxCells) {
      snake.cells.pop();
    }

    // Draw Apple
    ctx.fillStyle = "#ff3b30";
    ctx.fillRect(apple.x, apple.y, grid - 2, grid - 2);

    // Draw Snake
    ctx.fillStyle = "#00ff88";
    snake.cells.forEach((cell, index) => {
      ctx.fillRect(cell.x, cell.y, grid - 2, grid - 2);

      if (cell.x === apple.x && cell.y === apple.y) {
        eatSound.currentTime = 0;
        eatSound.play().catch(() => {}); // Catch prevents audio policy block errors

        snake.maxCells++;
        score++;

        if (score % 5 === 0) {
          level++;
          speed = Math.max(40, speed - 10);
        }

        // Keep apple inside the 45x45 grid bounds (900 / 20 = 45)
        apple.x = rand(0, 45) * grid;
        apple.y = rand(0, 45) * grid;
      }

      for (let i = index + 1; i < snake.cells.length; i++) {
        if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
          alert("Game Over\nScore: " + score + "\nLevel: " + level);
          document.location.reload();
        }
      }
    });

    // Scoreboard UI on Canvas
    ctx.fillStyle = "white";
    ctx.font = "bold 22px Arial";
    ctx.fillText("Score: " + score, 20, 35);
    ctx.fillText("Level: " + level, 20, 65);
    ctx.fillText("Speed: " + speed, 20, 95);
  }

  setTimeout(gameLoop, speed);
}

gameLoop();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#4CAF50">

<title>Swayam PWA</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;
    height:100dvh;

    overflow:hidden;
}

body{

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:#f4f6f7;

    display:flex;
    flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

.top-header{

    height:56px;
    min-height:56px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #43a047,
            #66bb6a
        );

    box-shadow:
        0 2px 8px rgba(0,0,0,.18);

    z-index:1000;
}

.app-title{

    display:flex;
    align-items:center;

    gap:7px;

    font-size:18px;
    font-weight:700;

    white-space:nowrap;
}

.app-version{

    font-size:10px;

    padding:3px 7px;

    border-radius:10px;

    background:
        rgba(255,255,255,.20);
}

.header-clock{

    font-size:11px;

    padding:6px 8px;

    border-radius:8px;

    white-space:nowrap;

    background:
        rgba(255,255,255,.18);
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.app-container{

    display:flex;

    width:100%;

    height:calc(100dvh - 56px);

    min-height:0;

    overflow:hidden;
}


/* =========================================================
   MENU
========================================================= */

.left-menu{

    width:220px;
    min-width:220px;

    height:100%;

    padding:8px 6px;

    background:#ffffff;

    border-right:1px solid #ddd;

    overflow-y:auto;
    overflow-x:hidden;

    scrollbar-width:thin;

    -webkit-overflow-scrolling:touch;
}


/* =========================================================
   ACCESSIBLE BUTTON
========================================================= */

.menu-item{

    appearance:none;
    -webkit-appearance:none;

    display:flex;

    align-items:center;

    width:100%;

    min-height:44px;

    padding:9px 12px;

    margin-bottom:4px;

    background:transparent;

    color:#333;

    border:0;

    border-left:4px solid transparent;

    border-radius:8px;

    font-family:inherit;

    font-size:14px;

    text-align:left;

    cursor:pointer;

    touch-action:manipulation;

    user-select:none;

    -webkit-tap-highlight-color:transparent;

    transition:
        background .2s,
        color .2s,
        border .2s,
        transform .1s;
}


/* Hover */

.menu-item:hover{

    background:#f1f8e9;

    color:#2e7d32;

    transform:translateX(2px);
}


/* Active */

.menu-item.active{

    background:#e8f5e9;

    color:#2e7d32;

    border-left-color:#4CAF50;

    font-weight:700;
}


/* Keyboard focus */

.menu-item:focus-visible{

    outline:3px solid #2e7d32;

    outline-offset:2px;
}


/* Touch */

.menu-item:active{

    transform:scale(.97);
}


/* =========================================================
   CENTER
========================================================= */

.center-screen{

    flex:1;

    min-width:0;
    min-height:0;

    height:100%;

    background:white;

    overflow:hidden;
}

.content-frame{

    display:block;

    width:100%;
    height:100%;

    border:0;

    background:white;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

    .top-header{

        height:54px;
        min-height:54px;

        padding:0 9px;
    }

    .app-title{

        font-size:15px;
    }

    .header-clock{

        font-size:9px;

        padding:5px 6px;
    }


    .app-container{

        flex-direction:column;

        height:calc(100dvh - 54px);
    }


    /* Horizontal mobile menu */

    .left-menu{

        width:100%;
        min-width:100%;

        height:54px;
        min-height:54px;

        flex:0 0 54px;

        display:flex;

        flex-direction:row;

        align-items:center;

        gap:4px;

        padding:5px;

        overflow-x:auto;
        overflow-y:hidden;

        white-space:nowrap;

        border-right:0;

        border-bottom:1px solid #ddd;

        scrollbar-width:none;
    }

    .left-menu::-webkit-scrollbar{

        display:none;
    }


    .menu-item{

        flex:0 0 auto;

        width:auto;

        height:42px;
        min-height:42px;

        margin:0;

        padding:0 13px;

        justify-content:center;

        border:0;

        border-bottom:3px solid transparent;

        border-radius:8px;

        font-size:13px;

        white-space:nowrap;
    }

    .menu-item.active{

        border-left:0;

        border-bottom-color:#4CAF50;
    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:400px){

    .top-header{

        height:50px;
        min-height:50px;
    }

    .app-container{

        height:calc(100dvh - 50px);
    }

    .app-title{

        font-size:14px;
    }

    .header-clock{

        font-size:8px;
    }

    .left-menu{

        height:48px;
        min-height:48px;

        flex-basis:48px;
    }

    .menu-item{

        height:38px;
        min-height:38px;

        padding:0 10px;

        font-size:12px;
    }

}


/* =========================================================
   MOBILE LANDSCAPE
========================================================= */

@media(max-width:768px)
       and (orientation:landscape){

    .app-container{

        flex-direction:row;

        height:calc(100dvh - 50px);
    }

    .left-menu{

        width:155px;
        min-width:155px;

        height:100%;

        flex:0 0 155px;

        display:block;

        overflow-y:auto;
        overflow-x:hidden;

        border-right:1px solid #ddd;

        border-bottom:0;
    }

    .menu-item{

        width:100%;

        height:40px;
        min-height:40px;

        justify-content:flex-start;

        border:0;

        border-left:3px solid transparent;

        font-size:12px;
    }

    .menu-item.active{

        border-left-color:#4CAF50;

        border-bottom:0;
    }
}


/* =========================================================
   LARGE DESKTOP
========================================================= */

@media(min-width:1400px){

    .left-menu{

        width:250px;
        min-width:250px;
    }

    .menu-item{

        min-height:46px;

        font-size:15px;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="top-header">

    <div class="app-title">

        ⛱️ Swayam

        <span class="app-version">
            v0.2
        </span>

    </div>

    <div
        class="header-clock"
        id="headerClock">

        Loading...

    </div>

</header>



<!-- =======================================================
     APPLICATION
======================================================= -->

<div class="app-container">


<!-- =======================================================
     MENU
======================================================= -->

<nav
    class="left-menu"
    aria-label="Swayam Navigation">


    <button
        type="button"
        class="menu-item active"
        aria-current="page"
        onclick="loadPage('home-content.html',this)">

        🏠 Home

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_smart.html',this)">

        ⌚ Watch

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('cal.html',this)">

        📅 Calendar

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_karya.html',this)">

        💼 Work

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_laxmi.html',this)">

        💰 Home Finance

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_yog.html',this)">

        🙏 Fitness

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_upkarna.html',this)">

        🛠️ Utility

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_chitra.html',this)">

        🖼️ Image

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_sutra.html',this)">

        📐 Formula

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_awpl.html',this)">

        🌐 Business

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_lang.html',this)">

        🌐 Languages

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_sanskar.html',this)">

        🙏 Ethics

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('Util_ranjan.html',this)">

        🎮 Relax

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('medical.html',this)">

        🏥 Medical

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('emergency.html',this)">

        🚨 Emergency

    </button>


    <button
        type="button"
        class="menu-item"
        onclick="loadPage('note2.html',this)">

        📝 Notes

    </button>


</nav>



<!-- =======================================================
     CENTER
======================================================= -->

<main class="center-screen">

    <iframe
        id="displayFrame"
        class="content-frame"
        name="displayFrame"
        title="Swayam Application Content"

        srcdoc="
        <html>
        <body style='
            margin:0;
            font-family:system-ui;
            background:#f8f9fa;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            color:#555;
        '>

        <div>

            <div style='font-size:60px'>
                ⛱️
            </div>

            <h2 style='color:#4CAF50'>
                Swayam PWA
            </h2>

            <p>
                Select an option from the menu.
            </p>

        </div>

        </body>
        </html>
        ">

    </iframe>

</main>


</div>



<script>

/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

    const clock =
        document.getElementById(
            "headerClock"
        );

    if(!clock) return;

    const now = new Date();

    const date =
        now.toLocaleDateString(
            "en-IN",
            {
                weekday:"short",
                month:"short",
                day:"numeric"
            }
        );

    const time =
        now.toLocaleTimeString(
            "en-IN",
            {
                hour:"2-digit",
                minute:"2-digit",
                hour12:true
            }
        );

    clock.textContent =
        date + " | " + time;
}


updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   LOAD PAGE
========================================================= */

function loadPage(url,button){

    console.log(
        "Opening:",
        url
    );


    const frame =
        document.getElementById(
            "displayFrame"
        );


    /* Safety check */

    if(!frame){

        alert(
            "Content frame not found."
        );

        return;
    }


    /* =====================================================
       UPDATE ACTIVE BUTTON
    ===================================================== */

    const buttons =
        document.querySelectorAll(
            ".menu-item"
        );


    buttons.forEach(
        function(btn){

            btn.classList.remove(
                "active"
            );

            btn.removeAttribute(
                "aria-current"
            );

        }
    );


    if(button){

        button.classList.add(
            "active"
        );

        button.setAttribute(
            "aria-current",
            "page"
        );

    }


    /* =====================================================
       LOAD PAGE
    ===================================================== */

    frame.src = url;


    /* =====================================================
       SAVE LAST PAGE
    ===================================================== */

    try{

        localStorage.setItem(
            "swayam_last_page",
            url
        );

    }
    catch(error){

        console.log(
            "LocalStorage unavailable"
        );

    }


    /* =====================================================
       MOBILE SCROLL
    ===================================================== */

    if(
        window.innerWidth <= 768 &&
        button
    ){

        button.scrollIntoView({

            behavior:"smooth",

            inline:"center",

            block:"nearest"

        });

    }

}


/* =========================================================
   IFRAME ERROR DETECTION
========================================================= */

document
    .getElementById("displayFrame")
    .addEventListener(
        "load",
        function(){

            console.log(
                "Iframe loaded:",
                this.src
            );

        }
    );


/* =========================================================
   RESTORE LAST PAGE
========================================================= */

window.addEventListener(
    "load",
    function(){

        let lastPage = null;


        try{

            lastPage =
                localStorage.getItem(
                    "swayam_last_page"
                );

        }
        catch(error){

            lastPage = null;

        }


        if(!lastPage){

            return;

        }


        const buttons =
            document.querySelectorAll(
                ".menu-item"
            );


        for(
            let i=0;
            i<buttons.length;
            i++
        ){

            const button =
                buttons[i];


            /*
             * Extract the page from
             * onclick attribute.
             */

            const action =
                button.getAttribute(
                    "onclick"
                );


            if(
                action &&
                action.includes(
                    "'" + lastPage + "'"
                )
            ){

                loadPage(
                    lastPage,
                    button
                );

                break;
            }

        }

    }
);

</script>

</body>
</html>

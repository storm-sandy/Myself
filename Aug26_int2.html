<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullday Dashboard - Tabbed Format</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f6f9;padding:10px;margin:0}

/* =========================================================
   TAB NAVIGATION STYLES
========================================================= */
.tabs-header {
  display: flex;
  overflow-x: auto;
  gap: 8px;
  background: #fff;
  padding: 8px;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
  margin-bottom: 12px;
  -webkit-overflow-scrolling: touch;
}

.tab-btn {
  flex: 1;
  min-width: 110px;
  background: #f8f9fa;
  color: #495057;
  border: 1px solid #dee2e6;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
  margin: 0;
}

.tab-btn.active {
  background: #007bff;
  color: #fff;
  border-color: #007bff;
  box-shadow: 0 2px 5px rgba(0,123,255,.3);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* =========================================================
   EXISTING CARD STYLES
========================================================= */
.card{background:#fff;padding:12px;margin-bottom:12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
h3{margin-top:5px}
input,select,button{padding:9px;margin:4px 0;border-radius:8px;border:1px solid #ccc;width:100%;font-size:15px}
button{background:#007bff;color:#fff;border:none;cursor:pointer}
button:hover{opacity:.9}
.danger{background:#dc3545}.success{background:#198754}.secondary{background:#6c757d}
.filter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:600px){.filter-grid{grid-template-columns:1fr}}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{padding:7px;border-bottom:1px solid #ddd;text-align:center}
th{background:#f1f3f5}
.delete-btn{background:#dc3545;padding:5px 10px;width:auto}
.stats{font-size:20px;font-weight:bold}
.small{font-size:13px;color:#666}
#chart{max-height:400px}

/* =========================================================
   SCROLLABLE CATEGORY BUTTONS
========================================================= */
.category-scroll{
  width:100%;
  max-height:190px;
  overflow-x:auto;
  overflow-y:auto;
  border:1px solid #d6d6d6;
  border-radius:10px;
  background:#f8f9fa;
  padding:7px;
  margin:5px 0 8px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}

.category-buttons{
  display:grid;
  grid-template-columns:repeat(4,minmax(130px,1fr));
  gap:7px;
  min-width:540px;
}

.category-btn{
  background:#e9ecef;
  color:#333;
  border:1px solid #ccc;
  font-weight:bold;
  margin:0;
  padding:10px 7px;
  font-size:13px;
  min-height:42px;
  white-space:normal;
}

.category-btn.active{
  background:#007bff;
  color:#fff;
  border-color:#007bff;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.selected-category{
  background:#eef6ff;
  border:1px solid #b8daff;
  border-radius:8px;
  padding:8px;
  margin:5px 0 8px;
  font-weight:bold;
  color:#0056b3;
}

.scroll-hint{
  font-size:12px;
  color:#777;
  text-align:center;
  margin:2px 0 7px;
}

@media(max-width:600px){
  .category-scroll{
    max-height:230px;
  }

  .category-buttons{
    grid-template-columns:repeat(3,minmax(120px,1fr));
    min-width:390px;
  }
}

@media(max-width:420px){
  .category-buttons{
    grid-template-columns:repeat(2,minmax(125px,1fr));
    min-width:270px;
  }
}
</style>
</head>
<body>

<!-- Tab Buttons Header -->
<div class="tabs-header">
  <button class="tab-btn active" onclick="switchTab('addTab', this)">➕ Add Task</button>
  <button class="tab-btn" onclick="switchTab('filterTab', this)">🔎 Filters</button>
  <button class="tab-btn" onclick="switchTab('recordsTab', this)">📋 Records</button>
  <button class="tab-btn" onclick="switchTab('chartTab', this)">📊 Chart</button>
  <button class="tab-btn" onclick="switchTab('dataTab', this)">💾 Data</button>
</div>

<!-- Tab 1: Add Task -->
<div id="addTab" class="tab-content active">
  <div class="card">
    <h3>➕ Add Task</h3>

    <input type="date" id="date">
    <input type="number" id="cost" placeholder="Count/Amount" min="0" step="any">
    <input type="text" id="place" placeholder="Title">
    <input type="text" id="desc" placeholder="Description">

    <label><b>Time</b></label>
    <select id="types"></select>

    <label><b>Select Category</b></label>
    <div class="scroll-hint">↔ Swipe left/right and ↕ scroll up/down for more categories</div>
    <div class="category-scroll">
      <div class="category-buttons" id="categoryButtons"></div>
    </div>

    <div class="selected-category">
    Selected Category: <span id="selectedCategory">Please select</span>
    </div>

    <label><b>Select Type</b></label>
    <select id="type" onchange="renderAll()"></select>

    <button onclick="addRecord()">Add Record</button>
  </div>
</div>

<!-- Tab 2: Filters -->
<div id="filterTab" class="tab-content">
  <div class="card">
    <h3>🔎 Filters</h3>
    <div class="filter-grid">
      <div>
        <label>View</label>
        <select id="viewType" onchange="renderAll()">
          <option value="day">Day</option>
          <option value="week">Week</option>
          <option value="month" selected>Month</option>
          <option value="year">Year</option>
        </select>
      </div>

      <div>
        <label>From Date</label>
        <input type="date" id="fromDate">
      </div>

      <div>
        <label>To Date</label>
        <input type="date" id="toDate">
      </div>
    </div>

    <button onclick="renderAll()">Apply Filters</button>
    <button class="danger" onclick="deleteByDateRange()">Delete Records in Date Range</button>
    <br><br>
    <div class="stats">Total : <span id="total">0</span></div>
    <div class="small">Showing <span id="recordCount">0</span> records</div>
  </div>
</div>

<!-- Tab 3: Records -->
<div id="recordsTab" class="tab-content">
  <div class="card">
    <h3>📋 Records</h3>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Count/Amount</th><th>Task</th><th>Description</th>
            <th>Time</th><th>Category</th><th>Delete</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Tab 4: Chart -->
<div id="chartTab" class="tab-content">
  <div class="card">
    <h3>📊 Chart</h3>
    <canvas id="chart"></canvas>
  </div>
</div>

<!-- Tab 5: Data Management -->
<div id="dataTab" class="tab-content">
  <div class="card">
    <h3>💾 Data Management</h3>
    <button class="success" onclick="exportCSV()">⬇ Export CSV</button>
    <input type="file" id="fileInput" accept=".csv,text/csv" onchange="importCSV(event)">
    <button class="secondary" onclick="clearAllData()">Clear All Data</button>
  </div>
</div>

<script>
const CONFIG={
  storageKey:"aug26int",

  times:[
    "Morning 4-6","Morning 6-8","Morning 8-12",
    "Afternoon 12-3","Afternoon 3-5",
    "Evening 5-7","Night 7-12","Night 12-4","Others"
  ],

  categoryGroups:{
    "Interview":[
      "Client round",
      "Drive","dailyupdates","Screening","Questions","First Response","Tips", "Follow up","Rounds","Final Response","Allocation","Reference","Scenario","Team Handling","Client Handling","FallBack","Failed Reason","Success"
    ],
    "Documents":[
      "Consent approval","Biodata/Resume/CV","GitHub link","Profile link","Academics","Certificate","Achievements","Performance","Emails"
    ],
    "New Office":[
      "Work time","Shift","Rotation","Travel",
      "Location","Building","ODC","Seat Number","Cafeteria","Medical","Library","Stationary","Emergency Exit","Floor","Games/Sports","Events"
    ],
    "Learning":[
      "Study","Reading","Online Course","Practice","Certification","Research","Skill Development","Self Learning"
    ],
    "Urgency":[
      "Important","Urgent","Reminder","Follow Up","Pending","Completed",
      "In progress"
    ],
    "Other":[
      "Others"
    ]
  }
};

let data=[],chart=null;
let selectedButtonCategory="";

const dateEl=document.getElementById("date");
const costEl=document.getElementById("cost");
const placeEl=document.getElementById("place");
const descEl=document.getElementById("desc");
const typesEl=document.getElementById("types");
const typeEl=document.getElementById("type");
const categoryButtonsEl=document.getElementById("categoryButtons");
const selectedCategoryEl=document.getElementById("selectedCategory");
const viewTypeEl=document.getElementById("viewType");
const fromDateEl=document.getElementById("fromDate");
const toDateEl=document.getElementById("toDate");
const tableBodyEl=document.getElementById("tableBody");
const totalEl=document.getElementById("total");
const recordCountEl=document.getElementById("recordCount");

/* Tab Switching Function */
function switchTab(tabId, btnElement) {
  document.querySelectorAll('.tab-content').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  
  document.getElementById(tabId).classList.add('active');
  btnElement.classList.add('active');

  // Re-render chart if switching to chart tab to handle dynamic canvas dimensions
  if (tabId === 'chartTab') {
    renderAll();
  }
}

function formatDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function initializeDates(){
  const today=new Date();
  dateEl.value=formatDate(today);
  fromDateEl.value=formatDate(new Date(today.getFullYear(),today.getMonth(),1));
  toDateEl.value=formatDate(new Date(today.getFullYear(),today.getMonth()+1,0));
}

function populateTimeSelect(){
  typesEl.innerHTML='<option value="">Select Time</option>';
  CONFIG.times.forEach(v=>{
    const o=document.createElement("option");
    o.value=v;o.textContent=v;
    typesEl.appendChild(o);
  });
}

function populateCategoryButtons(){
  categoryButtonsEl.innerHTML="";

  Object.keys(CONFIG.categoryGroups).forEach(group=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="category-btn";
    btn.textContent=group;

    btn.onclick=function(){
      selectButtonCategory(group,btn);
    };

    categoryButtonsEl.appendChild(btn);
  });
}

function selectButtonCategory(group,button){
  selectedButtonCategory=group;
  selectedCategoryEl.textContent=group;

  document.querySelectorAll(".category-btn").forEach(b=>{
    b.classList.remove("active");
  });
  button.classList.add("active");

  typeEl.innerHTML='<option value="">Select Type</option>';

  CONFIG.categoryGroups[group].forEach(v=>{
    const o=document.createElement("option");
    o.value=v;
    o.textContent=v;
    typeEl.appendChild(o);
  });

  typeEl.selectedIndex=0;
}

function normalizeRecord(r){
  return {
    date:String(r.date||""),
    cost:Number.isFinite(Number(r.cost))?Number(r.cost):0,
    place:String(r.place||""),
    desc:String(r.desc||""),
    types:String(r.types||r.time||""),
    type:String(r.type||r.category||"")
  };
}

function loadData(){
  try{
    const saved=localStorage.getItem(CONFIG.storageKey);
    if(saved){
      const p=JSON.parse(saved);
      if(Array.isArray(p))data=p.map(normalizeRecord);
    }
  }catch(e){
    console.error(e);
    data=[];
  }
}

function save(){
  localStorage.setItem(CONFIG.storageKey,JSON.stringify(data));
}

function addRecord(){
  if(!selectedButtonCategory)
    return alert("Please select a Category button first.");

  if(!typeEl.value)
    return alert("Please select Type.");

  const r={
    date:dateEl.value,
    cost:parseFloat(costEl.value),
    place:placeEl.value.trim(),
    desc:descEl.value.trim(),
    types:typesEl.value,
    type:typeEl.value
  };

  if(!r.date)return alert("Please select date.");
  if(isNaN(r.cost))return alert("Please enter a valid count.");
  if(!r.place)return alert("Please add Title.");
  if(!r.desc)return alert("Please add description");

  data.push(r);
  save();
  clearForm();
  renderAll();
  alert("Record Added!");
}

function clearForm(){
  dateEl.value=formatDate(new Date());
  costEl.value="";
  placeEl.value="";
  descEl.value="";
  typesEl.value="";
  typeEl.innerHTML='<option value="">Select Type</option>';
  selectedButtonCategory="";
  selectedCategoryEl.textContent="Please select";

  document.querySelectorAll(".category-btn").forEach(b=>{
    b.classList.remove("active");
  });
}

function deleteRow(i){
  if(!confirm("Delete this record?"))return;
  data.splice(i,1);
  save();
  renderAll();
}

function deleteByDateRange(){
  const from=fromDateEl.value,to=toDateEl.value;

  if(!from||!to)
    return alert("Please select From and To dates.");

  if(from>to)
    return alert("From date cannot be after To date.");

if(!data.length)
    return alert("No data available.");

  if(!confirm("Delete ALL records?"))
    return;


  const old=data.length;
  data=data.filter(r=>!(r.date>=from&&r.date<=to));

  save();
  renderAll();
  alert((old-data.length)+" record(s) deleted.");
}

function getFilteredData(){
  const from=fromDateEl.value;
  const to=toDateEl.value;
  const cat=typeEl.value;

  return data.filter(r=>{
    if(from&&r.date<from)return false;
    if(to&&r.date>to)return false;
    if(cat&&r.type!==cat)return false;
    return true;
  });
}

function getWeekKey(s){
  const d=new Date(s);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-(d.getDay()+6)%7);

  const w1=new Date(d.getFullYear(),0,4);
  const n=1+Math.round(
    ((d-w1)/86400000-3+(w1.getDay()+6)%7)/7
  );

  return d.getFullYear()+"-W"+String(n).padStart(2,"0");
}

function getKey(date,type){
  if(type==="day")return date;
  if(type==="month")return date.slice(0,7);
  if(type==="year")return date.slice(0,4);
  if(type==="week")return getWeekKey(date);
}

function formatLabel(key,type){
  if(type==="month"){
    const p=key.split("-");
    return new Date(p[0],p[1]-1)
      .toLocaleString("default",{month:"short",year:"numeric"});
  }

  if(type==="week")
    return "Week "+key.split("W")[1];

  return key;
}

function groupData(filtered,type){
  const g={};

  filtered.forEach(r=>{
    const k=getKey(r.date,type);
    g[k]=(g[k]||0)+Number(r.cost||0);
  });

  return g;
}

function escapeHTML(v){
  return String(v||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderTable(filtered){
  tableBodyEl.innerHTML="";

  filtered.forEach(r=>{
    const i=data.indexOf(r);
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${escapeHTML(r.date)}</td>
      <td>${Number(r.cost||0)}</td>
      <td>${escapeHTML(r.place)}</td>
      <td>${escapeHTML(r.desc)}</td>
      <td>${escapeHTML(r.types)}</td>
      <td>${escapeHTML(r.type)}</td>
      <td>
        <button class="delete-btn" onclick="deleteRow(${i})">X</button>
      </td>
    `;

    tableBodyEl.appendChild(tr);
  });

  recordCountEl.innerText=filtered.length;
}

function renderChart(filtered){
  const type=viewTypeEl.value;
  const g=groupData(filtered,type);
  const keys=Object.keys(g).sort();

  if(chart)chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:type==="day"?"line":"bar",
    data:{
      labels:keys.map(k=>formatLabel(k,type)),
      datasets:[{
        label:type.toUpperCase()+" Total",
        data:keys.map(k=>g[k]),
        borderWidth:2
      }]
    },
    options:{
      responsive:true,
      scales:{y:{beginAtZero:true}}
    }
  });
}

function renderTotal(filtered){
  totalEl.innerText=
    filtered.reduce((s,r)=>s+Number(r.cost||0),0);
}

function renderAll(){
  const f=getFilteredData();
  renderTable(f);
  renderChart(f);
  renderTotal(f);
}

function csvEscape(v){
  return '"'+String(v??"").replace(/"/g,'""')+'"';
}

function exportCSV(){
  if(!data.length)
    return alert("No records to export.");

  let csv="date,cost,place,desc,types,type\n";

  data.forEach(r=>{
    csv += [
      r.date,r.cost,r.place,r.desc,r.types,r.type
    ].map(csvEscape).join(",")+"\n";
  });

  const blob=new Blob([csv],{
    type:"text/csv;charset=utf-8;"
  });

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="fullday-dashboard.csv";
  document.body.appendChild(a);
  a.click();

  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCSV(text){
  const rows=[];
  let row=[],value="",quotes=false;

  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];

    if(c==='"'&&quotes&&n==='"'){
      value+='"';
      i++;
      continue;
    }

    if(c==='"'){
      quotes=!quotes;
      continue;
    }

    if(c===","&&!quotes){
      row.push(value);
      value="";
      continue;
    }

    if((c==="\n"||c==="\r")&&!quotes){
      if(c==="\r"&&n==="\n")i++;

      row.push(value);
      value="";

      if(row.length)rows.push(row);
      row=[];
      continue;
    }

    value+=c;
  }

  if(value!==""||row.length){
    row.push(value);
    rows.push(row);
  }

  return rows;
}

function importCSV(event){
  const file=event.target.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=e=>{
    try{
      const rows=parseCSV(
        e.target.result.replace(/^\uFEFF/,"")
      );

      if(rows.length<2)
        return alert("CSV file contains no records.");

      const header=rows[0]
        .map(h=>h.trim().toLowerCase());

      const idx=n=>header.indexOf(n);
      let imported=0;

      for(let i=1;i<rows.length;i++){
        const row=rows[i];

        const r={
          date:idx("date")>=0?row[idx("date")]:"",
          cost:idx("cost")>=0?parseFloat(row[idx("cost")]):NaN,
          place:idx("place")>=0?row[idx("place")]:"",
          desc:idx("desc")>=0?row[idx("desc")]:"",
          types:idx("types")>=0?row[idx("types")]:"",
          type:idx("type")>=0?row[idx("type")]:""
        };

        if(!r.date||isNaN(r.cost))continue;

        data.push(normalizeRecord(r));
        imported++;
      }

      save();
      renderAll();

      alert(imported+" record(s) imported successfully.");

    }catch(err){
      console.error(err);
      alert("Unable to import CSV file.");
    }

    event.target.value="";
  };

  reader.readAsText(file);
}

function clearAllData(){
  if(!data.length)
    return alert("No data available.");

  if(!confirm("Delete ALL records?"))
    return;

  data=[];
  save();
  renderAll();
}

window.addEventListener("DOMContentLoaded",()=>{
  populateTimeSelect();
  populateCategoryButtons();
  initializeDates();
  loadData();
  renderAll();
});
</script>
</body>
</html>

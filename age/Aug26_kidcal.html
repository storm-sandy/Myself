<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<title>School Attendance Manager PRO</title>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f4f7ff;--card:#fff;--text:#172033;--muted:#667085;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--info:#0284c7;--border:#e5e7eb;--shadow:0 12px 35px #1e1b4b18}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc 45%,#f5f3ff);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#c7d2fe,transparent 40%),linear-gradient(135deg,#312e81,#7c3aed)}
.login-card{width:min(470px,100%);background:#ffffffef;backdrop-filter:blur(18px);border-radius:30px;padding:28px;box-shadow:0 30px 80px #0005}
.logo{font-size:54px;text-align:center}.login h1{text-align:center;margin:5px 0;font-size:30px}.sub{text-align:center;color:var(--muted);margin-bottom:20px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.role{padding:13px;border-radius:15px;background:#eef2ff;color:#3730a3;font-weight:800}.role.active{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:13px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px #4f46e51a}
.primary{width:100%;padding:14px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));font-weight:900;box-shadow:0 8px 20px #4f46e544;transition:.2s}.primary:hover{transform:translateY(-2px);filter:saturate(1.2)}
.demo{margin-top:14px;background:#f8fafc;border-radius:14px;padding:10px;font-size:12px;text-align:center;color:#475467}
header.top{position:sticky;top:0;z-index:10;background:#ffffffea;backdrop-filter:blur(15px);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:950}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;align-items:center}.btn{padding:10px 13px;border-radius:12px;background:#eef2ff;color:#3730a3;font-weight:800}.btn:hover{transform:translateY(-1px)}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.dark{background:#111827;color:#fff}
.container{max-width:1250px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-50px;top:-60px;background:#fff2}.hero h2{margin:0 0 4px;font-size:28px}.hero p{margin:0;opacity:.88}
.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0;padding-bottom:4px}.tab{white-space:nowrap;padding:11px 15px;border-radius:13px;background:#fff;border:1px solid var(--border);font-weight:850;color:#475467}.tab.active{background:#111827;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:var(--shadow);transition:.2s}.stat:hover{transform:translateY(-4px)}.stat .ico{font-size:27px}.stat b{display:block;font-size:27px;margin-top:4px}.stat span{color:var(--muted);font-size:13px;font-weight:700}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-top:15px}.card h3{margin:0 0 13px}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.formgrid .wide{grid-column:span 2}.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tablewrap{overflow:auto;border-radius:14px;border:1px solid var(--border)}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}th{background:#f8fafc;position:sticky;top:0;z-index:1}tbody tr{transition:.18s}tbody tr:hover{background:#eef2ff;transform:scale(1.002)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.present{background:#dcfce7;color:#166534}.absent{background:#fee2e2;color:#991b1b}.half{background:#fef3c7;color:#92400e}.leave{background:#e0f2fe;color:#075985}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.student{padding:16px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(135deg,#fff,#f8fafc);cursor:pointer;transition:.2s}.student:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.avatar{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:#ede9fe;font-size:25px;float:left;margin-right:11px}.student h4{margin:3px 0}.student small{color:var(--muted)}
.progress{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:20px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:62px;background:#f8fafc;border-radius:10px;padding:6px;font-size:11px;border:1px solid #eef2f7}.day b{font-size:12px}.day.presentday{background:#dcfce7}.day.absentday{background:#fee2e2}.day.halfday{background:#fef3c7}.day.leaveday{background:#e0f2fe}.dow{font-weight:900;text-align:center;padding:7px;color:#667085}
.report{background:#fff;padding:28px;border:1px solid #ddd;max-width:850px;margin:auto}.report h1{text-align:center}.report .school{text-align:center;color:#667085}.reportgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.reportbox{border:1px solid #ddd;padding:12px;text-align:center;border-radius:10px}.reportbox b{display:block;font-size:23px}
.toast{position:fixed;right:15px;bottom:15px;background:#111827;color:#fff;padding:12px 16px;border-radius:13px;box-shadow:0 10px 30px #0004;z-index:99;display:none}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:grid;place-items:center;padding:15px}.modalbox{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:20px}.close{float:right;background:#f1f5f9;border-radius:10px;padding:8px}
.note{background:#fffbeb;border:1px solid #fde68a;padding:10px;border-radius:12px;font-size:12px;color:#854d0e}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}.formgrid .wide{grid-column:span 2}.hero h2{font-size:23px}}
@media(max-width:600px){header.top{padding:10px}.brand{font-size:16px}.container{padding:10px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px}.stat b{font-size:22px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.actions .btn span{display:none}.calendar .day{min-height:54px}.reportgrid{grid-template-columns:repeat(2,1fr)}}
@media print{body{background:#fff}.no-print,.top,.tabs,.hero,.card:not(.printable),button{display:none!important}.container{padding:0}.report{border:0;box-shadow:none;max-width:none}.printable{display:block!important}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">🏫</div><h1>School Attendance PRO</h1>
    <div class="sub">Attendance • Homework • Reports • Parent Portal</div>
    <div class="roles">
      <button class="role active" data-role="admin">🔐 Admin</button>
      <button class="role" data-role="teacher">👩‍🏫 Teacher</button>
      <button class="role" data-role="parent">👨‍👩‍👧 Parent</button>
    </div>
    <div id="loginFields"></div>
    <button class="primary" onclick="login()">🚀 Login</button>
    <div class="demo">Demo: Admin PIN <b>1234</b> • Teacher <b>teacher / 1234</b> • Parent <b>parent1 / 1234</b></div>
  </div>
</div>

<div id="app" class="app hidden">
<header class="top">
  <div class="brand">🏫 <span id="schoolTitle">School Attendance PRO</span><small id="roleLabel"></small></div>
  <div class="actions"><button class="btn" onclick="backup()">💾 <span>Backup</span></button><button class="btn danger" onclick="logout()">🚪 <span>Logout</span></button></div>
</header>
<main class="container">
  <section class="hero"><h2 id="welcome">Welcome</h2><p id="heroSub">Manage school attendance easily.</p></section>
  <div id="tabs" class="tabs"></div>
  <section id="content"></section>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>
<input id="restoreFile" type="file" accept=".json" hidden>

<script>
const KEY="schoolAttendancePro_v3";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const month=()=>today().slice(0,7);
let db=load(), session=null, role="admin", activeTab="dashboard";

function seed(){
 return {
  settings:{school:"Sunrise Public School",className:"First Class",division:"A",teacher:"Class Teacher"},
  adminPin:"1234",
  teachers:[{id:"t1",name:"Class Teacher",username:"teacher",pin:"1234"}],
  students:[
   {id:"s1",name:"Aarav Sharma",roll:"1",className:"First Class",division:"A",parentName:"Parent One",parentPhone:"",parentUser:"parent1",parentPin:"1234"},
   {id:"s2",name:"Anaya Patil",roll:"2",className:"First Class",division:"A",parentName:"Parent Two",parentPhone:"",parentUser:"parent2",parentPin:"1234"}
  ],
  attendance:[], homework:[], remarks:[]
 };
}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.students?x:seed()}catch(e){return seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(d){if(!d)return"";let [y,m,day]=d.split("-");return `${day}-${m}-${y}`}
function pct(n,d){return d?Math.round(n/d*100):0}
function student(id){return db.students.find(s=>s.id===id)}
function attFor(sid,date){return db.attendance.find(a=>a.studentId===sid&&a.date===date)}
function stats(sid,start,end){
 let arr=db.attendance.filter(a=>a.studentId===sid&&a.date>=start&&a.date<=end);
 return {present:arr.filter(a=>a.status==="Present").length,absent:arr.filter(a=>a.status==="Absent").length,half:arr.filter(a=>a.status==="Half Day").length,leave:arr.filter(a=>a.status==="Leave").length,total:arr.length};
}
function monthRange(m){let [y,mo]=m.split("-");let last=new Date(+y,+mo,0).getDate();return [`${y}-${mo}-01`,`${y}-${mo}-${String(last).padStart(2,"0")}`]}
function currentUserName(){if(role==="admin")return"Administrator";if(role==="teacher")return session.name;return student(session.studentId)?.name||"Parent"}
function setRole(r){role=r;document.querySelectorAll(".role").forEach(x=>x.classList.toggle("active",x.dataset.role===r));renderLoginFields()}
function renderLoginFields(){
 let f=document.getElementById("loginFields");
 if(role==="admin")f.innerHTML=`<div class="field"><label>Admin PIN</label><input id="loginPin" type="password" inputmode="numeric" placeholder="Enter admin PIN"></div>`;
 if(role==="teacher")f.innerHTML=`<div class="field"><label>Username</label><input id="loginUser" placeholder="teacher"></div><div class="field"><label>PIN / Password</label><input id="loginPin" type="password" placeholder="1234"></div>`;
 if(role==="parent")f.innerHTML=`<div class="field"><label>Parent Username</label><input id="loginUser" placeholder="parent1"></div><div class="field"><label>PIN / Password</label><input id="loginPin" type="password" placeholder="1234"></div>`;
}
document.querySelectorAll(".role").forEach(b=>b.onclick=()=>setRole(b.dataset.role));
renderLoginFields();

function login(){
 let pin=document.getElementById("loginPin")?.value||"", user=document.getElementById("loginUser")?.value.trim()||"";
 if(role==="admin"&&pin===db.adminPin){session={name:"Administrator"};start()}
 else if(role==="teacher"){let t=db.teachers.find(x=>x.username===user&&x.pin===pin);if(t){session=t;start()}else toast("Invalid teacher login")}
 else if(role==="parent"){let s=db.students.find(x=>x.parentUser===user&&x.parentPin===pin);if(s){session={studentId:s.id,name:s.parentName||s.name};start()}else toast("Invalid parent login")}
 else toast("Invalid admin PIN")
}
function start(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("schoolTitle").textContent=db.settings.school;document.getElementById("roleLabel").textContent=role.toUpperCase();activeTab=role==="parent"?"mychild":"dashboard";render()}
function logout(){session=null;document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden");document.getElementById("loginPin").value="";document.getElementById("loginUser")?.value&&(document.getElementById("loginUser").value="")}
function tabs(){
 let a=role==="admin"?[
 ["dashboard","📊 Dashboard"],["students","👧 Students"],["attendance","📝 Attendance"],["reports","📈 Reports"],["teachers","👩‍🏫 Teachers"],["settings","⚙️ Settings"],["backup","💾 Backup"]
 ]:role==="teacher"?[
 ["dashboard","📊 Dashboard"],["attendance","📝 Attendance"],["students","👧 Students"],["reports","📈 Reports"]
 ]:[["mychild","👦 My Child"],["calendar","📅 Calendar"],["reportcard","🏆 Report Card"]];
 return a;
}
function render(){document.getElementById("tabs").innerHTML=tabs().map(x=>`<button class="tab ${activeTab===x[0]?"active":""}" onclick="activeTab='${x[0]}';render()">${x[1]}</button>`).join("");document.getElementById("welcome").textContent=`Hello, ${currentUserName()} 👋`;document.getElementById("heroSub").textContent=role==="parent"?"View your child's attendance, homework and report card.":"Manage attendance, students and school reports.";document.getElementById("content").innerHTML=views[activeTab]();}

const views={
 dashboard(){
  let all=db.students.length, start=`${new Date().getFullYear()}-01-01`,end=`${new Date().getFullYear()}-12-31`;
  let arr=db.attendance.filter(a=>a.date>=start&&a.date<=end), p=arr.filter(a=>a.status==="Present").length;
  return `<div class="grid">
   <div class="stat"><div class="ico">👧</div><b>${all}</b><span>Total Students</span></div>
   <div class="stat"><div class="ico">🟢</div><b>${arr.filter(a=>a.status==="Present").length}</b><span>Present Records</span></div>
   <div class="stat"><div class="ico">🔴</div><b>${arr.filter(a=>a.status==="Absent").length}</b><span>Absent Records</span></div>
   <div class="stat"><div class="ico">📊</div><b>${pct(p,arr.length)}%</b><span>Overall Attendance</span></div>
  </div>
  <div class="card"><h3>🏆 Attendance Leaderboard</h3><div class="kids">${db.students.map(s=>{let z=stats(s,start,end);return `<div class="student" onclick="openStudent('${s.id}')"><div class="avatar">🧒</div><h4>${esc(s.name)}</h4><small>Roll ${esc(s.roll)} • ${esc(s.className)}-${esc(s.division)}</small><div class="progress"><i style="width:${pct(z.present,z.total)}%"></i></div><b>${pct(z.present,z.total)}%</b> attendance</div>`}).join("")}</div></div>`;
 },
 students(){
  return `<div class="card"><h3>👧 Student Management</h3><div class="formgrid">
   <div class="field"><label>Name</label><input id="sn"></div><div class="field"><label>Roll No.</label><input id="sr"></div>
   <div class="field"><label>Class</label><input id="sc" value="${esc(db.settings.className)}"></div><div class="field"><label>Division</label><input id="sd" value="${esc(db.settings.division)}"></div>
   <div class="field"><label>Parent Name</label><input id="sp"></div><div class="field"><label>Parent Phone</label><input id="sphone"></div>
   <div class="field"><label>Parent Username</label><input id="su" placeholder="parent3"></div><div class="field"><label>Parent PIN</label><input id="spi" value="1234"></div>
  </div><div class="row-actions"><button class="btn success" onclick="addStudent()">➕ Add Student</button></div></div>
  <div class="card"><h3>Student List (${db.students.length})</h3><div class="tablewrap"><table><thead><tr><th>Roll</th><th>Name</th><th>Class</th><th>Parent</th><th>Parent Login</th><th>Action</th></tr></thead><tbody>${db.students.map(s=>`<tr><td>${esc(s.roll)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.className)}-${esc(s.division)}</td><td>${esc(s.parentName)}</td><td>${esc(s.parentUser)}</td><td><button class="btn" onclick="editStudent('${s.id}')">✏️</button> <button class="btn danger" onclick="deleteStudent('${s.id}')">🗑️</button></td></tr>`).join("")}</tbody></table></div></div>`;
 },
 attendance(){
  let d=today();
  return `<div class="card"><h3>📝 Mark Attendance</h3><div class="formgrid">
   <div class="field"><label>Date</label><input id="adate" type="date" value="${d}"></div>
   <div class="field"><label>Student</label><select id="asid">${db.students.map(s=>`<option value="${s.id}">${esc(s.roll)} - ${esc(s.name)}</option>`).join("")}</select></div>
   <div class="field"><label>Status</label><select id="astatus"><option>Present</option><option>Absent</option><option>Half Day</option><option>Leave</option></select></div>
   <div class="field"><label>Time In</label><input id="tin" type="time"></div><div class="field"><label>Time Out</label><input id="tout" type="time"></div>
   <div class="field"><label>Homework</label><select id="hw"><option>Completed</option><option>Partial</option><option>Not Done</option></select></div>
   <div class="field wide"><label>Teacher Remark</label><input id="arem" placeholder="Good work / late / absent reason..."></div>
  </div><div class="row-actions"><button class="btn success" onclick="saveAttendance()">💾 Save Attendance</button><button class="btn" onclick="markAllPresent()">🟢 Mark All Present</button></div></div>
  <div class="card"><h3>📋 Attendance Records</h3><div class="formgrid"><div class="field"><label>Month</label><input id="filterMonth" type="month" value="${month()}" onchange="renderAttendanceTable()"></div><div class="field"><label>Student</label><select id="filterStudent" onchange="renderAttendanceTable()"><option value="">All Students</option>${db.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div></div><div id="attTable"></div></div>`;
 },
 reports(){
  let m=month(); return `<div class="card"><h3>📈 Monthly Class Report</h3><div class="formgrid"><div class="field"><label>Month</label><input id="rm" type="month" value="${m}" onchange="renderReportTable()"></div></div><div id="reportTable"></div></div><div class="card"><h3>📅 Yearly Summary</h3><div id="yearTable"></div></div>`;
 },
 teachers(){
  return `<div class="card"><h3>👩‍🏫 Teacher Management</h3><div class="formgrid"><div class="field"><label>Name</label><input id="tn"></div><div class="field"><label>Username</label><input id="tu"></div><div class="field"><label>PIN</label><input id="tp" value="1234"></div></div><div class="row-actions"><button class="btn success" onclick="addTeacher()">➕ Add Teacher</button></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Name</th><th>Username</th><th>Action</th></tr></thead><tbody>${db.teachers.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.username)}</td><td><button class="btn danger" onclick="deleteTeacher('${t.id}')">🗑️</button></td></tr>`).join("")}</tbody></table></div></div>`;
 },
 settings(){
  return `<div class="card"><h3>⚙️ School Settings</h3><div class="formgrid"><div class="field wide"><label>School Name</label><input id="setSchool" value="${esc(db.settings.school)}"></div><div class="field"><label>Default Class</label><input id="setClass" value="${esc(db.settings.className)}"></div><div class="field"><label>Division</label><input id="setDiv" value="${esc(db.settings.division)}"></div><div class="field"><label>Teacher</label><input id="setTeacher" value="${esc(db.settings.teacher)}"></div><div class="field"><label>New Admin PIN</label><input id="setPin" type="password" placeholder="Leave blank to keep current"></div></div><div class="row-actions"><button class="btn success" onclick="saveSettings()">💾 Save Settings</button></div></div><div class="card"><h3>🔒 Security Note</h3><div class="note">This is a single-file offline application. Credentials are stored in browser storage and are suitable for a prototype/small offline tool, not production-grade authentication.</div></div>`;
 },
 backup(){
  return `<div class="card"><h3>💾 Backup & Restore</h3><p>Keep a JSON backup regularly, especially before clearing browser data.</p><div class="row-actions"><button class="btn success" onclick="backup()">⬇️ Download JSON Backup</button><button class="btn" onclick="document.getElementById('restoreFile').click()">⬆️ Restore JSON</button><button class="btn" onclick="exportCSV()">📄 Export Attendance CSV</button></div><div class="note" style="margin-top:12px">Browser storage normally persists across sessions for the same origin. For directly opened file URLs, browser behavior can vary, so JSON backup is recommended.</div></div><div class="card"><h3>🧹 Danger Zone</h3><button class="btn danger" onclick="clearAll()">Delete All Application Data</button></div>`;
 },
 mychild(){
  let s=student(session.studentId), [a,b]=monthRange(month()), z=stats(s.id,a,b);
  return `<div class="card"><h3>👦 ${esc(s.name)}</h3><p>Roll ${esc(s.roll)} • ${esc(s.className)}-${esc(s.division)} • Parent: ${esc(s.parentName)}</p><div class="grid"><div class="stat"><b>${pct(z.present,z.total)}%</b><span>Attendance</span></div><div class="stat"><b>${z.present}</b><span>Present</span></div><div class="stat"><b>${z.absent}</b><span>Absent</span></div><div class="stat"><b>${z.half}</b><span>Half Day</span></div></div></div><div class="card"><h3>📚 Recent Homework & Remarks</h3>${recentStudent(s.id)}</div>`;
 },
 calendar(){
  let s=student(session.studentId), m=month();return `<div class="card"><h3>📅 Attendance Calendar - ${m}</h3>${calendarHTML(s.id,m)}</div>`;
 },
 reportcard(){
  return `<div class="card printable"><div id="reportCard"></div></div><div class="row-actions no-print"><button class="primary" style="width:auto" onclick="window.print()">🖨️ Print / Save as PDF</button></div>`;
 }
};

function recentStudent(id){
 let rows=db.attendance.filter(a=>a.studentId===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
 if(!rows.length)return"<p>No attendance records yet.</p>";
 return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Status</th><th>Homework</th><th>Remark</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${fmt(a.date)}</td><td><span class="badge ${a.status==='Present'?'present':a.status==='Absent'?'absent':a.status==='Half Day'?'half':'leave'}">${a.status}</span></td><td>${esc(a.homework||"-")}</td><td>${esc(a.remark||"-")}</td></tr>`).join("")}</tbody></table></div>`;
}
function calendarHTML(id,m){
 let [y,mo]=m.split("-").map(Number), first=new Date(y,mo-1,1), days=new Date(y,mo,0).getDate(), html=`<div class="calendar">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="dow">${x}</div>`).join("")}`;
 for(let i=0;i<first.getDay();i++)html+=`<div></div>`;
 for(let d=1;d<=days;d++){let date=`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`,a=attFor(id,date),cl=a?(a.status==="Present"?"presentday":a.status==="Absent"?"absentday":a.status==="Half Day"?"halfday":"leaveday"):"";html+=`<div class="day ${cl}"><b>${d}</b><br>${a?esc(a.status):"—"}</div>`}
 return html+"</div>";
}
function saveAttendance(){
 let sid=asid.value,date=adate.value,a={id:uid(),studentId:sid,date,status:astatus.value,timeIn:tin.value,timeOut:tout.value,homework:hw.value,remark:arem.value};
 let old=attFor(sid,date);if(old){Object.assign(old,a);a.id=old.id}else db.attendance.push(a);save();toast("Attendance saved");renderAttendanceTable();
}
function markAllPresent(){let d=adate.value||today();db.students.forEach(s=>{let a=attFor(s.id,d);if(a)a.status="Present";else db.attendance.push({id:uid(),studentId:s.id,date:d,status:"Present",timeIn:"",timeOut:"",homework:"Completed",remark:""})});save();toast("All students marked Present");renderAttendanceTable()}
function renderAttendanceTable(){
 let m=document.getElementById("filterMonth")?.value||month(),sid=document.getElementById("filterStudent")?.value||"",box=document.getElementById("attTable");if(!box)return;
 let rows=db.attendance.filter(a=>a.date.startsWith(m)&&(!sid||a.studentId===sid)).sort((a,b)=>b.date.localeCompare(a.date));
 box.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Roll</th><th>Student</th><th>Status</th><th>In</th><th>Out</th><th>Homework</th><th>Remark</th><th>Action</th></tr></thead><tbody>${rows.map(a=>{let s=student(a.studentId);return `<tr><td>${fmt(a.date)}</td><td>${esc(s?.roll)}</td><td>${esc(s?.name)}</td><td><span class="badge ${a.status==='Present'?'present':a.status==='Absent'?'absent':a.status==='Half Day'?'half':'leave'}">${a.status}</span></td><td>${a.timeIn||"-"}</td><td>${a.timeOut||"-"}</td><td>${esc(a.homework||"-")}</td><td>${esc(a.remark||"-")}</td><td><button class="btn danger" onclick="deleteAtt('${a.id}')">🗑️</button></td></tr>`}).join("")}</tbody></table></div>`;
}
function deleteAtt(id){if(confirm("Delete this record?")){db.attendance=db.attendance.filter(a=>a.id!==id);save();renderAttendanceTable();}}
function renderReportTable(){
 let m=document.getElementById("rm")?.value||month(),[a,b]=monthRange(m),box=document.getElementById("reportTable");if(!box)return;
 box.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Roll</th><th>Student</th><th>Present</th><th>Absent</th><th>Half</th><th>Leave</th><th>Total</th><th>%</th><th>Report</th></tr></thead><tbody>${db.students.map(s=>{let z=stats(s.id,a,b);return `<tr><td>${esc(s.roll)}</td><td>${esc(s.name)}</td><td>${z.present}</td><td>${z.absent}</td><td>${z.half}</td><td>${z.leave}</td><td>${z.total}</td><td><b>${pct(z.present,z.total)}%</b></td><td><button class="btn" onclick="showReport('${s.id}','${m}')">🏆</button></td></tr>`}).join("")}</tbody></table></div>`;
 renderYearTable();
}
function renderYearTable(){
 let y=new Date().getFullYear(),box=document.getElementById("yearTable");if(!box)return;
 box.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Student</th>${Array.from({length:12},(_,i)=>`<th>${i+1}</th>`).join("")}<th>Year %</th></tr></thead><tbody>${db.students.map(s=>{let vals=Array.from({length:12},(_,i)=>{let m=`${y}-${String(i+1).padStart(2,"0")}`,z=stats(s.id,...monthRange(m));return pct(z.present,z.total)});let z=stats(s.id,`${y}-01-01`,`${y}-12-31`);return `<tr><td>${esc(s.name)}</td>${vals.map(v=>`<td>${v}%</td>`).join("")}<td><b>${pct(z.present,z.total)}%</b></td></tr>`}).join("")}</tbody></table></div>`;
}
function openStudent(id){if(role==="parent")return;showReport(id,month())}
function showReport(id,m){
 let s=student(id),[a,b]=monthRange(m),z=stats(id,a,b);
 document.getElementById("modalContent").innerHTML=`<div class="report"><h1>🏫 ${esc(db.settings.school)}</h1><div class="school">Monthly Student Report Card</div><hr><p><b>Student:</b> ${esc(s.name)} &nbsp; <b>Roll:</b> ${esc(s.roll)} &nbsp; <b>Class:</b> ${esc(s.className)}-${esc(s.division)}</p><p><b>Month:</b> ${m}</p><div class="reportgrid"><div class="reportbox"><b>${pct(z.present,z.total)}%</b>Attendance</div><div class="reportbox"><b>${z.present}</b>Present</div><div class="reportbox"><b>${z.absent}</b>Absent</div><div class="reportbox"><b>${z.half}</b>Half Day</div></div>${recentStudent(id)}<p style="margin-top:35px">Teacher Signature: ____________________</p></div><div class="row-actions"><button class="primary" style="width:auto" onclick="window.print()">🖨️ Print / Save as PDF</button></div>`;
 document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function renderReportCard(){
 let s=student(session.studentId),m=month(),[a,b]=monthRange(m),z=stats(s.id,a,b);
 document.getElementById("reportCard").innerHTML=`<div class="report"><h1>🏫 ${esc(db.settings.school)}</h1><div class="school">MONTHLY REPORT CARD</div><hr><p><b>Student:</b> ${esc(s.name)} &nbsp; <b>Roll:</b> ${esc(s.roll)}</p><p><b>Class:</b> ${esc(s.className)}-${esc(s.division)} &nbsp; <b>Month:</b> ${m}</p><div class="reportgrid"><div class="reportbox"><b>${pct(z.present,z.total)}%</b>Attendance</div><div class="reportbox"><b>${z.present}</b>Present</div><div class="reportbox"><b>${z.absent}</b>Absent</div><div class="reportbox"><b>${z.half}</b>Half Day</div></div>${recentStudent(s.id)}<p style="margin-top:45px"><b>Class Teacher:</b> ____________________</p><p><b>Parent Signature:</b> ____________________</p></div>`;
}
function addStudent(){
 let n=sn.value.trim();if(!n)return toast("Enter student name");db.students.push({id:uid(),name:n,roll:sr.value.trim(),className:sc.value.trim(),division:sd.value.trim(),parentName:sp.value.trim(),parentPhone:sphone.value.trim(),parentUser:su.value.trim()||"parent"+(db.students.length+1),parentPin:spi.value||"1234"});save();toast("Student added");render();
}
function editStudent(id){
 let s=student(id);document.getElementById("modalContent").innerHTML=`<h3>✏️ Edit Student</h3><div class="formgrid"><div class="field"><label>Name</label><input id="en" value="${esc(s.name)}"></div><div class="field"><label>Roll</label><input id="er" value="${esc(s.roll)}"></div><div class="field"><label>Class</label><input id="ec" value="${esc(s.className)}"></div><div class="field"><label>Division</label><input id="ed" value="${esc(s.division)}"></div><div class="field"><label>Parent</label><input id="ep" value="${esc(s.parentName)}"></div><div class="field"><label>Parent User</label><input id="eu" value="${esc(s.parentUser)}"></div><div class="field"><label>Parent PIN</label><input id="epi" value="${esc(s.parentPin)}"></div></div><button class="primary" onclick="updateStudent('${id}')">Save Changes</button>`;document.getElementById("modal").classList.remove("hidden");
}
function updateStudent(id){let s=student(id);Object.assign(s,{name:en.value.trim(),roll:er.value.trim(),className:ec.value.trim(),division:ed.value.trim(),parentName:ep.value.trim(),parentUser:eu.value.trim(),parentPin:epi.value});save();closeModal();render()}
function deleteStudent(id){if(confirm("Delete student and attendance records?")){db.students=db.students.filter(s=>s.id!==id);db.attendance=db.attendance.filter(a=>a.studentId!==id);save();render()}}
function addTeacher(){if(!tn.value.trim()||!tu.value.trim())return toast("Name and username required");db.teachers.push({id:uid(),name:tn.value.trim(),username:tu.value.trim(),pin:tp.value||"1234"});save();render()}
function deleteTeacher(id){if(confirm("Delete teacher?")){db.teachers=db.teachers.filter(t=>t.id!==id);save();render()}}
function saveSettings(){db.settings.school=setSchool.value.trim()||db.settings.school;db.settings.className=setClass.value.trim();db.settings.division=setDiv.value.trim();db.settings.teacher=setTeacher.value.trim();if(setPin.value.trim())db.adminPin=setPin.value.trim();save();document.getElementById("schoolTitle").textContent=db.settings.school;toast("Settings saved");render()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="school-attendance-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.getElementById("restoreFile").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.students||!x.attendance)throw Error();db=x;save();toast("Backup restored");render()}catch(err){toast("Invalid backup file")}};r.readAsText(f)});
function exportCSV(){let rows=[["Date","Roll","Student","Status","Time In","Time Out","Homework","Remark"],...db.attendance.map(a=>{let s=student(a.studentId);return[a.date,s?.roll,s?.name,a.status,a.timeIn,a.timeOut,a.homework,a.remark]})];let csv=rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n"),blob=new Blob([csv],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="attendance.csv";a.click()}
function clearAll(){if(confirm("This will delete ALL students, teachers and attendance data. Continue?")){db=seed();save();logout()}}
function initAfterRender(){
 if(activeTab==="attendance"){renderAttendanceTable()}
 if(activeTab==="reports"){renderReportTable()}
 if(activeTab==="reportcard"){renderReportCard()}
}
const oldRender=render;render=function(){oldRender();setTimeout(initAfterRender,0)}
</script>
</body>
</html>

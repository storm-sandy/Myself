/* =========================================================

========================================================= */

function formatDate(d){

  return `${d.getFullYear()}-${
    String(d.getMonth()+1).padStart(2,"0")
  }-${
    String(d.getDate()).padStart(2,"0")
  }`;

}


function initializeDates(){

  const today = new Date();

  dateEl.value = formatDate(today);

  fromDateEl.value =
    formatDate(
      new Date(
        today.getFullYear(),
        today.getMonth(),
        1
      )
    );

  toDateEl.value =
    formatDate(
      new Date(
        today.getFullYear(),
        today.getMonth()+1,
        0
      )
    );

}

/* =========================================================
   INDEXEDDB
   ---------------------------------------------------------
   SQL.js keeps SQLite in memory.
   Browser cannot directly keep a .db file as a normal file,
   so the SQLite binary is automatically stored in IndexedDB.

   This is NOT application data in LocalStorage.
========================================================= */

const IDB_NAME = "FulldaySQLiteStorage";
const IDB_STORE = "database";


function openIDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(IDB_NAME,1);

    request.onupgradeneeded = function(e){

      const idb = e.target.result;

      if(!idb.objectStoreNames.contains(IDB_STORE)){
        idb.createObjectStore(IDB_STORE);
      }

    };

    request.onsuccess =
      () => resolve(request.result);

    request.onerror =
      () => reject(request.error);

  });

}


async function saveSQLiteToBrowser(){

  if(!db) return;

  const bytes = db.export();

  const idb =
    await openIDB();

  return new Promise((resolve,reject)=>{

    const tx =
      idb.transaction(IDB_STORE,"readwrite");

    tx.objectStore(IDB_STORE)
      .put(bytes,"fullday.db");

    tx.oncomplete = ()=>{
      idb.close();
      resolve();
    };

    tx.onerror = ()=>{
      idb.close();
      reject(tx.error);
    };

  });

}


async function loadSQLiteFromBrowser(){

  const idb =
    await openIDB();

  return new Promise((resolve,reject)=>{

    const tx =
      idb.transaction(IDB_STORE,"readonly");

    const request =
      tx.objectStore(IDB_STORE)
        .get("fullday.db");

    request.onsuccess = ()=>{

      idb.close();
      resolve(request.result || null);

    };

    request.onerror = ()=>{

      idb.close();
      reject(request.error);

    };

  });

}


/* =========================================================
   CREATE SQLITE DATABASE
========================================================= */

async function initializeDatabase(){

  try{

    dbStatusEl.innerText =
      "Loading SQLite...";

    const SQLConfig =
      await initSqlJs({

        locateFile:
          file =>
          "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/"+file

      });

    SQL = SQLConfig;

    const savedDB =
      await loadSQLiteFromBrowser();


    if(savedDB){

      /*
       * Existing SQLite database found.
       */
      db = new SQL.Database(savedDB);

      dbStatusEl.innerText =
        "✅ Existing SQLite database loaded.";

    }
    else{

      /*
       * First installation.
       */
      db = new SQL.Database();

      createTables();

      await saveSQLiteToBrowser();

      dbStatusEl.innerText =
        "✅ New SQLite database created.";

    }


    renderAll();

  }
  catch(error){

    console.error(error);

    dbStatusEl.innerText =
      "❌ SQLite could not be loaded. Check internet connection.";

    alert(
      "SQLite could not be initialized.\n\n"+
      "If you are using SPCK/Acode, make sure internet access "+
      "is available the first time the page loads."
    );

  }

}


/* =========================================================
   SQLITE TABLE
========================================================= */

function createTables(){

  db.run(`
    CREATE TABLE IF NOT EXISTS fullday_records (

      id INTEGER PRIMARY KEY AUTOINCREMENT,

      date TEXT NOT NULL,

      cost REAL NOT NULL DEFAULT 0,

      place TEXT,

      description TEXT,

      time_slot TEXT,

      category TEXT

    )
  `);


  db.run(`
    CREATE INDEX IF NOT EXISTS idx_fullday_date
    ON fullday_records(date)
  `);


  db.run(`
    CREATE INDEX IF NOT EXISTS idx_fullday_category
    ON fullday_records(category)
  `);

}


/* =========================================================
   ADD RECORD
========================================================= */

async function addRecord(){

  if(!db){

    alert("SQLite database is not ready.");

    return;

  }


  const date =
    dateEl.value;

  const cost =
    parseFloat(costEl.value);

  const place =
    placeEl.value.trim();

  const desc =
    descEl.value.trim();

  const time =
    typesEl.value;

  const category =
    typeEl.value;


  if(!date){

    alert("Please select date.");

    return;

  }


  if(isNaN(cost)){

    alert("Please enter a valid count.");

    return;

  }


  db.run(`
    INSERT INTO fullday_records
    (date,cost,place,description,time_slot,category)
    VALUES (?,?,?,?,?,?)
  `,[
    date,
    cost,
    place,
    desc,
    time,
    category
  ]);


  await saveSQLiteToBrowser();

  clearForm();

  renderAll();

  alert("Record added to SQLite.");

}


/* =========================================================
   CLEAR FORM
========================================================= */

function clearForm(){

  dateEl.value =
    formatDate(new Date());

  costEl.value = "";

  placeEl.value = "";

  descEl.value = "";

  typesEl.value = "";

  typeEl.value = "";

}


/* =========================================================
   GET FILTERED DATA
========================================================= */

function getFilteredData(){

  if(!db) return [];

  const from =
    fromDateEl.value;

  const to =
    toDateEl.value;

  const category =
    filterTypeEl.value;


  let sql = `
    SELECT
      id,
      date,
      cost,
      place,
      description,
      time_slot,
      category
    FROM fullday_records
    WHERE 1=1
  `;


  const params = [];


  if(from){

    sql += " AND date >= ?";

    params.push(from);

  }


  if(to){

    sql += " AND date <= ?";

    params.push(to);

  }


  if(category){

    sql += " AND category = ?";

    params.push(category);

  }


  sql += " ORDER BY date ASC, id ASC";


  const result =
    db.exec(sql,params);


  if(!result.length)
    return [];


  return result[0].values.map(row=>({

    id:row[0],
    date:row[1],
    cost:Number(row[2] || 0),
    place:row[3] || "",
    desc:row[4] || "",
    types:row[5] || "",
    type:row[6] || ""

  }));

}


/* =========================================================
   DELETE SINGLE RECORD
========================================================= */

async function deleteRow(id){

  if(!confirm("Delete this record?"))
    return;


  db.run(
    "DELETE FROM fullday_records WHERE id=?",
    [id]
  );


  await saveSQLiteToBrowser();

  renderAll();

}


/* =========================================================
   DELETE DATE RANGE
========================================================= */

async function deleteByDateRange(){

  const from =
    fromDateEl.value;

  const to =
    toDateEl.value;


  if(!from || !to){

    alert(
      "Please select From and To dates."
    );

    return;

  }


  if(from > to){

    alert(
      "From date cannot be after To date."
    );

    return;

  }


  if(!confirm(
    "Delete ALL records between "+from+
    " and "+to+"?"
  )) return;


  const before =
    getRecordCount();


  db.run(`
    DELETE FROM fullday_records
    WHERE date >= ? AND date <= ?
  `,[from,to]);


  await saveSQLiteToBrowser();

  renderAll();


  const after =
    getRecordCount();


  alert(
    (before-after)+
    " record(s) deleted."
  );

}


/* =========================================================
   COUNT
========================================================= */

function getRecordCount(){

  const result =
    db.exec(
      "SELECT COUNT(*) FROM fullday_records"
    );

  return result.length
    ? Number(result[0].values[0][0])
    : 0;

}


/* =========================================================
   WEEK
========================================================= */

function getWeekKey(s){

  const d =
    new Date(s);

  d.setHours(0,0,0,0);

  d.setDate(
    d.getDate() +
    3 -
    (d.getDay()+6)%7
  );

  const w1 =
    new Date(
      d.getFullYear(),
      0,
      4
    );

  const n =
    1 +
    Math.round(
      (
        (d-w1)/86400000 -
        3 +
        (w1.getDay()+6)%7
      )/7
    );

  return d.getFullYear()+
    "-W"+
    String(n).padStart(2,"0");

}


/* =========================================================
   GROUPING
========================================================= */

function getKey(date,type){

  if(type==="day")
    return date;

  if(type==="month")
    return date.slice(0,7);

  if(type==="year")
    return date.slice(0,4);

  if(type==="week")
    return getWeekKey(date);

}


function formatLabel(key,type){

  if(type==="month"){

    const p =
      key.split("-");

    return new Date(
      p[0],
      p[1]-1
    ).toLocaleString(
      "default",
      {
        month:"short",
        year:"numeric"
      }
    );

  }


  if(type==="week")
    return "Week "+key.split("W")[1];


  return key;

}


/* =========================================================
   GROUP DATA
========================================================= */

function groupData(filtered,type){

  const g = {};

  filtered.forEach(r=>{

    const k =
      getKey(r.date,type);

    g[k] =
      (g[k] || 0) +
      Number(r.cost || 0);

  });

  return g;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(v){

  return String(v || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   TABLE
========================================================= */

function renderTable(filtered){

  tableBodyEl.innerHTML = "";

  filtered.forEach(r=>{

    const tr =
      document.createElement("tr");


    tr.innerHTML = `
      <td>${escapeHTML(r.date)}</td>
      <td>${Number(r.cost || 0)}</td>
      <td>${escapeHTML(r.place)}</td>
      <td>${escapeHTML(r.desc)}</td>
      <td>${escapeHTML(r.types)}</td>
      <td>${escapeHTML(r.type)}</td>
      <td>
        <button
          class="delete-btn"
          onclick="deleteRow(${r.id})">
          X
        </button>
      </td>
    `;


    tableBodyEl.appendChild(tr);

  });


  recordCountEl.innerText =
    filtered.length;

}


/* =========================================================
   CHART
========================================================= */

function renderChart(filtered){

  if(!window.Chart)
    return;


  const type =
    viewTypeEl.value;

  const g =
    groupData(filtered,type);

  const keys =
    Object.keys(g).sort();


  if(chart)
    chart.destroy();


  chart =
    new Chart(
      document.getElementById("chart"),
      {

        type:
          type==="day"
            ? "line"
            : "bar",

        data:{

          labels:
            keys.map(
              k=>formatLabel(k,type)
            ),

          datasets:[{

            label:
              type.toUpperCase()+
              " Total",

            data:
              keys.map(k=>g[k]),

            borderWidth:2

          }]

        },

        options:{

          responsive:true,

          scales:{

            y:{
              beginAtZero:true
            }

          }

        }

      }
    );

}


/* =========================================================
   TOTAL
========================================================= */

function renderTotal(filtered){

  totalEl.innerText =
    filtered.reduce(
      (s,r)=>
        s+Number(r.cost||0),
      0
    );

}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function renderAll(){

  if(!db)
    return;


  const filtered =
    getFilteredData();


  renderTable(filtered);

  renderChart(filtered);

  renderTotal(filtered);

}


/* =========================================================
   CSV EXPORT
========================================================= */

function csvEscape(v){

  return '"'+
    String(v ?? "")
      .replace(/"/g,'""')+
    '"';

}


function exportCSV(){

  if(!db){

    alert("SQLite database is not ready.");

    return;

  }


  const result =
    db.exec(`
      SELECT
        date,
        cost,
        place,
        description,
        time_slot,
        category
      FROM fullday_records
      ORDER BY date,id
    `);


  if(!result.length){

    alert(
      "No records to export."
    );

    return;

  }


  let csv =
    "date,cost,place,desc,types,type\n";


  result[0].values.forEach(r=>{

    csv +=
      r.map(csvEscape).join(",")+
      "\n";

  });


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "fullday-dashboard.csv";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

  const rows=[];

  let row=[];

  let value="";

  let quotes=false;


  for(let i=0;i<text.length;i++){

    const c =
      text[i];

    const n =
      text[i+1];


    if(
      c==='"' &&
      quotes &&
      n==='"'
    ){

      value += '"';

      i++;

      continue;

    }


    if(c==='"'){

      quotes=!quotes;

      continue;

    }


    if(c==="," && !quotes){

      row.push(value);

      value="";

      continue;

    }


    if(
      (c==="\n" || c==="\r") &&
      !quotes
    ){

      if(
        c==="\r" &&
        n==="\n"
      )
        i++;


      row.push(value);

      value="";


      if(row.length)
        rows.push(row);


      row=[];

      continue;

    }


    value += c;

  }


  if(
    value!=="" ||
    row.length
  ){

    row.push(value);

    rows.push(row);

  }


  return rows;

}


/* =========================================================
   CSV IMPORT
========================================================= */

async function importCSV(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  const reader =
    new FileReader();


  reader.onload =
    async function(e){

      try{

        const rows =
          parseCSV(
            e.target.result
              .replace(/^\uFEFF/,"")
          );


        if(rows.length < 2){

          alert(
            "CSV file contains no records."
          );

          return;

        }


        const header =
          rows[0].map(
            h=>h.trim().toLowerCase()
          );


        const idx =
          n=>header.indexOf(n);


        let imported=0;


        /*
         * Transaction:
         * Either all imported records are committed,
         * or an error rolls them back.
         */

        db.run("BEGIN TRANSACTION");


        try{

          for(
            let i=1;
            i<rows.length;
            i++
          ){

            const row =
              rows[i];


            const date =
              idx("date")>=0
                ? row[idx("date")].trim()
                : "";


            const cost =
              idx("cost")>=0
                ? parseFloat(
                    row[idx("cost")]
                  )
                : NaN;


            const place =
              idx("place")>=0
                ? row[idx("place")]
                : "";


            const desc =
              idx("desc")>=0
                ? row[idx("desc")]
                : "";


            const types =
              idx("types")>=0
                ? row[idx("types")]
                : "";


            const type =
              idx("type")>=0
                ? row[idx("type")]
                : "";


            if(
              !date ||
              isNaN(cost)
            )
              continue;


            db.run(`
              INSERT INTO fullday_records
              (date,cost,place,description,time_slot,category)
              VALUES (?,?,?,?,?,?)
            `,[
              date,
              cost,
              place,
              desc,
              types,
              type
            ]);


            imported++;

          }


          db.run(
            "COMMIT"
          );


        }
        catch(error){

          db.run(
            "ROLLBACK"
          );

          throw error;

        }


        await saveSQLiteToBrowser();

        renderAll();


        alert(
          imported+
          " record(s) imported into SQLite successfully."
        );

      }
      catch(err){

        console.error(err);

        alert(
          "Unable to import CSV file."
        );

      }


      event.target.value="";

    };


  reader.readAsText(file);

}


/* =========================================================
   EXPORT REAL SQLITE DATABASE FILE
========================================================= */

function exportSQLite(){

  if(!db){

    alert(
      "SQLite database is not ready."
    );

    return;

  }


  const bytes =
    db.export();


  const blob =
    new Blob(
      [bytes],
      {
        type:
          "application/x-sqlite3"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href=url;

  a.download =
    "fullday.db";


  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);


  URL.revokeObjectURL(url);

  alert(
    "SQLite database exported as fullday.db"
  );

}


/* =========================================================
   IMPORT REAL SQLITE DATABASE FILE
========================================================= */

async function importSQLite(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  try{

    const buffer =
      await file.arrayBuffer();


    const bytes =
      new Uint8Array(buffer);


    /*
     * Replace current SQLite database
     * with the imported database.
     */

    db =
      new SQL.Database(bytes);


    createTables();


    await saveSQLiteToBrowser();


    renderAll();


    dbStatusEl.innerText =
      "✅ Imported SQLite database loaded.";


    alert(
      "SQLite database imported successfully."
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Invalid or incompatible SQLite database."
    );

  }


  event.target.value="";

}


/* =========================================================
   CLEAR ALL SQLITE DATA
========================================================= */

async function clearAllData(){

  if(!db){

    alert(
      "SQLite database is not ready."
    );

    return;

  }


  const count =
    getRecordCount();


  if(!count){

    alert(
      "No data available."
    );

    return;

  }


  if(!confirm(
    "Delete ALL "+count+
    " records from SQLite?"
  ))
    return;


  db.run(
    "DELETE FROM fullday_records"
  );


  /*
   * Reset auto increment counter.
   */

  db.run(
    "DELETE FROM sqlite_sequence WHERE name='fullday_records'"
  );


  await saveSQLiteToBrowser();

  renderAll();


  alert(
    "All SQLite records deleted."
  );

}

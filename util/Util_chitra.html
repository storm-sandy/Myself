
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#138a4b">
<title>Chitra Sanyojan Kaksha - Swayam</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    transition:background .3s,color .3s;
}

/* HEADER */
.header{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    background:linear-gradient(135deg,#00a86b,#008f5a);
    color:white;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.header h2{
    font-size:20px;
    line-height:1.3;
}

/* THEME BUTTON */
.theme-area{
    position:relative;
    flex-shrink:0;
}

.theme-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:13px;
    background:rgba(255,255,255,.20);
    color:white;
    font-size:23px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.theme-btn:hover{
    background:rgba(255,255,255,.32);
    transform:scale(1.06);
}

.theme-menu{
    display:none;
    position:absolute;
    top:50px;
    right:0;
    min-width:155px;
    padding:7px;
    border-radius:13px;
    background:white;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
    z-index:100;
}

.theme-menu.show{
    display:block;
}

.theme-option{
    width:100%;
    border:none;
    padding:11px;
    margin:2px 0;
    border-radius:9px;
    background:transparent;
    color:#26352d;
    text-align:left;
    font-size:14px;
    cursor:pointer;
}

.theme-option:hover{
    background:#e7f5ed;
}

/* MAIN GRID */
.list-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
    gap:15px;
    padding:16px;
}

/* CARD */
.card{
    padding:16px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
    transition:transform .25s,box-shadow .25s;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:4px;
    background:linear-gradient(90deg,#00a86b,#00d084);
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.17);
}

.card h3{
    font-size:15px;
    margin:5px 0 14px;
}

/* ICON BUTTON */
.app-link{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    min-height:125px;
    padding:15px 8px;
    border-radius:15px;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:transform .2s,background .2s,box-shadow .2s;
}

.app-icon{
    width:65px;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:20px;
    font-size:34px;
    background:rgba(0,168,107,.12);
    box-shadow:0 3px 9px rgba(0,0,0,.08);
    transition:transform .2s;
}

.app-link:hover{
    transform:translateY(-3px);
    background:rgba(0,168,107,.10);
    box-shadow:0 5px 12px rgba(0,0,0,.09);
}

.app-link:hover .app-icon{
    transform:scale(1.08);
}

.app-link:active{
    transform:scale(.96);
}

/* INFORMATION */
.info{
    margin:0 15px 15px;
    padding:13px;
    border-radius:14px;
    text-align:center;
    font-size:13px;
    line-height:1.5;
    opacity:.85;
}

/* LIGHT THEME */
body.light{
    background:#f3f7f5;
    color:#17231e;
}

.light .card{
    background:#fff;
}

.light .app-link{
    color:#126b4b;
}

/* DARK THEME */
body.dark{
    background:#101513;
    color:white;
}

.dark .header{
    background:linear-gradient(135deg,#063d2c,#001f16);
}

.dark .card{
    background:#1b2521;
    box-shadow:0 5px 18px rgba(0,0,0,.4);
}

.dark .app-link{
    color:#8ff0c5;
}

.dark .app-link:hover{
    background:#263a32;
}

.dark .app-icon{
    background:rgba(0,220,145,.14);
}

.dark .info{
    background:#1b2521;
}

/* BLUE THEME */
body.blue{
    background:#eaf4ff;
    color:#122033;
}

.blue .header{
    background:linear-gradient(135deg,#1976d2,#1255a0);
}

.blue .card{
    background:white;
}

.blue .app-link{
    color:#1565c0;
}

.blue .app-icon{
    background:rgba(25,118,210,.12);
}

.blue .app-link:hover{
    background:rgba(25,118,210,.10);
}

.blue .info{
    background:#fff;
}

/* MOBILE */
@media(max-width:600px){
    .header{
        padding:12px;
    }

    .header h2{
        font-size:17px;
    }

    .list-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
        padding:12px;
    }

    .card{
        padding:12px 9px;
    }

    .card h3{
        font-size:13px;
    }

    .app-link{
        min-height:112px;
        font-size:13px;
    }

    .app-icon{
        width:58px;
        height:58px;
        font-size:30px;
    }
}

@media(max-width:340px){
    .list-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body class="light">

<!-- HEADER -->
<header class="header">
    <h2>🖼️ Chitra Sanyojan Kaksha</h2>

    <div class="theme-area">
        <button class="theme-btn"
                id="themeBtn"
                onclick="toggleThemeMenu()"
                aria-label="Choose theme"
                title="Change Theme">
            🎨
        </button>

        <div class="theme-menu" id="themeMenu">
            <button class="theme-option" onclick="changeTheme('light')">
                ☀️ Light Theme
            </button>
            <button class="theme-option" onclick="changeTheme('dark')">
                🌙 Dark Theme
            </button>
            <button class="theme-option" onclick="changeTheme('blue')">
                💙 Blue Theme
            </button>
        </div>
    </div>
</header>

<!-- IMAGE / DOCUMENT TOOLS -->
<main class="list-grid">

    <!-- QR GENERATOR -->
    <div class="card">
        <h3>📷 QR Generator</h3>
        <a class="app-link"
           href="/Myself/img/smart_qrstudio.html"
           onclick="openSwayamPage(event,this.href)">
            <span class="app-icon">▦</span>
            <span>QR Generator</span>
        </a>
    </div>

    <!-- IMAGE EDITOR -->
    <div class="card">
        <h3>🎨 Image Studio</h3>
        <a class="app-link"
           href="/Myself/img/imgedit.html"
           onclick="openSwayamPage(event,this.href)">
            <span class="app-icon">🖼️</span>
            <span>Image Editor</span>
        </a>
    </div>

    <!-- CAMERA PDF -->
    <div class="card">
        <h3>📷 Document Scanner</h3>
        <a class="app-link"
           href="/Myself/img/Smart_CamPDF.html"
           onclick="openSwayamPage(event,this.href)">
            <span class="app-icon">📸</span>
            <span>Camera to PDF</span>
        </a>
    </div>

    <!-- PDF MERGE -->
    <div class="card">
        <h3>📄 PDF Studio</h3>
        <a class="app-link"
           href="/Myself/img/pdfmerge.html"
           onclick="openSwayamPage(event,this.href)">
            <span class="app-icon">📑</span>
            <span>Merge PDF</span>
        </a>
    </div>

</main>

<!-- INFORMATION -->
<div class="info">
    🖼️ <b>Chitra Sanyojan Kaksha</b> —
    Image editing, camera scanning and PDF management tools in one place.
</div>

<script>
/* THEME MENU */
function toggleThemeMenu(){
    document.getElementById("themeMenu").classList.toggle("show");
}

/* CHANGE THEME */
function changeTheme(theme){
    if(!["light","dark","blue"].includes(theme)) return;

    document.body.className=theme;

    localStorage.setItem("swayam_chitra_theme",theme);

    document.getElementById("themeMenu").classList.remove("show");
}

/* LOAD SAVED THEME */
(function(){
    const savedTheme=localStorage.getItem("swayam_chitra_theme");

    if(["light","dark","blue"].includes(savedTheme)){
        document.body.className=savedTheme;
    }
})();

/* CLOSE THEME MENU ON OUTSIDE CLICK */
document.addEventListener("click",function(event){
    const area=document.querySelector(".theme-area");

    if(area && !area.contains(event.target)){
        document.getElementById("themeMenu").classList.remove("show");
    }
});

/* SWAYAM PARENT NAVIGATION */
function openSwayamPage(event,url){
    event.preventDefault();

    try{
        if(window.parent && window.parent!==window){

            var frame=window.parent.document.getElementById("swayamFrame");

            if(frame){
                frame.src=url;

                try{
                    window.parent.localStorage.setItem(
                        "swayam_selected_page",
                        url.split("/").pop()
                    );
                }catch(e){}

                var menuLinks=window.parent.document.querySelectorAll(".menu-button");

                for(var i=0;i<menuLinks.length;i++){
                    menuLinks[i].classList.remove("active");
                }

                for(var j=0;j<menuLinks.length;j++){
                    var menuHref=menuLinks[j].getAttribute("href");

                    if(menuHref &&
                       menuHref.split("/").pop()===url.split("/").pop()){

                        menuLinks[j].classList.add("active");

                        try{
                            menuLinks[j].scrollIntoView({
                                behavior:"smooth",
                                block:"nearest",
                                inline:"center"
                            });
                        }catch(e){}

                        break;
                    }
                }

                return;
            }
        }
    }
    catch(error){
        console.log("Swayam parent navigation error:",error);
    }

    window.location.href=url;
}
</script>

</body>
</html>

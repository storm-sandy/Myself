
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00a86b">

<title>Kids Prabandhan - Swayam</title>

<style>
/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    transition:background .3s,color .3s;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    padding:13px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;

    background:linear-gradient(135deg,#00a86b,#008f5a);
    color:white;

    box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.header h2{
    font-size:21px;
    font-weight:bold;
}

/* =====================================================
   THEME ICON BUTTONS
===================================================== */

.theme-buttons{
    display:flex;
    align-items:center;
    gap:7px;
    flex-shrink:0;
}

.theme-btn{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:2px solid rgba(255,255,255,.4);
    border-radius:12px;

    background:rgba(255,255,255,.15);
    color:white;

    font-size:19px;
    cursor:pointer;

    transition:.2s;
}

.theme-btn:hover{
    background:rgba(255,255,255,.3);
    transform:translateY(-2px);
}

.theme-btn.active{
    background:white;
    border-color:white;
    color:#126b4b;
    transform:scale(1.08);
    box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.theme-btn:active{
    transform:scale(.92);
}

/* =====================================================
   MAIN GRID
===================================================== */

.list-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:15px;
    padding:15px;
}

/* =====================================================
   CARD
===================================================== */

.card{
    padding:18px;
    border-radius:18px;

    box-shadow:0 5px 15px rgba(0,0,0,.12);

    position:relative;
    overflow:hidden;

    transition:transform .25s,box-shadow .25s;
}

.card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:4px;

    background:linear-gradient(90deg,#00a86b,#00d084);
}

.card h3{
    margin:4px 0 18px;
    font-size:18px;
}

/* =====================================================
   ICON BUTTON GRID
===================================================== */

ul{
    list-style:none;

    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));

    gap:12px;
}

li{
    min-width:0;
}

.app-link{
    min-height:112px;
    width:100%;

    padding:12px 5px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:9px;

    text-align:center;
    text-decoration:none;

    border-radius:14px;

    font-size:12px;
    font-weight:bold;
    line-height:1.3;

    transition:
        transform .2s,
        background .2s,
        box-shadow .2s;

    cursor:pointer;
}

.app-icon{
    width:49px;
    height:49px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    font-size:27px;
    flex-shrink:0;
}

.app-link:hover{
    transform:translateY(-4px);

    box-shadow:0 5px 12px rgba(0,0,0,.12);
}

.app-link:active{
    transform:scale(.94);
}

/* =====================================================
   LIGHT THEME
===================================================== */

.light{
    background:#f3f7f5;
    color:#17231e;
}

.light .card{
    background:#fff;
}

.light .app-link{
    color:#126b4b;
    background:#f0f8f4;
}

.light .app-link:hover{
    background:#e1f3e9;
}

.light .app-icon{
    background:rgba(0,168,107,.13);
}

/* =====================================================
   DARK THEME
===================================================== */

.dark{
    background:#101513;
    color:#fff;
}

.dark .header{
    background:linear-gradient(135deg,#063d2c,#001f16);
}

.dark .card{
    background:#1b2521;
    box-shadow:0 5px 18px rgba(0,0,0,.4);
}

.dark .app-link{
    color:#8ff0c5;
    background:#222f29;
}

.dark .app-link:hover{
    background:#30483b;
}

.dark .app-icon{
    background:rgba(0,220,145,.14);
}

/* =====================================================
   BLUE THEME
===================================================== */

.blue{
    background:#eaf4ff;
    color:#122033;
}

.blue .header{
    background:linear-gradient(135deg,#1976d2,#1255a0);
}

.blue .card{
    background:#fff;
}

.blue .card::before{
    background:linear-gradient(90deg,#1976d2,#64b5f6);
}

.blue .app-link{
    color:#1565c0;
    background:#f0f6ff;
}

.blue .app-link:hover{
    background:#dfedff;
}

.blue .app-icon{
    background:rgba(25,118,210,.12);
}

/* =====================================================
   INFORMATION
===================================================== */

.info{
    margin:0 15px 15px;
    padding:13px;

    border-radius:14px;

    text-align:center;
    font-size:13px;
    opacity:.8;
}

/* =====================================================
   TABLET AND MOBILE
===================================================== */

@media(max-width:700px){

    .header{
        padding:12px;
    }

    .header h2{
        font-size:18px;
    }

    .list-grid{
        grid-template-columns:1fr;
        padding:12px;
    }

    .card{
        padding:16px;
    }

    ul{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:10px;
    }
}

/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:400px){

    .header{
        flex-wrap:wrap;
    }

    .header h2{
        font-size:17px;
    }

    .theme-btn{
        width:36px;
        height:36px;
        font-size:17px;
    }

    ul{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .app-link{
        min-height:105px;
        font-size:13px;
    }
}

</style>
</head>

<body class="light">

<!-- =====================================================
     HEADER
===================================================== -->

        <button
            class="theme-btn"
            data-theme="light"

            aria-label="Light Theme">

        </button>

        <button
            class="theme-btn"

            🌙
        </button>

        <button
            class="theme-btn"
            data-theme="blue"
            onclick="changeTheme('blue')"
            title="Blue Theme"
            aria-label="Blue Theme">
            💙
        </button>

    </div>

</div>

<!-- =====================================================
     DASHBOARD
===================================================== -->

<div class="list-grid">

    <div class="card">

        <h3>👨‍👩‍👧 Kids Manager</h3>

        <ul>

            <!-- KIDS ATTENDANCE -->

            <li>
                <a
                    class="app-link"
                    href="/Myself/finance/finattends.html"
                    onclick="openSwayamPage(event,this.href)">

                    <span class="app-icon">👦</span>
                    <span>Kids Attendance</span>

                </a>
            </li>

            <!-- KID SPENDS -->

            <li>
                <a
                    class="app-link"
                    href="/Myself/finance/finkid.html"
                    onclick="openSwayamPage(event,this.href)">

                    <span class="app-icon">💰</span>
                    <span>Kid Spends</span>

                </a>
            </li>

            <!-- SCHOOL ATTENDANCE -->

            <li>
                <a
                    class="app-link"
                    href="/Myself/age/Aug26_kidcal.html"
                    onclick="openSwayamPage(event,this.href)">

                    <span class="app-icon">📚</span>
                    <span>School Attendance</span>

                </a>
            </li>

            <!-- KIDS QUIZ -->

            <li>
                <a
                    class="app-link"
                    href="/Myself/age/Aug26_kquiz.html"
                    onclick="openSwayamPage(event,this.href)">

                    <span class="app-icon">🧠</span>
                    <span>Kids Quiz</span>

                </a>
            </li>

            <!-- KIDS REWARDS -->

            <li>
                <a
                    class="app-link"
                    href="/Myself/age/Aug26_reward.html"
                    onclick="openSwayamPage(event,this.href)">

                    <span class="app-icon">🏆</span>
                    <span>Kids Rewards</span>

                </a>
            </li>

            <!-- KIDS AGILE MASTER -->

            <li>
                <a
                    class="app-link"
                    href="/Myself/school/kidscrum.html"
                    onclick="openSwayamPage(event,this.href)">

                    <span class="app-icon">🚀</span>
                    <span>Kids Agile Master</span>

                </a>
            </li>

        </ul>

    </div>

</div>

<!-- =====================================================
     INFORMATION
===================================================== -->

<div class="info">

    🏠 <b>Kids Prabandhan</b> —
    Manage kids, school records and activities from Swayam.

</div>

<script>

/* =====================================================
   THEME MANAGEMENT
===================================================== */

function changeTheme(theme){

    if(!["light","dark","blue"].includes(theme)){
        theme="light";
    }

    document.body.className=theme;

    localStorage.setItem(
        "swayam_home_theme",
        theme
    );

    updateThemeButtons(theme);

}

/* =====================================================
   UPDATE ACTIVE THEME BUTTON
===================================================== */

function updateThemeButtons(theme){

    document.querySelectorAll(".theme-btn").forEach(function(btn){

        btn.classList.toggle(
            "active",
            btn.dataset.theme===theme
        );

    });

}

/* =====================================================
   LOAD SAVED THEME
===================================================== */

(function(){

    let savedTheme=localStorage.getItem("swayam_home_theme");

    if(!["light","dark","blue"].includes(savedTheme)){
        savedTheme="light";
    }

    document.body.className=savedTheme;

    updateThemeButtons(savedTheme);

})();

/* =====================================================
   SWAYAM PARENT NAVIGATION

   Opens selected page inside Swayam iframe.
===================================================== */

function openSwayamPage(event,url){

    event.preventDefault();

    try{

        if(
            window.parent &&
            window.parent!==window
        ){

            var frame=
                window.parent.document.getElementById("swayamFrame");

            if(frame){

                /* Load selected page */

                frame.src=url;

                /* Save selected page */

                try{

                    window.parent.localStorage.setItem(
                        "swayam_selected_page",
                        url.split("/").pop()
                    );

                }catch(e){}

                /* Update menu active state */

                var menuLinks=
                    window.parent.document.querySelectorAll(".menu-button");

                for(var i=0;i<menuLinks.length;i++){

                    menuLinks[i].classList.remove("active");

                }

                /* Activate matching menu */

                for(var j=0;j<menuLinks.length;j++){

                    var menuHref=
                        menuLinks[j].getAttribute("href");

                    if(
                        menuHref &&
                        menuHref.split("/").pop()===url.split("/").pop()
                    ){

                        menuLinks[j].classList.add("active");

                        try{

                            menuLinks[j].scrollIntoView({
                                behavior:"smooth",
                                block:"nearest",
                                inline:"center"
                            });

                        }catch(e){}

                        break;

                    }

                }

                return;

            }

        }

    }catch(error){

        console.log(
            "Swayam parent navigation error:",
            error
        );

    }

    /* Normal browser fallback */

    window.location.href=url;

}

</script>

</body>

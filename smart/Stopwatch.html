<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Advanced Glassmorphism Stopwatch</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow-x: hidden;
            padding: 16px;
        }

        /* Background ambient glowing spheres */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.25);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
            top: 10%;
            left: 10%;
            animation: float 8s ease-in-out infinite alternate;
        }

        .ambient-glow.two {
            background: rgba(236, 72, 153, 0.2);
            bottom: 10%;
            right: 10%;
            animation: float 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Main Glass Container - Responsive width */
        .stopwatch-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 1px rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            text-align: center;
        }

        /* Responsive Big Time Display */
        .time-display {
            font-family: 'Share Tech Mono', monospace;
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            margin-bottom: 15px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            flex-wrap: wrap;
        }

        .milliseconds {
            font-size: 1.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 4px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Controls / Buttons layout */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 16px;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-start.running {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }

        .btn-lap {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-lap:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-lap:disabled, .btn-reset:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-reset:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.3);
            color: white;
        }

        /* Scrollable Laps Section */
        .laps-container {
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            display: none;
        }

        .laps-container::-webkit-scrollbar {
            width: 5px;
        }

        .laps-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lap-number {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
        }

        .lap-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
        }

        .fastest {
            color: #34d399;
            border-color: rgba(52, 211, 153, 0.3);
        }

        .slowest {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.3);
        }

        /* Media Queries for Desktop enhancement */
        @media (min-width: 768px) {
            .stopwatch-card {
                padding: 40px;
                max-width: 540px;
            }
            .time-display {
                font-size: 4.5rem;
            }
            .milliseconds {
                font-size: 2.2rem;
            }
            h1 {
                font-size: 1.3rem;
            }
            .btn {
                padding: 16px 0;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow two"></div>

    <div class="stopwatch-card">
        <h1>Glass Stopwatch</h1>
        
        <div class="time-display">
            <span id="display">00:00:00</span><span class="milliseconds" id="milliseconds">.00</span>
        </div>

        <div class="controls">
            <button class="btn btn-reset" id="resetBtn" disabled>Reset</button>
            <button class="btn btn-lap" id="lapBtn" disabled>Lap</button>
            <button class="btn btn-start" id="startBtn">Start</button>
        </div>

        <div class="laps-container" id="lapsContainer"></div>
    </div>

    <script>
        let startTime = 0;
        let elapsedBeforePause = 0;
        let timerInterval = null;
        let isRunning = false;
        let laps = [];

        const display = document.getElementById('display');
        const millisecondsDisplay = document.getElementById('milliseconds');
        const startBtn = document.getElementById('startBtn');
        const lapBtn = document.getElementById('lapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapsContainer = document.getElementById('lapsContainer');

        function formatTime(time) {
            let hours = Math.floor(time / 3600000);
            let minutes = Math.floor((time % 3600000) / 60000);
            let seconds = Math.floor((time % 60000) / 1000);
            let ms = Math.floor((time % 1000) / 10);

            return {
                formattedTime: `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`,
                formattedMs: `.${String(ms).padStart(2, '0')}`
            };
        }

        function updateDisplay(time) {
            const { formattedTime, formattedMs } = formatTime(time);
            display.textContent = formattedTime;
            millisecondsDisplay.textContent = formattedMs;
        }

        function startStopwatch() {
            startTime = Date.now() - elapsedBeforePause;
            timerInterval = setInterval(() => {
                const currentTime = Date.now() - startTime;
                updateDisplay(currentTime);
            }, 10);

            isRunning = true;
            startBtn.textContent = 'Pause';
            startBtn.classList.add('running');
            lapBtn.disabled = false;
            resetBtn.disabled = false;
            lapsContainer.style.display = 'block';
        }

        function pauseStopwatch() {
            clearInterval(timerInterval);
            elapsedBeforePause = Date.now() - startTime;
            isRunning = false;
            startBtn.textContent = 'Resume';
            startBtn.classList.remove('running');
            lapBtn.disabled = true;
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                startStopwatch();
            } else {
                pauseStopwatch();
            }
        });

        lapBtn.addEventListener('click', () => {
            if (!isRunning) return;
            const currentTime = Date.now() - startTime;
            laps.push(currentTime);
            renderLaps();
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            isRunning = false;
            elapsedBeforePause = 0;
            startTime = 0;
            laps = [];
            updateDisplay(0);
            
            startBtn.textContent = 'Start';
            startBtn.classList.remove('running');
            lapBtn.disabled = true;
            resetBtn.disabled = true;
            lapsContainer.style.display = 'none';
            lapsContainer.innerHTML = '';
        });

        function renderLaps() {
            lapsContainer.innerHTML = '';
            
            let minTime = Math.min(...laps);
            let maxTime = Math.max(...laps);

            for (let i = laps.length - 1; i >= 0; i--) {
                const lapTime = laps[i];
                const prevLapTime = i > 0 ? laps[i - 1] : 0;
                const splitTime = lapTime - prevLapTime;

                const { formattedTime, formattedMs } = formatTime(splitTime);
                
                const lapItem = document.createElement('div');
                lapItem.className = 'lap-item';

                if (laps.length > 1) {
                    if (lapTime === minTime) lapItem.classList.add('fastest');
                    if (lapTime === maxTime) lapItem.classList.add('slowest');
                }

                lapItem.innerHTML = `
                    <span class="lap-number">Lap ${i + 1}</span>
                    <span class="lap-time">+${formattedTime}${formattedMs}</span>
                `;
                lapsContainer.appendChild(lapItem);
            }
        }
    </script>
</body>
</html>

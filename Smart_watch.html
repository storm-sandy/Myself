<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartwatch OS - Dashboard</title>
<style>
:root {
  --bg-color: #0b0f19;
  --card-bg: #131b2e;
  --accent: #00ffcc;
  --accent-glow: rgba(0, 255, 204, 0.2);
  --text-main: #e2e8f0;
  --text-muted: #94a3b8;
  --border-color: #1e293b;
  --danger: #ff5252;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* Header & Tab Navigation */
header {
  background: rgba(19, 27, 46, 0.8);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-color);
  padding: 12px 16px;
  text-align: center;
}

header h2 {
  font-size: 1.1rem;
  letter-spacing: 1px;
  color: var(--accent);
  margin-bottom: 10px;
  text-transform: uppercase;
}

.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none; /* Firefox */
}

.tabs::-webkit-scrollbar {
  display: none; /* Chrome/Safari */
}

.tab-btn {
  background: var(--border-color);
  border: none;
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.25s ease;
}

.tab-btn:hover {
  color: var(--text-main);
  background: #273548;
}

.tab-btn.active {
  background: var(--accent);
  color: #000;
  box-shadow: 0 0 12px var(--accent-glow);
}

/* Main Content Area */
main {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.tab-content {
  display: none;
  width: 100%;
  max-width: 480px;
  animation: fadeIn 0.3s ease-in-out;
}

.tab-content.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards & Components */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  text-align: center;
}

.card h3 {
  font-size: 0.95rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
}

.big {
  font-size: 2.8rem;
  font-weight: 800;
  color: var(--accent);
  text-shadow: 0 0 10px var(--accent-glow);
  margin-bottom: 4px;
}

#date {
  font-size: 0.95rem;
  color: var(--text-muted);
}

/* Inputs & Buttons */
input[type="time"],
input[type="number"],
input[type="file"] {
  background: var(--bg-color);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 1rem;
  outline: none;
  width: 100%;
  max-width: 220px;
  margin-bottom: 10px;
  text-align: center;
}

input[type="file"] {
  padding: 8px;
  font-size: 0.8rem;
}

button.action-btn {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 10px 20px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.2s ease;
  box-shadow: 0 0 10px var(--accent-glow);
  margin: 4px;
}

button.action-btn:active {
  transform: scale(0.96);
}

button.secondary-btn {
  background: var(--border-color);
  color: var(--text-main);
  border: none;
  padding: 10px 20px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  margin: 4px;
  transition: background 0.2s;
}

button.secondary-btn:hover {
  background: #273548;
}

.status-text {
  margin-top: 10px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* Compass Widget */
#compassDial {
  width: 140px;
  height: 140px;
  border: 3px solid var(--accent);
  border-radius: 50%;
  margin: 0 auto 12px auto;
  position: relative;
  box-shadow: inset 0 0 15px var(--accent-glow), 0 0 15px var(--accent-glow);
}

#needle {
  width: 4px;
  height: 70px;
  background: var(--danger);
  position: absolute;
  top: 0;
  left: 65px;
  transform-origin: bottom center;
  box-shadow: 0 0 8px var(--danger);
}

/* Utility specific layouts */
.row-btns {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
}

#battery {
  font-size: 2rem;
  font-weight: bold;
  color: var(--accent);
}

#speed, #steps, #timerDisplay, #moon {
  font-size: 2.2rem;
  font-weight: bold;
  color: var(--text-main);
  margin: 8px 0;
}
</style>
</head>

<body>

<header>
  <h2>Smartwatch OS</h2>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'tab-home')">Home</button>
    <button class="tab-btn" onclick="switchTab(event, 'tab-clock')">Clock</button>
    <button class="tab-btn" onclick="switchTab(event, 'tab-fitness')">Fitness</button>
    <button class="tab-btn" onclick="switchTab(event, 'tab-tools')">Tools</button>
    <button class="tab-btn" onclick="switchTab(event, 'tab-media')">Media</button>
  </div>
</header>

<main>
  <!-- HOME TAB -->
  <div id="tab-home" class="tab-content active">
    <div class="card">
      <div class="big" id="homeClock">00:00:00</div>
      <div id="homeDate">Loading...</div>
    </div>
    <div class="card">
      <h3>Battery Status</h3>
      <div id="battery">--%</div>
    </div>
  </div>

  <!-- CLOCK TAB -->
  <div id="tab-clock" class="tab-content">
    <div class="card">
      <h3>Alarm Manager</h3>
      <input type="time" id="alarmTime">
      <div>
        <button class="action-btn" onclick="setAlarm()">Set Alarm</button>
      </div>
      <div class="status-text" id="alarmStatus">No alarm configured</div>
    </div>

    <div class="card">
      <h3>Stopwatch</h3>
      <div id="stopwatch">00:00:00</div>
      <div class="row-btns">
        <button class="action-btn" onclick="startSW()">Start</button>
        <button class="secondary-btn" onclick="stopSW()">Stop</button>
        <button class="secondary-btn" onclick="resetSW()">Reset</button>
      </div>
    </div>

    <div class="card">
      <h3>Countdown Timer</h3>
      <input type="number" id="timerInput" placeholder="Seconds">
      <div>
        <div id="timerDisplay">0</div>
        <button class="action-btn" onclick="startTimer()">Start Timer</button>
      </div>
    </div>
  </div>

  <!-- FITNESS TAB -->
  <div id="tab-fitness" class="tab-content">
    <div class="card">
      <h3>Step Counter</h3>
      <div id="steps">0</div>
      <button class="secondary-btn" onclick="resetSteps()">Reset Steps</button>
    </div>

    <div class="card">
      <h3>GPS Speedometer</h3>
      <div id="speed">0.0 km/h</div>
    </div>
  </div>

  <!-- TOOLS TAB -->
  <div id="tab-tools" class="tab-content">
    <div class="card">
      <h3>Graphical Compass</h3>
      <div id="compassDial">
        <div id="needle"></div>
      </div>
      <div id="direction" style="font-weight: bold; color: var(--accent);">0°</div>
    </div>

    <div class="card">
      <h3>Moon Phase</h3>
      <div id="moon">--</div>
    </div>
  </div>

  <!-- MEDIA TAB -->
  <div id="tab-media" class="tab-content">
    <div class="card">
      <h3>Music Player</h3>
      <input type="file" id="musicFile" accept="audio/*">
      <div class="row-btns" style="margin-top: 12px;">
        <button class="action-btn" onclick="playMusic()">Play</button>
        <button class="secondary-btn" onclick="pauseMusic()">Pause</button>
        <button class="secondary-btn" onclick="stopMusic()">Stop</button>
      </div>
    </div>
    <audio id="audioPlayer"></audio>
  </div>
</main>

<script>
/* TAB SWITCHING LOGIC */
function switchTab(evt, tabId) {
  let contents = document.getElementsByClassName("tab-content");
  for (let c of contents) {
    c.classList.remove("active");
  }

  let buttons = document.getElementsByClassName("tab-btn");
  for (let b of buttons) {
    b.classList.remove("active");
  }

  document.getElementById(tabId).classList.add("active");
  evt.currentTarget.classList.add("active");
}

/* CLOCK & HOME UPDATE */
function updateClock(){
  let now = new Date();
  let timeStr = now.toLocaleTimeString();
  let dateStr = now.toDateString();

  if(document.getElementById("clock")) document.getElementById("clock").innerText = timeStr;
  if(document.getElementById("homeClock")) document.getElementById("homeClock").innerText = timeStr;
  if(document.getElementById("date")) document.getElementById("date").innerText = dateStr;
  if(document.getElementById("homeDate")) document.getElementById("homeDate").innerText = dateStr;
}
setInterval(updateClock, 1000);
updateClock();

/* ALARM */
let alarmTime = null;
function setAlarm(){
  alarmTime = document.getElementById("alarmTime").value;
  if(alarmTime) {
    document.getElementById("alarmStatus").innerText = "Alarm set for " + alarmTime;
  }
}

setInterval(()=>{
  let now = new Date();
  let time = now.toTimeString().slice(0,5);
  if(alarmTime && time == alarmTime){
    alert("Alarm ringing!");
    alarmTime = null;
    document.getElementById("alarmStatus").innerText = "Alarm went off";
  }
}, 1000);

/* STOPWATCH */
let swInterval;
let swTime = 0;

function startSW(){
  clearInterval(swInterval);
  swInterval = setInterval(()=>{
    swTime++;
    displaySW();
  }, 1000);
}

function stopSW(){
  clearInterval(swInterval);
}

function resetSW(){
  clearInterval(swInterval);
  swTime = 0;
  displaySW();
}

function displaySW(){
  let h = Math.floor(swTime / 3600);
  let m = Math.floor((swTime % 3600) / 60);
  let s = swTime % 60;

  document.getElementById("stopwatch").innerText =
    String(h).padStart(2,"0") + ":" +
    String(m).padStart(2,"0") + ":" +
    String(s).padStart(2,"0");
}

/* TIMER */
let timerInt;
function startTimer(){
  let t = parseInt(document.getElementById("timerInput").value);
  if(isNaN(t) || t <= 0) return;
  
  clearInterval(timerInt);
  document.getElementById("timerDisplay").innerText = t;

  timerInt = setInterval(()=>{
    if(t <= 1){
      clearInterval(timerInt);
      document.getElementById("timerDisplay").innerText = "0";
      alert("Timer finished!");
      return;
    }
    t--;
    document.getElementById("timerDisplay").innerText = t;
  }, 1000);
}

/* MOON PHASE */
function moonPhase(){
  let lp = 2551443;
  let now = new Date();
  let new_moon = new Date(1970,0,7,20,35,0);
  let phase = ((now - new_moon) / 1000) % lp;
  let days = Math.floor(phase / (24 * 3600));
  document.getElementById("moon").innerText = "Lunar Day " + days;
}
moonPhase();

/* BATTERY */
if(navigator.getBattery){
  navigator.getBattery().then(function(battery){
    function updateBattery(){
      document.getElementById("battery").innerText = Math.round(battery.level * 100) + "%";
    }
    updateBattery();
    battery.addEventListener("levelchange", updateBattery);
  });
} else {
  document.getElementById("battery").innerText = "N/A";
}

/* GRAPHICAL COMPASS */
window.addEventListener("deviceorientation", function(e){
  let dir = e.alpha || 0;
  let needle = document.getElementById("needle");
  let direction = document.getElementById("direction");
  if(needle && direction) {
    needle.style.transform = "rotate(" + dir + "deg)";
    direction.innerText = Math.round(dir) + "°";
  }
});

/* GPS SPEED */
if(navigator.geolocation){
  navigator.geolocation.watchPosition(function(pos){
    let speed = pos.coords.speed;
    if(speed == null) speed = 0;
    speed = speed * 3.6;
    document.getElementById("speed").innerText = speed.toFixed(1) + " km/h";
  }, function(err){
    // Handle error or ignore silently if GPS unavailable
  });
}

/* STEP COUNTER */
let steps = 0;
window.addEventListener("devicemotion", function(e){
  if(!e.accelerationIncludingGravity) return;
  let acc = e.accelerationIncludingGravity;
  let total = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
  if(total > 25){
    steps++;
    document.getElementById("steps").innerText = steps;
  }
});

function resetSteps(){
  steps = 0;
  document.getElementById("steps").innerText = 0;
}

/* MUSIC PLAYER */
let player = document.getElementById("audioPlayer");
document.getElementById("musicFile").addEventListener("change", function(){
  let file = this.files[0];
  if(file){
    player.src = URL.createObjectURL(file);
    player.load();
  }
});

function playMusic(){
  player.play().catch(e => console.log("Playback prevented or no file selected"));
}

function pauseMusic(){
  player.pause();
}

function stopMusic(){
  player.pause();
  player.currentTime = 0;
}
</script>

</body>
</html>
